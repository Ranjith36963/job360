on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: route
        env:
          R: ${{ needs.verify.result }}
        run: |
          if [ "$R" = success ]; then
            cat > body.md <<BODY
          if this looks wrong, re-run the job
          BODY
          elif [ "$R" = failure ]; then
            mode=failed
          fi
