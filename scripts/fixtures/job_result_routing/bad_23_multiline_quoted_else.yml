on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: route
        env:
          R: ${{ needs.verify.result }}
        run: |
          if [ "$R" = success ]; then
            mode=ship
          elif [ "$R" = failure ]; then
            gh pr comment "$PR" --body "Verify failed.
          else re-run it by hand"
          fi
