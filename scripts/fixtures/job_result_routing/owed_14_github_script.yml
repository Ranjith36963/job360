on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          R: ${{ needs.verify.result }}
        with:
          script: |
            let mode = 'none';
            if (process.env.R === 'success') mode = 'ship';
            else if (process.env.R === 'failure') mode = 'failed';
