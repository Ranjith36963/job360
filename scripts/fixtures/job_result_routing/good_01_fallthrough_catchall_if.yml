on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: route
        env:
          R: ${{ needs.verify.result }}
        run: |
          if [ "$R" = success ]; then
            exit 0
          elif [ "$R" = failure ]; then
            echo "::error::verify failed"; exit 1
          fi
          echo "::error::verify did not finish: $R"
          exit 1
