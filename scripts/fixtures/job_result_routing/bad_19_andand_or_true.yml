on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: route
        env:
          R: ${{ needs.verify.result }}
        run: |
          set -e
          mode=none
          [ "$R" = success ] && mode=ship || true
          [ "$R" = failure ] && mode=failed || true
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
