on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: route
        env:
          R: ${{ needs.verify.result }}
        run: |
          if [ "$R" = success ]; then
            mode=ship
          elif [ "$R" = failure ]; then
            cat > body.md <<BODY
          else you can re-run it by hand
          BODY
          fi
