on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: route
        env:
          R: ${{ needs.verify.result }}
        run: |
          if [ -z "$R" ]; then echo none
          else case "$R" in
            success) mode=ship ;;
            failure) mode=failed ;;
          esac
          fi
