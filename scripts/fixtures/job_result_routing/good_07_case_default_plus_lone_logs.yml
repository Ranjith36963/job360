on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: route
        env:
          R: ${{ needs.verify.result }}
        run: |
          case "$R" in
            success) mode=ship ;;
            *) mode=incomplete ;;
          esac
          [ "$R" = success ] && echo "::notice::shipping"
          [ "$R" = failure ] && echo "::warning::verify failed, see logs"
