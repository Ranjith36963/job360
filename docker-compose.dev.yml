# Local dev infrastructure for Phase −2 manual verification.
#
# Spins up only what the test suite + frontend dev server can't fake:
#   - Redis 7 for the ARQ worker (Phase −2 item C).
#
# Not for production. SES, persistent volumes, healthchecks etc are added
# when the deployment story exists.
#
# Usage::
#
#   docker compose -f docker-compose.dev.yml up -d   # start in background
#   docker compose -f docker-compose.dev.yml down    # stop + clean
#   make worker                                       # then run the worker
#
# Or via Makefile shortcuts: `make redis-up` / `make redis-down`.

services:
  redis:
    image: redis:7-alpine
    container_name: job360-dev-redis
    restart: unless-stopped
    ports:
      # Bind to localhost only — never accept external traffic in dev.
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    # In-memory only is fine for dev — restart wipes queued jobs, which is
    # what we usually want anyway.

  # Postgres 16 for the SQLite -> Postgres migration (Phase 1).
  # Host port 5433 (5432 is reserved/blocked on this Windows box).
  # DATABASE_URL=postgresql://job360:job360dev@localhost:5433/job360
  postgres:
    image: pgvector/pgvector:pg16
    container_name: job360-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: job360
      POSTGRES_PASSWORD: job360dev
      POSTGRES_DB: job360
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - job360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job360 -d job360"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  job360_pgdata:
