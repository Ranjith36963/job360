# The standing accuracy instrument (eval-loop PR-C, 2026-08-06).
#
# WHY: ranking accuracy was only ever measured when someone remembered to.
# The one manual audit found the shown top-100 at 39% strong precision with
# 28% outright junk; two measured fix iterations took it to 78% with a 100%
# first page. This workflow makes that measurement WEEKLY and gives it a
# NOTIFIER (the Law: an artifact with no notifier dies) — on regression it
# opens/updates a `harness`-labelled issue and wakes the triage loop.
#
# Judges ~160 jobs against the biggest real profile via the shared free LLM
# chain — read-only on the DB, no feed writes.
name: accuracy-audit

on:
  schedule:
    - cron: "20 6 * * 1" # weekly, Monday 06:20 UTC (clear of the 04:00 refresh)
  workflow_dispatch: {} # the drill entrance — every loop must be fireable on purpose

permissions:
  contents: read
  issues: write
  actions: write # hand a regression to the triage loop

concurrency:
  group: accuracy-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend (runtime deps only)
        working-directory: backend
        run: pip install -q -e .
      - name: Run the ranking audit
        id: audit
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # GROQ is the 4th provider the judge chain will try (llm_provider.py) and
          # was the only one this job never passed through. One more free fallback.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SESSION_SECRET: audit-only-not-used-0000000000000000
          CHANNEL_ENCRYPTION_KEY: sk9vWl9wZmMtc2VjcmV0LWtleS0zMzMzMzMzMzM=
        run: |
          set -o pipefail
          python scripts/eval_ranking.py 2>&1 | tee audit.out
          echo "rc=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true
      # TWO DIFFERENT ALARMS, because they have two different fixes.
      #
      #   "REGRESSED"        -> we measured the ranking and the number is bad. Engineering work.
      #   "CANNOT RUN"       -> we measured NOTHING. Config work (usually a missing secret).
      #
      # They shared one title until 2026-08-11, so runs 31107748440 and 31368793516 —
      # where all 160 judge calls died on "No LLM API key configured", because an
      # unset Actions secret renders as an EMPTY string — were filed as an accuracy
      # regression (issue #238). A config error wearing a quality-regression costume
      # is how a week of eval data gets misread.
      - name: Notify (config failure and accuracy regression are DIFFERENT alarms)
        id: notify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          REG_TITLE="Accuracy audit REGRESSED (weekly ranking eval)"
          BROKEN_TITLE="Accuracy audit CANNOT RUN (instrument broken, not a regression)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          find_issue() {
            gh issue list --state open --json number,title \
              --jq ".[] | select(.title==\"$1\") | .number" | head -1
          }
          raise() { # $1 = title, $2 = body file
            n=$(find_issue "$1")
            if [ -z "$n" ]; then
              new=$(gh issue create --title "$1" --body-file "$2" --label harness)
              n="${new##*/}"
              gh workflow run triage.yml -f issue="$n" \
                || echo "::warning::issue #$n raised but triage could not be woken"
            else
              gh issue comment "$n" --body-file "$2"
            fi
          }
          close_if_open() { # $1 = title, $2 = closing comment
            n=$(find_issue "$1")
            if [ -n "$n" ]; then gh issue close "$n" --comment "$2"; fi
          }

          if grep -q "INSTRUMENT BROKEN" backend/audit.out; then
            { echo "**The weekly ranking audit measured NOTHING — the instrument is broken.**"
              echo
              echo "This is a CONFIG failure. Do **not** read it as a ranking regression:"
              echo "no accuracy number was produced at all."
              echo
              echo '```'
              { grep -E "INSTRUMENT BROKEN|ERROR:" backend/audit.out || tail -20 backend/audit.out; } | head -8 || true
              echo '```'
              echo
              echo "Usual cause: an unset repo Actions secret renders as an EMPTY string, so"
              echo "the judge gets no key. Set ONE of \`OPENAI_API_KEY\` (recommended),"
              echo "\`GEMINI_API_KEY\`, \`GROQ_API_KEY\`, \`CEREBRAS_API_KEY\` and re-run"
              echo "(\`gh workflow run accuracy-audit.yml\`) — no code change is needed."
              echo
              echo "- Run: $RUN_URL"
              echo "- Instrument: backend/scripts/eval_ranking.py (exit 3 = broken, exit 2 = regressed)"
            } > body.md
            raise "$BROKEN_TITLE" body.md
            echo "announce=broken" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.audit.outcome }}" = "failure" ] || \
               grep -q "REGRESSED" backend/audit.out; then
            { echo "The weekly ground-truth ranking audit fell below its alarm floors."
              echo
              echo '```'
              grep -A 12 "ACCURACY SCOREBOARD" backend/audit.out || tail -20 backend/audit.out
              echo '```'
              echo
              echo "- Run: $RUN_URL"
              echo "- Instrument: backend/scripts/eval_ranking.py (floors: EVAL_MIN_STRONG_100, EVAL_MAX_GEMS)"
            } > body.md
            raise "$REG_TITLE" body.md
            echo "announce=regressed" >> "$GITHUB_OUTPUT"
            echo "scoreboard=$(grep -A 12 'ACCURACY SCOREBOARD' backend/audit.out 2>/dev/null | grep -m1 -E 'strong|precision' | head -c 120 | tr -d '\r')" >> "$GITHUB_OUTPUT"
          else
            close_if_open "$REG_TITLE" "Accuracy back within benchmark as of run $RUN_URL. (auto-close)"
            close_if_open "$BROKEN_TITLE" "The instrument ran and produced judgments again as of run $RUN_URL. (auto-close)"
            echo "announce=ok" >> "$GITHUB_OUTPUT"
          fi

      # ── SLACK ──────────────────────────────────────────────────────────────
      # TWO alarms, TWO channels, for the same reason they are two issues.
      #
      #   CANNOT RUN -> needs-your-decision. We measured NOTHING. The usual cause
      #     is an unset Actions secret, which renders as an EMPTY string, and the
      #     fix is a human setting a key — no loop can do it. "A secret is
      #     missing" is named in the routing table as a decision case.
      #
      #   REGRESSED  -> log-github-ci, NOT production-incidents. Ranking quality
      #     dropped below its floor: results got worse, nothing BROKE. Nobody's
      #     Tuesday is ruined, an issue is open and triage has it, and the loop
      #     can proceed. Promoting quality drift into the incident channel is
      #     exactly how that channel stops being read.
      - name: Slack — the instrument measured nothing
        if: always() && steps.notify.outputs.announce == 'broken'
        uses: ./.github/actions/slack
        with:
          channel: needs-your-decision
          severity: warn
          title: "Accuracy audit CANNOT RUN — the instrument is broken, not the ranking"
          body: |
            The weekly ranking eval produced NO accuracy number at all. Do not
            read this as a regression. Usual cause: an unset repo Actions secret
            renders as an empty string, so the judge chain gets no key.

            Fix: set ONE of OPENAI_API_KEY / GEMINI_API_KEY / GROQ_API_KEY /
            CEREBRAS_API_KEY, then re-run. No code change is needed.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Slack — ranking accuracy regressed
        if: always() && steps.notify.outputs.announce == 'regressed'
        uses: ./.github/actions/slack
        with:
          channel: log-github-ci
          severity: warn
          title: "Accuracy audit REGRESSED — ranking fell below its floor"
          body: |
            ${{ steps.notify.outputs.scoreboard }}

            The weekly ground-truth ranking audit fell below its alarm floors.
            An issue is open and triage has it. Results are worse, not broken.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Slack — accuracy within benchmark
        if: always() && steps.notify.outputs.announce == 'ok'
        uses: ./.github/actions/slack
        with:
          channel: log-github-ci
          severity: info
          title: "accuracy-audit: ranking is within benchmark"
          body: |
            The weekly ranking eval ran and passed its floors.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
