name: Security scanning

# H7 — continuous security scanning: dependency CVEs (backend + frontend),
# leaked secrets, and Python static analysis. Runs on every push/PR and weekly.
#
# The dependency-audit jobs are non-blocking for now (continue-on-error /
# `|| true`) so they SURFACE issues without blocking existing PRs; tighten to
# blocking once the current backlog is triaged. gitleaks + bandit are advisory
# too until the codebase is clean.

# Unfiltered `push` + `pull_request` double-fires: a push to a branch with an open
# PR runs the same commit twice. Filtering push to main gives branches exactly one
# run (via the PR) and main exactly one run (via the push).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # 04:00 UTC every Monday
  workflow_dispatch: {}

# A newer push supersedes the run it replaces; don't pay for the stale one.
# run_id keeps each scheduled/dispatched run in its own group so a push to main
# can never cancel the weekly scan.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (backend deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + pip-audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."
          python -m pip install pip-audit
      - name: Audit installed dependencies
        working-directory: backend
        # Advisory (reports but does not block) until the backlog is triaged.
        # The only outstanding finding is aiohttp <3.14 (11 CVEs, fixed in 3.14.1),
        # but aiohttp is deliberately pinned <3.14 because 3.14 breaks aioresponses
        # 0.7.8 — our offline test HTTP mock (see backend/pyproject.toml). Lift the
        # `|| true` and bump aiohttp the moment aioresponses supports 3.14.
        run: python -m pip_audit --progress-spinner off || true

  npm-audit:
    name: npm audit (frontend deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies (high+)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    name: bandit (python static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install bandit
      - name: Run bandit (medium+ severity)
        # Skip B608 (hardcoded_sql_expressions): every hit is in the psycopg shim
        # (src/repositories/pg.py) which translates SQL *structure* while binding
        # ALL values as %s parameters — not injectable. B608 is a known false
        # positive for query-builder/translator code. Bandit still blocks on every
        # other rule (real high/medium findings surface loudly).
        run: bandit -r backend/src -ll -s B608
