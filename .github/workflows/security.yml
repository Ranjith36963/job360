name: Security scanning

# H7 — continuous security scanning: dependency CVEs (backend + frontend),
# leaked secrets, and Python static analysis. Runs on every push/PR and weekly.
#
# H7 (closed 2026-07-18): ALL FOUR JOBS ARE BLOCKING. They were all advisory
# "until the codebase is clean"; nobody came back to check whether that day had
# arrived. It had — verified against a clean CI runner (run 29648821735, PR #88),
# which is the only trustworthy source here (a local pip-audit reads whatever
# else shares your interpreter):
#   npm audit  — "found 0 vulnerabilities"
#   gitleaks   — "no leaks found"
#   bandit     — "No issues identified" (22,619 lines)
#   pip-audit  — was 11 CVEs, ALL in aiohttp 3.13.5. Now ZERO: aiohttp is
#                >=3.14.1 and the waiver list is empty. The aioresponses
#                incompatibility that blocked the upgrade is handled by a
#                test-only shim in backend/tests/conftest.py.
#
# Do NOT reintroduce `continue-on-error` or `|| true` to turn a red build green.
# A scanner that cannot fail the build is a scanner nobody reads: all four
# reported "pass" for months while pip-audit sat on 11 known CVEs. If a new CVE
# lands, fix or explicitly waive it (pip-audit --ignore-vuln <ID> with a comment
# saying why) — never re-mute the whole scanner.

# Unfiltered `push` + `pull_request` double-fires: a push to a branch with an open
# PR runs the same commit twice. Filtering push to main gives branches exactly one
# run (via the PR) and main exactly one run (via the push).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # 04:00 UTC every Monday
  workflow_dispatch: {}

# A newer push supersedes the run it replaces; don't pay for the stale one.
# run_id keeps each scheduled/dispatched run in its own group so a push to main
# can never cancel the weekly scan.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (backend deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # AUDITS THE LOCKS, NOT A FRESH RESOLVE (2026-10-20). It used to install
      # `-e .` and audit whatever pip resolved that day, and never the [browser]
      # extra (REAL-OR-FAKE §11). The three locks are the exact sets that ship
      # (runtime, runtime + Playwright) and that CI runs with its tokens (dev);
      # every entry is pinned and hashed, so --require-hashes --disable-pip audits them
      # as written, with no resolution and no install.
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Audit the locked dependencies (runtime, browser, dev)
        working-directory: backend
        # BLOCKING with ZERO waivers. A CVE in ANY backend dependency fails the
        # build — there is nothing on the ignore list to hide behind.
        #
        # The 11 aiohttp waivers that used to live here are GONE because the
        # underlying CVEs are actually fixed: aiohttp is now >=3.14.1. The pin
        # that blocked that upgrade (aioresponses not passing `stream_writer`)
        # is handled by a test-only shim in backend/tests/conftest.py.
        #
        # If a new CVE appears: fix it. Waive by ID only as a last resort, with
        # a comment naming what blocks the fix and what would unblock it.
        run: |
          python -m pip_audit --progress-spinner off --require-hashes --disable-pip \
            -r requirements.lock.txt -r requirements-browser.lock.txt -r requirements-dev.lock.txt

  # WHAT THIS PR ADDS, NOT WHAT IS ALREADY INSTALLED (2026-10-20). pip-audit and
  # npm audit read today's set; this reads the PR's manifest diff (the hashed
  # backend locks give it every Python transitive) and fails on a newly added
  # dependency with a high or critical advisory. Only a pull_request has a diff:
  # on push / schedule the step is skipped and the job reports success, so it
  # can become a required check without blocking main.
  dependency-review:
    name: dependency-review (new deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
      - name: Review the dependencies this PR adds
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  npm-audit:
    name: npm audit (frontend deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"  # 2026-10-20: matches frontend/Dockerfile and ci.yml (Node 20 is end of life)
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      # BLOCKING gate — production dependencies only. These are the packages
      # that actually ship in the Next.js bundle and run in front of users, so a
      # high/critical here must stop the build.
      - name: Audit PRODUCTION dependencies (blocking, high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # NON-BLOCKING — dev/build tooling (eslint, vitest, openapi-typescript).
      # These never reach a user: they run on this runner and on a developer's
      # laptop, and are not part of the deployed bundle. They were made blocking
      # by default, which produced a real deadlock on 2026-07-27: a
      # brace-expansion DoS advisory (patched only in 5.0.8) hit 14 dev packages,
      # but forcing 5.x breaks @eslint/config-array — verified, eslint crashes in
      # pathMatches. Fixing the report would have broken the toolchain, so the
      # gate would have blocked every PR indefinitely for a vulnerability with no
      # user-facing exposure. Reported for visibility, does not block.
      - name: Audit dev dependencies (report only)
        working-directory: frontend
        continue-on-error: true
        run: |
          echo "::group::dev-dependency advisories (informational)"
          npm audit --audit-level=high || true
          echo "::endgroup::"
          echo "Dev-tooling advisories do not block: they are not in the shipped bundle." >> "$GITHUB_STEP_SUMMARY"

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    name: bandit (python static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install bandit
      - name: Run bandit (medium+ severity)
        # Skip B608 (hardcoded_sql_expressions): every hit is in the psycopg shim
        # (src/repositories/pg.py) which translates SQL *structure* while binding
        # ALL values as %s parameters — not injectable. B608 is a known false
        # positive for query-builder/translator code. Bandit still blocks on every
        # other rule (real high/medium findings surface loudly).
        run: bandit -r backend/src -ll -s B608

  # Failures on main / on the schedule are reported as an issue by loop-red.yml
  # (one workflow_run watcher, so PRs no longer show a 'skipping' row for it).
