name: Verify (the eyes)

# ═══════════════════════════════════════════════════════════════════════════
# THE BLIND SPOT THIS CLOSES
#
# The old cage judged a change by its FILENAME. Its own comment admits the
# limit, on `backend/src/api/routes/profile.py`:
#
#   "a per-user API route — a filename cannot tell a logging fix from a
#    removed `Depends(require_user)`."
#
# That sentence is true, and the conclusion drawn from it was wrong. The cage
# concluded "so refuse the file". The right conclusion is "so ASK SOMETHING
# THAT CAN SEE IT."
#
# Something that can see it already existed in this repo, unconnected:
#
#   backend/tests/test_route_auth_coverage.py
#     enumerates EVERY route out of the routers in a clean subprocess and fails
#     unless each one either reaches `require_user` / `require_verified_user` /
#     `optional_user`, or is on an explicit PUBLIC_ROUTES list.
#
# A removed `Depends(require_user)` cannot survive that test. So the file does
# not need to be denied — it needs that test to be a REQUIRED TAG. That is all
# this workflow is.
#
# THE GENERAL RULE, worth more than this one file:
#
#   ┌─────────────────────────────────────────────────────────────────────┐
#   │  A DENY IS A DEBT, NOT A VERDICT.                                   │
#   │  Every denied path must name the test that would let it out.        │
#   │  No such test = write it. Test exists = connect it and open the door│
#   └─────────────────────────────────────────────────────────────────────┘
#
# HONESTY
# No model participates in this workflow. There is nothing here to persuade.
# Every tag is an exit code from a process that ran the real thing. The verdict
# is a check run named `verify`, and a missing `verify` is NOT a pass — the
# merge cage treats absence as "wait", never as "fine".
# ═══════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {} # drill entrance — every guard must be fireable on demand

concurrency:
  group: verify-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # RUN EACH TEST ONCE (CI audit, 2026-10-19).
  #
  # Q1-Q3 below are four files of the backend suite, and the frontend eye is
  # `npx playwright test`. ci-offline.yml already runs BOTH, on this same PR,
  # on this same merge tree, as REQUIRED checks: `offline-suite` (the whole
  # pytest suite, nothing deselected) and `frontend-e2e` (every spec). Running
  # them here too cost ~3 runner-minutes per PR for the same answer.
  #
  # So each eye asks the SAME classifier ci-offline.yml asks (same script, same
  # base, same checkout -> same answer) and defers ONLY where that job really
  # runs the thing:
  #   backend eye   defers when scope is `full`   (offline-suite runs pytest)
  #   frontend eye  defers when scope is `full` or `frontend` (frontend-e2e
  #                 runs Playwright); on `docs` it drives the browser itself
  # Anything else -- an unknown word, a failed classifier, a dispatch (the
  # drill entrance, where no ci-offline run exists) -- runs here, as before.
  #
  # A deferral is not a pass on its own: scripts/merge_cage.py's `verify` tag
  # names `offline-suite` and `frontend-e2e` alongside the two eyes, so the
  # tag still needs the run that actually happened to be green. The eyes keep
  # their check names; the summary says which ran here and which deferred.
  # ───────────────────────────────────────────────────────────────────────
  scope:
    name: Scope (which eyes ci-offline already covers)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.decide.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the diff needs the base commit
      - name: The scope classifier can still fail
        run: python scripts/ci_scope.py --drill
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          scope=$(python scripts/ci_scope.py --event "$EVENT" --base "$BASE_SHA" --head HEAD --print-scope --summary)
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────
  # BACKEND EYES — boot the real app against a real Postgres and ask it
  # questions a filename cannot answer.
  # ───────────────────────────────────────────────────────────────────────
  backend-eyes:
    name: verify / backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [scope]

    # Mirrors ci-offline.yml's offline-suite job (the one backend pytest run). NOT re-invented: a verifier that
    # stands somewhere different from CI answers a different question, and then
    # the two disagree and you trust neither.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: job360
          POSTGRES_PASSWORD: job360dev
          POSTGRES_DB: job360
        options: >-
          --health-cmd "pg_isready -U job360 -d job360"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports: ["5432:5432"]

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgresql://job360:job360dev@localhost:5432/job360
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      CHANNEL_ENCRYPTION_KEY: ci-test-channel-key-not-used-in-prod

    steps:
      # Deferred: offline-suite runs these four files inside the full suite on
      # this same tree. Say so, loudly, instead of a silent green.
      - name: "Q1-Q3 ran in offline-suite (ci-offline.yml) on this same tree"
        if: ${{ !(github.event_name != 'pull_request' || needs.scope.outputs.scope != 'full') }}
        run: |
          {
            echo "### verify / backend — deferred to \`offline-suite\`"
            echo ""
            echo "Scope \`${{ needs.scope.outputs.scope }}\`: ci-offline.yml \`offline-suite\` runs the FULL pytest"
            echo "suite on this PR's merge tree, which contains Q1-Q3 (route auth, IDOR + tenancy,"
            echo "the e2e lifecycle). They are not run a second time here."
            echo "The merge cage's \`verify\` tag requires \`offline-suite\` green by name."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'pull_request' || needs.scope.outputs.scope != 'full'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: github.event_name != 'pull_request' || needs.scope.outputs.scope != 'full'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (with dev extras)
        if: github.event_name != 'pull_request' || needs.scope.outputs.scope != 'full'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # ── The three questions a path cage cannot ask ───────────────────────
      # Each one is an EXISTING test file. Nothing is invented here; the whole
      # point is that the answers were already sitting in the repo unread.
      # (A fourth, "do the owner's product rules still hold?", ran
      # tests/test_design_rules.py, deleted in #499; its rule #29 guard now
      # lives in test_slice5_fixes.py, inside offline-suite. The step only
      # printed a notice on every run, so it was removed 2026-10-20.)

      - name: "Q1 — is every route still auth-classified on purpose?"
        if: github.event_name != 'pull_request' || needs.scope.outputs.scope != 'full'
        working-directory: backend
        run: python -m pytest tests/test_route_auth_coverage.py -q -p no:randomly

      - name: "Q2 — can one user still reach another user's data?"
        if: github.event_name != 'pull_request' || needs.scope.outputs.scope != 'full'
        working-directory: backend
        run: python -m pytest tests/test_api_idor.py tests/test_tenancy_isolation.py -q -p no:randomly

      - name: "Q3 — does a whole user journey still work end to end?"
        if: github.event_name != 'pull_request' || needs.scope.outputs.scope != 'full'
        working-directory: backend
        run: python -m pytest tests/test_e2e_lifecycle.py -q -p no:randomly

  # ───────────────────────────────────────────────────────────────────────
  # FRONTEND EYES — a real Chromium clicks the real buttons.
  #
  # You asked how I would honestly check the frontend. This is the answer, and
  # it is not "I looked at the code and it seems fine": Playwright drives a
  # PRODUCTION build (`playwright.config.ts` deliberately does not use `npm run
  # dev` — dev-mode per-route compilation blew the 30s timeout on CI runners).
  #
  # 14 specs already exist. They cover auth, profile + extraction, bring a job
  # (paste and URL), the applications spine, tailoring, receipts, contacts,
  # sharing, connecting an agent, and OAuth consent.
  #
  # When it fails, the trace and the screenshot are uploaded. That is the
  # honesty mechanism: you do not have to take my word for what the page looked
  # like, you can open the picture.
  # ───────────────────────────────────────────────────────────────────────
  frontend-eyes:
    name: verify / frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [scope]

    steps:
      # Deferred: ci-offline.yml `frontend-e2e` drives the same specs, same
      # config, on this same tree, and keeps the report + traces (14 days).
      - name: "Playwright ran in frontend-e2e (ci-offline.yml) on this same tree"
        if: ${{ !(github.event_name != 'pull_request' || (needs.scope.outputs.scope != 'full' && needs.scope.outputs.scope != 'frontend')) }}
        run: |
          {
            echo "### verify / frontend — deferred to \`frontend-e2e\`"
            echo ""
            echo "Scope \`${{ needs.scope.outputs.scope }}\`: ci-offline.yml \`frontend-e2e\` runs \`npx playwright test\`"
            echo "(every spec in frontend/tests/e2e, real Chromium, production build) on this PR's"
            echo "merge tree. It is not run a second time here. Its evidence — report, traces and"
            echo "screenshots — is the \`playwright-evidence-${{ github.event.pull_request.number }}\` artifact on that run,"
            echo "and its coverage bound (quarantined specs) is in that run's summary."
            echo "The merge cage's \`verify\` tag requires \`frontend-e2e\` green by name."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'pull_request' || (needs.scope.outputs.scope != 'full' && needs.scope.outputs.scope != 'frontend')
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: github.event_name != 'pull_request' || (needs.scope.outputs.scope != 'full' && needs.scope.outputs.scope != 'frontend')
        with:
          node-version: "22"

      - name: Install
        if: github.event_name != 'pull_request' || (needs.scope.outputs.scope != 'full' && needs.scope.outputs.scope != 'frontend')
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        if: github.event_name != 'pull_request' || (needs.scope.outputs.scope != 'full' && needs.scope.outputs.scope != 'frontend')
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Drive the real browser
        if: github.event_name != 'pull_request' || (needs.scope.outputs.scope != 'full' && needs.scope.outputs.scope != 'frontend')
        working-directory: frontend
        run: npx playwright test

      # ── WHAT THIS EYE CANNOT SEE ────────────────────────────────────────
      # No specs are quarantined right now — every spec in tests/e2e/ runs.
      # Printing the count is still the point: a green `verify` covers every
      # spec that RAN, and the day one gets quarantined again this step is
      # what says so out loud instead of a doc going quietly stale.
      - name: State the coverage bound
        if: always() && (github.event_name != 'pull_request' || (needs.scope.outputs.scope != 'full' && needs.scope.outputs.scope != 'frontend'))
        working-directory: frontend
        run: |
          fixmes=$(grep -rlc "test.fixme" tests/e2e/ 2>/dev/null | wc -l || echo "?")
          {
            echo "### frontend eye — coverage bound"
            echo ""
            echo "Spec files containing a quarantined (\`test.fixme\`) case: **$fixmes**"
            echo ""
            echo "A green verify covers every spec that RAN. Any quarantined spec is"
            echo "NOT covered by it — do not read this tag as 'the frontend works' if"
            echo "the count above is non-zero."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the evidence
        if: always() && (github.event_name != 'pull_request' || (needs.scope.outputs.scope != 'full' && needs.scope.outputs.scope != 'frontend'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verify-frontend-evidence-${{ github.event.pull_request.number || github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────
  # THE TAG
  #
  # One check run the merge cage can require by name. It is green only if BOTH
  # eyes are green. `if: always()` plus an explicit result test, because a
  # skipped job reports neither success nor failure and a naive `needs:` would
  # let a skip read as a pass — the exact shape of bug that shipped ten
  # unfireable guards here before.
  # ───────────────────────────────────────────────────────────────────────
  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [scope, backend-eyes, frontend-eyes]
    if: always()
    steps:
      - name: Decide
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ needs.scope.outputs.scope }}
        run: |
          be='${{ needs.backend-eyes.result }}'
          fe='${{ needs.frontend-eyes.result }}'
          echo "backend-eyes=$be  frontend-eyes=$fe  scope=$SCOPE"
          be_where="ran here"; fe_where="ran here"
          if [ "$EVENT" = "pull_request" ] && [ "$SCOPE" = "full" ]; then
            be_where="deferred to offline-suite (ci-offline.yml)"
          fi
          if [ "$EVENT" = "pull_request" ] && { [ "$SCOPE" = "full" ] || [ "$SCOPE" = "frontend" ]; }; then
            fe_where="deferred to frontend-e2e (ci-offline.yml)"
          fi
          {
            echo "### verify"
            echo ""
            echo "| eye | result | where the tests ran |"
            echo "|---|---|---|"
            echo "| backend (routes, IDOR, journey) | \`$be\` | $be_where |"
            echo "| frontend (14 specs, real Chromium) | \`$fe\` | $fe_where |"
            echo ""
            echo "A deferred eye is green only as a record; the merge cage's \`verify\` tag"
            echo "also requires \`offline-suite\` and \`frontend-e2e\` green by name (TAG_CHECKS)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$be" != "success" ] || [ "$fe" != "success" ]; then
            echo "::error::verify is RED — the app was run and it did not behave."
            exit 1
          fi
          # Say only what happened: a deferred eye ran nothing here (CI audit:
          # this line once claimed "the app was actually run" 10 minutes before
          # offline-suite had a result). The backend eye defers only on `full`,
          # where the frontend eye defers too.
          if [ "$be_where" != "ran here" ] && [ "$fe_where" != "ran here" ]; then
            echo "verify deferred: offline-suite and frontend-e2e cover this diff (neither eye ran the app here)."
          elif [ "$fe_where" != "ran here" ]; then
            echo "verify is GREEN — the backend eye actually ran the app; the frontend eye deferred to frontend-e2e."
          else
            echo "verify is GREEN — the app was actually run."
          fi
