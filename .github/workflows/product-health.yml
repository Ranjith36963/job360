name: Product health (is it WORKING, not just not-crashing?)

# THE LOOP THAT WAS MISSING, and the owner named it exactly:
# "I keep being the one who says 'this doesn't look right'."
#
# Proven by our own issue history. Loops opened issues for: the pipeline
# stopping, CI going red, docs drifting. Every PRODUCT-QUALITY bug was found by
# a human instead:
#   #156  a job paying EXACTLY the target scored 0 - worse than no salary
#   #160  choosing "Executive" silently killed a whole scoring dimension
#   enrichment gated at 60 while the max score was 58 - never ran once
#
# None threw an error. None failed a test. Every dashboard stayed green.
# Our detectors asked "did something FAIL?" Nothing asked "is this RIGHT?"
#
# THE CHAIN THIS COMPLETES:
#   assertions find something WRONG (dumb SQL, no model)
#     -> opens an issue with the evidence
#     -> dispatches TRIAGE, which diagnoses it with file:line
#     -> triage routes auto-fixable
#     -> owner clicks agent:fix, REPAIR writes the fix + tests
#     -> blind checker reviews it, owner merges
# The only human verb left is the merge - by design.
#
# NO MODEL HERE. Every assertion is SQL and a comparison, which is why this
# loop is trusted to raise an alarm on its own.

on:
  schedule:
    - cron: "30 8 * * *" # 08:30 UTC, right after the absence check
  workflow_dispatch:
    inputs:
      drill:
        description: "FIRE DRILL - force an assertion red to prove the chain still works"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write # to wake the triage loop

concurrency:
  group: product-health
  cancel-in-progress: false

jobs:
  assert:
    name: Is the product doing its job?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install psycopg
        run: python -m pip install "psycopg[binary]>=3.2"

      - name: Check the DSN secret exists
        id: dsn
        run: echo "have=${{ secrets.PROD_DATABASE_URL != '' }}" >> "$GITHUB_OUTPUT"

      - name: Say so loudly if it cannot run
        if: steps.dsn.outputs.have != 'true'
        run: |
          echo "::error::PROD_DATABASE_URL is not set - product assertions cannot run."
          echo "A silent skip here recreates the exact failure this loop exists to catch."
          exit 1

      - name: Assert the product is working
        id: check
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DRILL: ${{ inputs.drill }}
        run: |
          # A drill forces one assertion red so the whole downstream chain -
          # issue, triage, notification - is exercised on purpose rather than
          # only during a real incident, which is the worst time to find it
          # broken. Same doctrine as absence.yml's drill.
          if [ "$DRILL" = "true" ]; then
            echo "::warning::FIRE DRILL - forcing an assertion red. The product is fine."
            export PA_MIN_VISIBLE_PCT=101
          fi
          set +e
          python scripts/product_assertions.py > product.md 2>&1
          code=$?
          set -e
          cat product.md
          cat product.md >> "$GITHUB_STEP_SUMMARY"
          echo "wrong=$code" >> "$GITHUB_OUTPUT"
          # exit 2 = the checker itself broke -> fail LOUD, never silently pass
          [ "$code" -le 1 ] || exit "$code"

      # CANARY: prove the assertions can still go red. A detector nobody has
      # seen fail is not known to work - "all green" might just mean blind.
      - name: Canary - prove the assertions can still fail
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PA_MIN_FEED_ROWS: "999999999"
        run: |
          set +e
          python scripts/product_assertions.py > canary.md 2>&1
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::CANARY FAILED - assertions did NOT go red against an impossible floor (exit $code). Today's green means nothing."
            cat canary.md
            exit 1
          fi
          echo "canary ok - the assertions still fail when they should" >> "$GITHUB_STEP_SUMMARY"

      - name: Raise it, and hand it to triage
        if: always() && steps.check.outputs.wrong != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.drill }}" = "true" ]; then
            title="DRILL: product assertion test - not a real problem"
          else
            title="PRODUCT: something is wrong (not broken - wrong)"
          fi
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)

          if [ "${{ steps.check.outputs.wrong }}" = "1" ]; then
            {
              if [ "${{ inputs.drill }}" = "true" ]; then
                echo "> **This is a FIRE DRILL. The product is fine.**"
                echo ">"
                echo "> An assertion was forced red to prove the chain still works:"
                echo "> assertion -> issue -> triage -> fix. Close when observed."
                echo
              fi
              cat product.md
              echo
              echo "This is the class of bug that throws no error and fails no test."
              echo "A feature that silently does nothing looks exactly like a feature"
              echo "that was never built - which is why it needs its own detector."
              echo
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > body.md
            if [ -z "$num" ]; then
              new=$(gh issue create --title "$title" --body-file body.md --label harness)
              n="${new##*/}"
              # Hand off EXPLICITLY: an issue opened with GITHUB_TOKEN raises no
              # `issues` run (GitHub blocks that recursion), so relying on the
              # event would leave every product alarm undiagnosed.
              if gh workflow run triage.yml -f issue="$n"; then
                echo "raised #$n and woke triage" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::issue #$n raised but triage could not be woken - diagnose by hand"
              fi
            else
              gh issue comment "$num" --body-file body.md
              echo "commented on existing #$num" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" \
              --comment "Product assertions all hold again as of run ${{ github.run_id }}. (auto-close)"
          fi
