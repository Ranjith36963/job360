name: PR shepherd (conflicts + red CI on human PRs)

# The dependabot loop covers dependabot's queue; this covers EVERYONE ELSE'S.
# Found live 2026-07-30: PR #171 sat with 2 failing checks and nothing in the
# harness watching — a red human PR just rots until its author happens to look.
# Conflicts are worse: a branch that was green on Monday silently becomes
# unmergeable as main moves, and nobody is told.
#
# WHAT IT DOES (all dumb code, no model):
#   RED CHECKS   -> dispatch the triage loop on the PR (a PR number IS an
#                   issue number to the API), so the failure arrives diagnosed
#                   with file:line evidence — same as every other failure here.
#                   Comment once so the author knows triage was called.
#   CONFLICTING  -> try GitHub's own "Update branch" (merges main INTO the
#                   branch — a plain merge commit, NO history rewrite, so it is
#                   safe alongside the one-session-per-branch rule; nothing is
#                   force-pushed). If even that fails, the conflict needs a
#                   human: comment once naming it.
#   GREEN+IDLE   -> a summary line only. Merging a human's PR is an
#                   AUTHORIZATION, and this harness reserves authorization for
#                   humans (same reason triage may not apply agent:fix).
#
# WHAT IT NEVER DOES: merge, close, rebase, or force-push anyone's branch.
# It repairs metadata (branch freshness) and routes problems; it does not
# take over the work.
#
# HONESTY RULE: every open PR gets one summary line — acted on or left alone,
# with the reason. Silent skipping is how queues rot.

on:
  schedule:
    - cron: "45 9 * * *" # daily, after the 09:30 dependabot sweep
  workflow_dispatch: {} # drill entrance — every loop must be fireable on demand

permissions:
  contents: write # update-branch creates a merge commit on the PR branch
  pull-requests: write
  issues: write # PR comments ride the issues API
  actions: write # lets a red PR wake the triage loop

concurrency:
  group: pr-shepherd
  cancel-in-progress: false

jobs:
  shepherd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sweep human PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          prs=$(gh pr list --state open --json number,title,author,mergeable,isDraft \
                  --jq '[.[]|select(.author.login!="dependabot[bot]" and .author.login!="app/dependabot")]')
          count=$(echo "$prs" | jq length)
          echo "### PR shepherd — $count open human PR(s)" >> "$GITHUB_STEP_SUMMARY"
          [ "$count" = "0" ] && exit 0

          echo "$prs" | jq -c '.[]' | while read -r pr; do
            num=$(echo "$pr"       | jq -r .number)
            title=$(echo "$pr"     | jq -r .title)
            mergeable=$(echo "$pr" | jq -r .mergeable)
            draft=$(echo "$pr"     | jq -r .isDraft)

            # Drafts are work-in-progress by declaration — leave them alone.
            if [ "$draft" = "true" ]; then
              echo "- #$num DRAFT (left alone) — $title" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            red=$(gh pr view "$num" --json statusCheckRollup --jq '[.statusCheckRollup[]?|select(.conclusion=="FAILURE")]|length')
            pending=$(gh pr view "$num" --json statusCheckRollup --jq '[.statusCheckRollup[]?|select(.status!="COMPLETED")]|length')

            # ---- conflicts first: a conflicted PR's CI state is stale anyway ----
            if [ "$mergeable" = "CONFLICTING" ]; then
              # GitHub's own "Update branch": merges base INTO the branch.
              # Plain merge commit, no history rewrite — safe next to parallel
              # sessions. expected_head_sha guards against racing a push.
              head_sha=$(gh pr view "$num" --json headRefOid --jq .headRefOid)
              if gh api -X PUT "repos/$GH_REPO/pulls/$num/update-branch" \
                   -f expected_head_sha="$head_sha" >/dev/null 2>&1; then
                  # The update-branch commit is authored by github-actions[bot], and a
                  # GITHUB_TOKEN-attributed push PARKS the resulting pull_request runs in
                  # `action_required` - they never start on their own. pr-repair.yml:410-418
                  # already handles this after its own push; pr-shepherd did not, so
                  # "CI re-running" was a claim, not a fact. With a ruleset on main requiring
                  # those checks a parked run means the PR can NEVER merge - the shepherd
                  # would quietly create the very deadlock it exists to clear.
                  sleep 30
                  brn=$(gh pr view "$num" --json headRefName --jq .headRefName)
                  for id in $(gh run list --branch "$brn" --limit 10 --json databaseId,conclusion --jq '.[]|select(.conclusion=="action_required")|.databaseId'); do
                    gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null 2>&1 \
                      && echo "  approved parked run $id on #$num" >> "$GITHUB_STEP_SUMMARY" \
                      || echo "::warning::could not approve parked run $id on PR #$num - approve it in the Actions UI or its checks will never report"
                  done
                echo "- #$num UPDATED (was conflicting; merged main in, CI re-running) — $title" >> "$GITHUB_STEP_SUMMARY"
              else
                marker="<!-- pr-shepherd-conflict -->"
                if ! gh pr view "$num" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
                  body=$(printf '%s\n**PR shepherd:** this branch now CONFLICTS with `main` and even "Update branch" cannot resolve it automatically. It needs a hand-merge — until then every check result here is stale.' "$marker")
                  gh pr comment "$num" --body "$body"
                fi
                echo "- #$num CONFLICT (auto-update failed, commented for author) — $title" >> "$GITHUB_STEP_SUMMARY"
              fi
              continue
            fi

            # ---- red CI: OWNER PRs get FIXED, not just diagnosed ----
            # (Owner's standing instruction 2026-07-30: conflicts and red CI
            # are repaired autonomously; only the merge stays human.)
            if [ "$red" -gt 0 ]; then
              author=$(echo "$pr" | jq -r .author.login)
              marker="<!-- pr-shepherd-red -->"
              if ! gh pr view "$num" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
                if [ "$author" = "Ranjith36963" ] && gh workflow run pr-repair.yml -f pr="$num"; then
                  body=$(printf '%s\n**PR shepherd:** %s check(s) are failing - the PR-repair loop has been dispatched to FIX this branch. It will push additive commits and CI will re-run; merging stays with you.' "$marker" "$red")
                  echo "- #$num RED ($red failing) -> pr-repair dispatched — $title" >> "$GITHUB_STEP_SUMMARY"
                elif gh workflow run triage.yml -f issue="$num"; then
                  body=$(printf '%s\n**PR shepherd:** %s check(s) are failing, so the triage loop has been dispatched to diagnose this PR.' "$marker" "$red")
                  echo "- #$num RED ($red failing) -> triage dispatched — $title" >> "$GITHUB_STEP_SUMMARY"
                else
                  body=$(printf '%s\n**PR shepherd:** %s check(s) are failing and no loop could be dispatched - diagnose by hand.' "$marker" "$red")
                  echo "- #$num RED ($red failing) -> DISPATCH FAILED — $title" >> "$GITHUB_STEP_SUMMARY"
                fi
                gh pr comment "$num" --body "$body"
              else
                echo "- #$num RED ($red failing, already routed — not re-nagging) — $title" >> "$GITHUB_STEP_SUMMARY"
              fi
              continue
            fi

            if [ "$pending" -gt 0 ]; then
              echo "- #$num WAIT ($pending pending) — $title" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- #$num GREEN (awaiting the author's merge — not the shepherd's call) — $title" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  # ─── Review debt ───────────────────────────────────────────────────────────
  # The sweep above watches PRs that are still OPEN. This watches the findings
  # nobody watched: 43 of 63 unresolved CodeRabbit threads sit on PRs that
  # ALREADY MERGED, and on this repo a merge auto-deploys — so those shipped to
  # real users with nobody answering. Nothing read them because nothing was
  # pointed at them.
  #
  # It is a REPORT, deliberately. Findings go to fix-now (the PR is still open),
  # owner-decides (it merged and the code it names is still on main), or
  # stale-and-closeable (that file or line is gone — the one thing a machine may
  # decide alone). It opens nothing, closes nothing, fixes nothing, and blocks
  # no merge. All six merged PRs that carried findings merged with them open, so
  # a gate here would have refused six of six.
  #
  # It goes red only when the READER fails — API unreachable, payload
  # unparseable, or untrusted review text reaching the exit door. "Not checked"
  # is not "passed". This workflow gates nothing, so a red costs a look and
  # cannot block anyone's merge.
  #
  # SEPARATE JOB, and that is the point: the shepherd job above has no checkout
  # step, so a `run: python scripts/...` bolted onto it would have died on a
  # missing file every single night — a report that never reports, which is the
  # exact shape of the ten guards that shipped unable to fire. The drill
  # registry would NOT have caught it either: it resolves script references
  # against the REPO, not against what the runner actually has on disk.
  review-debt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job only READS: the repo on disk and the PR list through the API. It
    # inherited the workflow's four write scopes because nothing said otherwise.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # CodeRabbit: this job authenticates `gh` through GH_TOKEN, never
          # through the git credential helper, so the checkout was leaving a
          # token in .git/config that no step uses. zizmor flags it artipacked.
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # CodeRabbit, and it is the ELEVEN FALSE CLOSURES waiting to happen again.
      # The comment below `--against HEAD` claims "both triggers check out the
      # DEFAULT BRANCH, so HEAD here IS main". That is true for `schedule` and
      # FALSE for `workflow_dispatch`, which can name any ref — and dispatch is
      # this workflow's own drill entrance, so it is the trigger most likely to
      # be fired by hand. Run it from a feature branch and every merged finding
      # whose code has not landed there yet reads `stale-and-closeable`: the
      # reader would invent closures exactly as it did the first time.
      #
      # It FAILS rather than skips. A silent skip would satisfy the branch
      # ruleset with a green tick while reporting no debt, and this file's own
      # HONESTY RULE says silent skipping is how queues rot.
      - name: Refuse to read debt from a non-default ref
        run: |
          set -euo pipefail
          want="${{ github.event.repository.default_branch }}"
          got="${{ github.ref_name }}"
          if [ "$got" != "$want" ]; then
            echo "::error::review-debt ran on '$got', not the default branch"
            echo "::error::'--against HEAD' assumes HEAD is $want. From another"
            echo "::error::ref, merged findings read stale-and-closeable and the"
            echo "::error::reader invents closures. FIX: dispatch it on $want."
            exit 1
          fi
          echo "ref is $got — the default branch, so --against HEAD means $want"

      - name: Unanswered review findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### Review debt"
            echo '```'
            # --against HEAD, not origin/main: this workflow only runs on a
            # schedule or a dispatch, and both check out the DEFAULT BRANCH, so
            # HEAD here IS main — the tree merged findings actually shipped to.
            # Naming origin/main instead would depend on the remote-tracking ref
            # surviving a shallow checkout, and if it did not, every anchor would
            # silently read "unknown" and the stale bucket would look empty.
            python scripts/review_debt.py \
              --owner "${GITHUB_REPOSITORY%%/*}" \
              --name  "${GITHUB_REPOSITORY##*/}" \
              --against HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
