name: CI

# Full gate: lint → type-check → test → build.
# Replaces ci-offline.yml as the canonical per-commit gate.
# ci-offline.yml (automated Loop-2 + Playwright) continues to run independently.

on:
  push:
  pull_request:

jobs:

  # ─── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: job360
          POSTGRES_PASSWORD: job360dev
          POSTGRES_DB: job360
        options: >-
          --health-cmd "pg_isready -U job360 -d job360"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # Exported so tests CAN use Postgres once the migration lands.
      # Existing tests use SQLite via conftest.py fixtures and are unaffected
      # by this env var being present.
      DATABASE_URL: postgresql://job360:job360dev@localhost:5432/job360
      REDIS_URL: redis://localhost:6379
      # Minimal secrets for auth tests (injected by conftest.py too, but set
      # here so any integration smoke-tests that read .env also have them).
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      CHANNEL_ENCRYPTION_KEY: ci-test-channel-key-not-used-in-prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (with dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        # Ruff has a documented pre-existing backlog (~326 findings, mostly
        # unsorted-imports/I001 + legacy style) — grandfathered NON-blocking, the
        # same treatment as mypy below, so the gate reports real test/build status
        # instead of staying permanently red. TODO: drain the backlog
        # (`ruff check --fix` clears the bulk) then flip this back to blocking.
        working-directory: backend
        run: python -m ruff check .
        continue-on-error: true

      - name: Tests (offline suite)
        working-directory: backend
        run: python -m pytest -q -p no:randomly

      - name: Type-check (mypy)
        # mypy has a documented backlog of 395 errors (docs/mypy_backlog.md).
        # Strict mode is active for new code; existing errors are grandfathered.
        # Non-blocking until the backlog is drained.
        working-directory: backend
        run: python -m mypy src/
        continue-on-error: true

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Type-check (tsc)
        working-directory: frontend
        run: npm run type-check

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Build (next build)
        working-directory: frontend
        run: npm run build
