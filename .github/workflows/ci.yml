name: CI

# Full gate: lint → type-check → test → build.
# Replaces ci-offline.yml as the canonical per-commit gate.
# ci-offline.yml (automated Loop-2 + Playwright) continues to run independently.

# Unfiltered `push` + `pull_request` double-fires: a push to a branch with an open
# PR runs the same commit twice. Filtering push to main gives branches exactly one
# run (via the PR) and main exactly one run (via the push).
on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes the run it replaces; don't pay for the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token (CodeQL actions/missing-workflow-permissions):
# these jobs only check out code and run tests/uploads — no repo writes.
permissions:
  contents: read

jobs:

  # ─── Scope: which steps does THIS diff need? ───────────────────────────────
  # Harness simplification slice 3 (owner decision 2026-09-08). Measured on the
  # last green run of main: the backend job spends 347s of 414s in pytest, and
  # ci-offline.yml runs the same suite again. A one-component frontend PR waited
  # seven minutes for tests it cannot affect.
  #
  # scripts/ci_scope.py answers `docs` / `frontend` / `full` from the changed
  # files, most restrictive wins, unknown is full, empty is full, and anything
  # that is not a pull_request (push to main, dispatch) is full unless it
  # PROVES `tested` -- main is production.
  #
  # `tested` (CI audit 2026-10-19): a push to main skips the heavy steps ONLY
  # when ci_scope.py proves the PR that produced this merge commit has the same
  # tree, every required check on its head is green, and a successful run of
  # THIS workflow uploaded `ci-tested-tree-<tree>` (only a `full` decision
  # uploads it, named after the tree that run checked out). Anything else is
  # `full`. See the docstring of scripts/ci_scope.py.
  #
  # JOBS BELOW ARE NEVER SKIPPED, ONLY THEIR STEPS. The ruleset on main and
  # scripts/merge_cage.py require checks BY NAME; a skipped job never reports
  # and blocks the merge, a job whose steps were skipped reports success.
  scope:
    name: Scope (which checks this diff needs)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Read-only lookups for the `tested` proof. Job-level, so no other job
    # gains anything.
    permissions:
      contents: read
      actions: read        # this workflow's earlier runs and their marker artifact
      checks: read         # the required checks on the PR head
      pull-requests: read  # which PR produced the pushed merge commit
    outputs:
      scope: ${{ steps.decide.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the diff needs the base commit
      # The classifier proves it can still go red BEFORE it is allowed to
      # decide anything. A broken classifier fails this job, which fails every
      # job that needs it, which is a red PR -- never a silently fast one.
      - name: The scope classifier can still fail
        run: python scripts/ci_scope.py --drill
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scope=$(python scripts/ci_scope.py --event "$EVENT" --base "$BASE_SHA" --head HEAD --workflow ci.yml --print-scope --summary)
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      # THE PROOF A LATER `tested` READS. Only a `full` decision writes it, and
      # its name is the tree this run checked out (on a PR: the merge ref).
      - name: Record the tree this full run tests
        id: tree
        if: steps.decide.outputs.scope == 'full'
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\nsha=%s\nevent=%s\nrun=%s\n' "$tree" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" > tested-tree.txt
      - name: Upload the full-scope marker
        if: steps.decide.outputs.scope == 'full'
        # A lost marker only makes a later main push run `full`. It must never fail
        # `scope`: a red scope SKIPS the required jobs, and the ruleset passes skipped.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 7
          overwrite: true

  # ─── Test integrity: no PR goes green by running fewer tests ──────────────
  # 2026-10-20. Coding agents judged by a suite learn to skip, delete or
  # de-configure the failing test (METR 2025-06-05; Anthropic 2025-11-26). Only
  # pr-repair.yml and issue-fix.yml checked their own agent's diff; an ordinary
  # PR had nothing. scripts/test_integrity.py reads `git diff base...head` and
  # names every added skip / xfail / .only / no-cover, every test removed with
  # no replacement, and every edit to conftest / pytest / vitest / playwright
  # config. Any finding is red. merge_cage.py requires this check, so a machine
  # cannot merge it; the owner reads the report and can merge by hand (it is
  # not in the ruleset).
  #
  # The judge is the BASE branch's copy when it has one, so a PR cannot blind
  # the guard that judges it. No `needs: scope`: a red scope must not skip it.
  # Steps run only on pull_request; on a push the job reports success at once.
  test-integrity:
    name: test-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0   # base...head needs the merge base
      - name: No test was skipped, deleted or re-configured
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          judge=scripts/test_integrity.py
          if git cat-file -e "$BASE_SHA:scripts/test_integrity.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/test_integrity.py" > "$RUNNER_TEMP/test_integrity.py"
            judge="$RUNNER_TEMP/test_integrity.py"
            echo "judging with the base branch's copy of scripts/test_integrity.py"
          fi
          set +e
          python "$judge" --base "$BASE_SHA" --head "$HEAD_SHA" | tee "$RUNNER_TEMP/integrity.txt"
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### test-integrity"
            echo '```'
            awk '!/^::/ && n++ < 80' "$RUNNER_TEMP/integrity.txt"   # one reader, no SIGPIPE
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # ─── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [scope]

    # No Postgres / Redis services (removed 2026-10-20): since pytest moved to
    # offline-suite this job is ruff + mypy, both static, and the two idle
    # containers cost ~20 s on every run, docs PRs included (CI audit D2).
    env:
      # Minimal secrets for auth tests (injected by conftest.py too, but set
      # here so any integration smoke-tests that read .env also have them).
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      CHANNEL_ENCRYPTION_KEY: ci-test-channel-key-not-used-in-prod

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.scope == 'full'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: needs.scope.outputs.scope == 'full'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.lock.txt

      # WHAT SHIPS IS WHAT WAS TESTED (2026-10-20). The prod image and both
      # backend CI jobs install from backend/requirements*.lock.txt with
      # --require-hashes, so a pyproject edit the locks do not follow would ship
      # the app without its new dependency (--no-deps) or with a pin outside the
      # declared range. This names the drift before the install hides it.
      - name: Backend locks match pyproject (scripts/check_py_lock.py)
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/check_py_lock.py

      - name: Install backend (with dev extras)
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock.txt
          python -m pip install --no-deps -e .
          python -m pip check

      # The frontend's typed API (frontend/openapi.json + src/lib/api-types.ts) is
      # generated from the backend. The Playwright specs mock the backend, so
      # nothing else notices when the two drift. This job already has the locked
      # backend installed; it only needs node + openapi-typescript on top.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.scope.outputs.scope == 'full'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (for the API types generator)
        if: needs.scope.outputs.scope == 'full'
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Frontend API types match the backend (check:types-drift)
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/check_api_types_drift.py

      - name: Lint (ruff)
        if: needs.scope.outputs.scope == 'full'
        # Backlog drained 2026-07-10: 329 findings → 0. The bulk auto-fixed
        # (`ruff check --fix`, ~141 import-sort/style); the rest were real
        # code fixes (dead-var deletes, ambiguous-name renames, a closure
        # binding, a missing import) plus intentional-category ignores scoped
        # in pyproject.toml (tests/*, scripts/*, LLM-prompt E501, etc.).
        # BLOCKING again — keep it green.
        working-directory: backend
        run: python -m ruff check .

      # The full backend pytest runs ONCE per PR, in `offline-suite`
      # (ci-offline.yml) - the same command, env and services. It ran here too
      # until 2026-10-19: ~26 runner-minutes per PR spent re-running an
      # identical suite (CI audit). This job is lint + types; offline-suite is
      # the tests, and both stay required contexts in the ruleset.

      - name: Type-check (mypy ratchet)
        if: needs.scope.outputs.scope == 'full'
        # BLOCKING (H7). Was `continue-on-error: true` with a comment claiming
        # "existing errors are grandfathered" — but nothing implemented that, so
        # the result was discarded entirely and new code could add type errors
        # freely. The ratchet is the missing mechanism: backend/mypy_baseline.txt
        # records the pre-existing errors, and the build fails on any NEW one, so
        # the count can only go down. Fixed errors are reported as progress.
        # mypy is pinned in pyproject.toml — a baseline only means something
        # against the version that produced it.
        working-directory: backend
        run: python scripts/mypy_ratchet.py

      # Build the SAME image Railway builds, as the Frontend job does for its
      # own (2026-10-20: nothing built backend/Dockerfile before a deploy did).
      # Both variants: the default, and BROWSER_AGENT_ENABLED=1, whose hashed
      # browser-lock install is a separate RUN. The default layers are reused,
      # so the second build pays only for Playwright + Chromium. Then the image
      # proves its installed set is consistent and the app imports.
      - name: Docker image builds (backend/Dockerfile)
        if: needs.scope.outputs.scope == 'full'
        run: |
          docker build --quiet -t job360-backend-ci backend
          docker run --rm job360-backend-ci sh -c 'pip check && python -c "import main"'
          docker build --quiet --build-arg BROWSER_AGENT_ENABLED=1 -t job360-backend-browser-ci backend
          docker run --rm job360-backend-browser-ci sh -c 'pip check && python -c "import playwright.async_api"'

  # ─── The chain checks itself ───────────────────────────────────────────────
  chain:
    name: Chain wires (harness)
    runs-on: ubuntu-latest
    # Must exceed DRILL_TIMEOUT_S (240s) in scripts/drill_registry.py, or a hung
    # drill is cancelled by the job before it can report DRILL TIMEOUT.
    timeout-minutes: 10
    needs: [scope]
    steps:
      # On a PR this IS the default (the merge tree), written out so that
      # gate_wiring_check G4 can see the `--baseline` steps below measure
      # `refs/pull/<N>/merge` (same as doc-sync.yml, #1098). On a push it stays
      # the pushed ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.scope == 'full'
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: needs.scope.outputs.scope == 'full'
        with:
          python-version: "3.12"
      # aiohttp + aioresponses: scripts/ssrf_drill.py's fetcher-level cases
      # (3, 5, 7) import both — without them this step reds on ImportError,
      # a dead wire the chain job exists to catch everywhere ELSE.
      # python-dotenv + psycopg: the guard reads its caps from
      # src.core.settings, whose import chain is dotenv -> src.repositories.pg
      # -> psycopg (first PR #496 run: 9/10 cases "No module named 'dotenv'").
      - run: pip install pyyaml aiohttp aioresponses python-dotenv "psycopg[binary]"
        if: needs.scope.outputs.scope == 'full'

      # Every NODE in detect -> triage -> repair -> verify -> PR has always been
      # healthy. The WIRES between them kept breaking silently: two spellings of
      # one bot name cost 17 dead days, a SIGPIPE killed the repair checker on
      # any diff over 800 lines, and an output written only on the success path
      # left the outage unannounced. Nothing watched the wires, because every
      # individual workflow was green. This job watches the wires.
      # On a PR, red only for findings THIS PR adds (owner, 2026-10-22): the PR's
      # base is judged by its own checker and shared findings print as inherited.
      # The base is the tested merge commit's first parent (the main it was built
      # on), else the event's base sha. Push to main has no base, so main's own
      # findings still fail on main. No base checkout -> every finding counts as
      # this PR's (fail closed). Used by the three --baseline steps below.
      - name: Check out the PR's base
        id: base
        if: needs.scope.outputs.scope == 'full' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          parent=$(git log -1 --format=%P HEAD | awk 'NF==2{print $1}')
          sha=${parent:-$BASE_SHA}
          if [ -n "$sha" ] && git fetch -q --no-tags --depth=1 origin "$sha" \
              && git worktree add -q --detach "$RUNNER_TEMP/base" FETCH_HEAD; then
            echo "dir=$RUNNER_TEMP/base" >> "$GITHUB_OUTPUT"
            echo "PR base $sha checked out: findings it shares are inherited, not this PR's."
          else
            echo "::warning::could not check out the PR base; every finding counts as this PR's"
          fi

      - name: Every wire connects
        if: needs.scope.outputs.scope == 'full'
        env:
          BASE_DIR: ${{ steps.base.outputs.dir }}
        run: python scripts/chain_check.py --no-map ${BASE_DIR:+--baseline "$BASE_DIR"}

      # And this is the part that matters: a checker nobody has watched fail is
      # indistinguishable from a checker that cannot fail. The drill breaks three
      # wires on purpose, by three different mechanisms, and demands the checker
      # name each one — plus a negative control (a comment-only edit) that must
      # stay quiet. If chain_check.py ever silently stops detecting, this fails.
      - name: The checker can still fail
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/chain_check.py --drill

      # The registry is the most dangerous file in the harness: if it stops
      # detecting, it certifies every other guard. So it is held to its own
      # standard — five deliberate breaks plus a negative control.
      #
      # This runs FIRST, deliberately. A failed step skips the ones after it, so
      # if the guard sweep below went first and failed, we would never learn
      # whether the registry can still detect at all — which is the one answer
      # you need when it is red.
      - name: The registry can still fail
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/drill_registry.py --drill

      # ...and that drill can itself go RED (#359). A drill exiting 0 proves the
      # drill RAN, never that the guard could still fire: `all([])` is True, and
      # a derivation that resolves to zero files prints zero lines and succeeds.
      # Both shipped here inside one PR. So one of the registry's own rules is
      # BLINDED on purpose and the self-drill must fail. `--run-drills` below
      # runs every other guard's negative control, but it skips this one -- a
      # drill may not invoke itself -- so the registry's own runs here, explicitly.
      - name: ...and the registry's own drill can go RED
        if: needs.scope.outputs.scope == 'full'
        run: |
          if python scripts/drill_registry.py --drill --break-checker UNDECLARED; then
            echo "The registry's drill stayed GREEN with its UNDECLARED rule blinded."
            echo "So the drill cannot go red, and its green tick proves nothing."
            exit 1
          fi
          echo "Blinded on purpose -> the drill went red, as it must."

      # Every guard CI runs must declare how to make itself fail. Ten guards here
      # shipped unable to fire, across four consecutive rounds — each was
      # correct-looking code in the wrong position, reporting success about a
      # different question than the one that mattered. A fifth round would find
      # guard eleven; this is the mechanism instead. Adding a guard to a workflow
      # is what triggers the requirement, so one cannot slip in by being forgotten.
      # The merge cage decides what reaches real users without the owner. It is
      # held to the same standard as everything else it judges: broken on purpose
      # six ways, plus a negative control. Network-free, so it runs here.
      # One bug class, 43 copies, nothing stopping the 44th. Exactly the shape
      # of the seven log-injection alerts sitting open right now: fixing the
      # instances without adding the guard is how a class grows.
      - name: No text decoded with the machine's locale
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/encoding_guard.py

      - name: That guard can still fail
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/encoding_guard.py --drill

      # The broom that sorts worktrees and local branches into SAFE / KEEP / ASK.
      # Its danger is asymmetric: a wrong KEEP costs disk, a wrong SAFE costs the
      # owner work he never saved.
      #
      # ONLY `--drill` MAY RUN HERE. The drill builds its own git repo in a temp
      # dir, so it is portable and network-free. The CENSUS reads the owner's
      # local disk, which a cloud runner cannot see -- pointing this step at the
      # checkout would census one clean worktree, report all-green, and become
      # another guard that cannot fire.
      - name: The broom still refuses to sweep up unsaved work
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/worktree_census.py --drill

      # The broom's ENTRANCE. Same reason this step sits next to the one above and
      # not in branch-reaper.yml alone: that workflow runs only on merges to
      # main, so a break would surface only AFTER a merge — too late for the one
      # component whose whole job is deleting things. Here it fires on every PR.
      - name: The reaper still refuses, and still delegates
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/worktree_reaper.py --drill

      - name: The ruleset checker can still fail
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/ruleset_gate.py --drill
      - name: Would the ruleset wedge the repo?
        if: needs.scope.outputs.scope == 'full'
        env:
          BASE_DIR: ${{ steps.base.outputs.dir }}
        run: python scripts/ruleset_gate.py --check --scope ruleset ${BASE_DIR:+--baseline "$BASE_DIR"}
      # The local Stop gate (.claude/hooks/stop-quality-gate.sh) and verify-stamp.sh only
      # run in Claude Code sessions, so nothing else would ever notice them rotting.
      # The drill builds throwaway git repos and demands each rule blocks or allows.
      - name: The local stop gate can still block
        if: needs.scope.outputs.scope == 'full'
        run: bash scripts/hook_drill.sh
      # WIRED FOR REAL, NOT IN A COMMENT. Both of these were referenced only
      # from commented-out example lines, so `drill_registry.discover()` counted
      # them as invoked and certified two guards that NOTHING RAN. #362 taught
      # discover() to ignore comments, which turned them into STALE ENTRY --
      # correctly. The fix is to invoke them, not to un-declare them.
      - name: Every alert path still reaches a human
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/check_alert_paths.py

      - name: Every slack step passes a token, a title and a real channel
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/check_workflow_slack_wiring.py

      # FC-001: a branch over a job result with no catch-all is a silent no-op
      # on a cancelled/timed-out job (PR #679). docs/harness/FAILURE_CATALOG.md
      - name: Every job-result branch has a catch-all
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/check_job_result_routing.py

      - name: The review-debt reader can still fail (and still refuses to gate)
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/review_debt.py --drill

      # The guard on the one route that makes outbound requests to a URL a
      # stranger chose (backend/src/services/fetch/guard.py). Ten
      # mutations, each a real SSRF bypass, plus a negative control.
      - name: The SSRF guard can still fail
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/ssrf_drill.py --drill

      # Claude Code truncates MCP text at 2,048 characters (anthropics/claude-code#81268);
      # the live-server half of this guard is backend/tests/test_mcp_text_budget.py.
      - name: The MCP text budget guard can still fail
        if: needs.scope.outputs.scope == 'full'
        run: python scripts/mcp_text_budget.py --drill

      - name: Every guard declares its drill
        if: needs.scope.outputs.scope == 'full'
        env:
          BASE_DIR: ${{ steps.base.outputs.dir }}
        run: python scripts/drill_registry.py --run-drills ${BASE_DIR:+--baseline "$BASE_DIR"}

  # ─── GitHub's own parser, run before GitHub does ──────────────────────────
  # 2026-10-02: review-security.yml shipped an empty `${{ }}` inside a prompt
  # string. yaml.safe_load accepted it, every guard above passed, and GitHub
  # refused the whole file ("workflow file issue", run 36989615324, 0 s). Nothing
  # in CI could see it. actionlint parses workflows and their ${{ }} expressions
  # the way GitHub does, so a file GitHub would reject fails HERE, on the PR.
  #
  # Pinned: version AND sha256 (from the release's own checksums file, checked
  # against actionlint_1.7.12_checksums.txt on 2026-10-02). `latest` would let a
  # new release turn an unrelated PR red. shellcheck/pyflakes are OFF: the goal
  # is GitHub-rejected syntax and expressions, not style in `run:` blocks, and
  # the runner's preinstalled shellcheck would make the result vary by image.
  # Job is never skipped, only its steps (see the scope note at the top).
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [scope]
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.scope == 'full'

      - name: Install actionlint (pinned, checksum-verified)
        if: needs.scope.outputs.scope == 'full'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -version

      - name: Lint workflows (fails on any error)
        if: needs.scope.outputs.scope == 'full'
        run: ./actionlint -shellcheck= -pyflakes= -color .github/workflows/*.yml

  # ─── Frontend ──────────────────────────────────────────────────────────────
  # Steps run on an explicit list of scopes, never `!= 'docs'`: a negation
  # would also admit `tested` (and any scope word added later).
  frontend:
    # 2026-10-20: this job runs Node 22 (setup-node below). The name stays "Node 20":
    # renaming a required check is an owner ruleset action.
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [scope]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Lock ⇄ package.json sync, on the JSON, before npm ci. npm ci catches the
      # same drift itself, but with 40 lines of usage text; this names the edge.
      # It exists mainly for the local commit gate (scripts/agent-gate.sh), which
      # runs against installed node_modules and cannot see a pruned lock (#503).
      - name: Lockfile sync (scripts/check_lock_sync.py)
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend'
        run: python scripts/check_lock_sync.py frontend

      - name: Install frontend deps
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend'
        working-directory: frontend
        run: npm ci

      - name: Type-check (tsc)
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend'
        working-directory: frontend
        run: npm run type-check

      - name: Lint (ESLint)
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend'
        working-directory: frontend
        run: npm run lint

      - name: Unit tests (vitest)
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend'
        working-directory: frontend
        run: npx vitest run

      - name: Build (next build)
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend'
        working-directory: frontend
        run: npm run build

      # Build the SAME image Railway builds. Everything above runs on the checkout,
      # not on the Dockerfile — so a Dockerfile that fails (#503 emptied public/,
      # its COPY died, two prod deploys failed) never showed here. No push, no
      # registry: an image that builds is the whole assertion.
      - name: Docker image builds (frontend/Dockerfile)
        if: needs.scope.outputs.scope == 'full'
        run: docker build -t job360-frontend-ci frontend

  # Failures on main / on the schedule are reported as an issue by loop-red.yml
  # (one workflow_run watcher, so PRs no longer show a 'skipping' row for it).
