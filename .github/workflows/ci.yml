name: CI

# Full gate: lint → type-check → test → build.
# Replaces ci-offline.yml as the canonical per-commit gate.
# ci-offline.yml (automated Loop-2 + Playwright) continues to run independently.

# Unfiltered `push` + `pull_request` double-fires: a push to a branch with an open
# PR runs the same commit twice. Filtering push to main gives branches exactly one
# run (via the PR) and main exactly one run (via the push).
on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes the run it replaces; don't pay for the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token (CodeQL actions/missing-workflow-permissions):
# these jobs only check out code and run tests/uploads — no repo writes.
permissions:
  contents: read

jobs:

  # ─── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: job360
          POSTGRES_PASSWORD: job360dev
          POSTGRES_DB: job360
        options: >-
          --health-cmd "pg_isready -U job360 -d job360"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # Exported so tests CAN use Postgres once the migration lands.
      # Existing tests use SQLite via conftest.py fixtures and are unaffected
      # by this env var being present.
      DATABASE_URL: postgresql://job360:job360dev@localhost:5432/job360
      REDIS_URL: redis://localhost:6379
      # Minimal secrets for auth tests (injected by conftest.py too, but set
      # here so any integration smoke-tests that read .env also have them).
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      CHANNEL_ENCRYPTION_KEY: ci-test-channel-key-not-used-in-prod

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (with dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        # Backlog drained 2026-07-10: 329 findings → 0. The bulk auto-fixed
        # (`ruff check --fix`, ~141 import-sort/style); the rest were real
        # code fixes (dead-var deletes, ambiguous-name renames, a closure
        # binding, a missing import) plus intentional-category ignores scoped
        # in pyproject.toml (tests/*, scripts/*, LLM-prompt E501, etc.).
        # BLOCKING again — keep it green.
        working-directory: backend
        run: python -m ruff check .

      - name: Tests (offline suite)
        working-directory: backend
        run: python -m pytest -q -p no:randomly

      - name: Type-check (mypy ratchet)
        # BLOCKING (H7). Was `continue-on-error: true` with a comment claiming
        # "existing errors are grandfathered" — but nothing implemented that, so
        # the result was discarded entirely and new code could add type errors
        # freely. The ratchet is the missing mechanism: backend/mypy_baseline.txt
        # records the pre-existing errors, and the build fails on any NEW one, so
        # the count can only go down. Fixed errors are reported as progress.
        # mypy is pinned in pyproject.toml — a baseline only means something
        # against the version that produced it.
        working-directory: backend
        run: python scripts/mypy_ratchet.py

  # ─── The chain checks itself ───────────────────────────────────────────────
  chain:
    name: Chain wires (harness)
    runs-on: ubuntu-latest
    # Must exceed DRILL_TIMEOUT_S (240s) in scripts/drill_registry.py, or a hung
    # drill is cancelled by the job before it can report DRILL TIMEOUT.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # aiohttp + aioresponses: scripts/ssrf_drill.py's fetcher-level cases
      # (3, 5, 7) import both — without them this step reds on ImportError,
      # a dead wire the chain job exists to catch everywhere ELSE.
      # python-dotenv + psycopg: the guard reads its caps from
      # src.core.settings, whose import chain is dotenv -> src.repositories.pg
      # -> psycopg (first PR #496 run: 9/10 cases "No module named 'dotenv'").
      - run: pip install pyyaml aiohttp aioresponses python-dotenv "psycopg[binary]"

      # Every NODE in detect -> triage -> repair -> verify -> PR has always been
      # healthy. The WIRES between them kept breaking silently: two spellings of
      # one bot name cost 17 dead days, a SIGPIPE killed the repair checker on
      # any diff over 800 lines, and an output written only on the success path
      # left the outage unannounced. Nothing watched the wires, because every
      # individual workflow was green. This job watches the wires.
      - name: Every wire connects
        run: python scripts/chain_check.py --no-map

      # And this is the part that matters: a checker nobody has watched fail is
      # indistinguishable from a checker that cannot fail. The drill breaks three
      # wires on purpose, by three different mechanisms, and demands the checker
      # name each one — plus a negative control (a comment-only edit) that must
      # stay quiet. If chain_check.py ever silently stops detecting, this fails.
      - name: The checker can still fail
        run: python scripts/chain_check.py --drill

      # The registry is the most dangerous file in the harness: if it stops
      # detecting, it certifies every other guard. So it is held to its own
      # standard — five deliberate breaks plus a negative control.
      #
      # This runs FIRST, deliberately. A failed step skips the ones after it, so
      # if the guard sweep below went first and failed, we would never learn
      # whether the registry can still detect at all — which is the one answer
      # you need when it is red.
      - name: The registry can still fail
        run: python scripts/drill_registry.py --drill

      # Every guard CI runs must declare how to make itself fail. Ten guards here
      # shipped unable to fire, across four consecutive rounds — each was
      # correct-looking code in the wrong position, reporting success about a
      # different question than the one that mattered. A fifth round would find
      # guard eleven; this is the mechanism instead. Adding a guard to a workflow
      # is what triggers the requirement, so one cannot slip in by being forgotten.
      # The merge cage decides what reaches real users without the owner. It is
      # held to the same standard as everything else it judges: broken on purpose
      # six ways, plus a negative control. Network-free, so it runs here.
      # One bug class, 43 copies, nothing stopping the 44th. Exactly the shape
      # of the seven log-injection alerts sitting open right now: fixing the
      # instances without adding the guard is how a class grows.
      - name: No text decoded with the machine's locale
        run: python scripts/encoding_guard.py

      - name: That guard can still fail
        run: python scripts/encoding_guard.py --drill

      # The broom that sorts worktrees and local branches into SAFE / KEEP / ASK.
      # Its danger is asymmetric: a wrong KEEP costs disk, a wrong SAFE costs the
      # owner work he never saved.
      #
      # ONLY `--drill` MAY RUN HERE. The drill builds its own git repo in a temp
      # dir, so it is portable and network-free. The CENSUS reads the owner's
      # local disk, which a cloud runner cannot see -- pointing this step at the
      # checkout would census one clean worktree, report all-green, and become
      # another guard that cannot fire.
      - name: The broom still refuses to sweep up unsaved work
        run: python scripts/worktree_census.py --drill

      # The broom's ENTRANCE. Same reason this step sits next to the one above and
      # not in branch-reaper.yml alone: that workflow runs weekly, so a break
      # would sit undetected for up to seven days in the one component whose whole
      # job is deleting things.
      - name: The reaper still refuses, and still delegates
        run: python scripts/worktree_reaper.py --drill

      - name: The ruleset checker can still fail
        run: python scripts/ruleset_gate.py --drill
      - name: Would the ruleset wedge the repo?
        run: python scripts/ruleset_gate.py --check --scope ruleset
      # WIRED FOR REAL, NOT IN A COMMENT. Both of these were referenced only
      # from commented-out example lines, so `drill_registry.discover()` counted
      # them as invoked and certified two guards that NOTHING RAN. #362 taught
      # discover() to ignore comments, which turned them into STALE ENTRY --
      # correctly. The fix is to invoke them, not to un-declare them.
      - name: Every alert path still reaches a human
        run: python scripts/check_alert_paths.py

      - name: Every slack step passes a token, a title and a real channel
        run: python scripts/check_workflow_slack_wiring.py

      - name: The review-debt reader can still fail (and still refuses to gate)
        run: python scripts/review_debt.py --drill

      # The guard on the one route that makes outbound requests to a URL a
      # stranger chose (docs/plans/2026-09-04-url-fetch/spec.md). Ten
      # mutations, each a real SSRF bypass, plus a negative control.
      - name: The SSRF guard can still fail
        run: python scripts/ssrf_drill.py --drill

      - name: Every guard declares its drill
        run: python scripts/drill_registry.py --run-drills

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Lock ⇄ package.json sync, on the JSON, before npm ci. npm ci catches the
      # same drift itself, but with 40 lines of usage text; this names the edge.
      # It exists mainly for the local commit gate (scripts/agent-gate.sh), which
      # runs against installed node_modules and cannot see a pruned lock (#503).
      - name: Lockfile sync (scripts/check_lock_sync.py)
        run: python scripts/check_lock_sync.py frontend

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Type-check (tsc)
        working-directory: frontend
        run: npm run type-check

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Build (next build)
        working-directory: frontend
        run: npm run build

      # Build the SAME image Railway builds. Everything above runs on the checkout,
      # not on the Dockerfile — so a Dockerfile that fails (#503 emptied public/,
      # its COPY died, two prod deploys failed) never showed here. No push, no
      # registry: an image that builds is the whole assertion.
      - name: Docker image builds (frontend/Dockerfile)
        run: docker build --quiet -t job360-frontend-ci frontend

  # ── Make this loop LOUD ───────────────────────────────────────────────────
  # Measured 2026-07-26: of 9 workflows, only doc-sync could ever reach a human —
  # it alone had issue plumbing. live-e2e then failed 8 consecutive nights
  # unnoticed over a 6-line config gap. A watcher nobody reads is worse than no
  # watcher, so every scheduled loop now produces an OBJECT with a lifecycle:
  # fail -> open/comment one deduped issue; pass -> auto-close it.
  # Deliberately silent on pull_request: a red PR is already visible in the PR,
  # and an issue per red PR would be noise (noise is how STATUS-DAILY.md died).
  notify:
    name: Report failure as an issue
    needs: [backend, frontend, chain]
    if: >-
      always() && (github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: write # to wake the triage loop (gh workflow run triage.yml)
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Loop RED: ci (main) is failing"
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            {
              echo "\`ci.yml\` failed on **${{ github.event_name }}** (\`${{ github.ref_name }}\`)."
              echo
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "- Commit: \`${{ github.sha }}\`"
            } > notify-body.md
            if [ -z "$num" ]; then
              # LABEL + HAND OFF. Until 2026-08-03 this line was the end of the road:
              # the issue was created with GITHUB_TOKEN, which raises NO `issues:
              # opened` event (GitHub blocks that recursion), carried no `harness`
              # label, and dispatched nothing — so no loop ever diagnosed it and no
              # email was sent. The alarm rang into an empty room. Proven live:
              # issue #190 (security RED) opened and auto-closed with zero
              # diagnosis; #185 sat unread for days. Seven loops shared this bug.
              new=$(gh issue create --title "$title" --body-file notify-body.md --label harness)
              n="${new##*/}"
              if gh workflow run triage.yml -f issue="$n"; then
                echo "raised #$n and woke triage" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::issue #$n raised but triage could not be woken - diagnose by hand"
              fi
            else
              gh issue comment "$num" --body-file notify-body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" \
              --comment "Green again in run ${{ github.run_id }}. (auto-close)"
          fi
