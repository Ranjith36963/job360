name: Watchdog (did the WATCHERS stop?)

# ISSUE #144 — one level up from "did the product stop?": this asks "did the
# harness itself stop watching?". A workflow that stops running looks
# identical to one that passes — no red X, no email — and GitHub silently
# auto-disables schedules after ~60 days of repo inactivity. So the entire
# monitoring layer can switch itself off with every dashboard still green.
#
# Free: read-only GitHub API, no LLM. Needs no DB secret, so it keeps working
# even if PROD_DATABASE_URL is missing or rotated.
#
# The sourcing-specific absence check that used to live in this file (did
# anything stop FETCHING jobs?) was deleted 2026-09-05 along with the product
# it watched (slice 5, #483). This job is unrelated to that product — it
# watches the harness's own workflows — so it survives.
on:
  schedule:
    - cron: "30 7 * * *" # 07:30 UTC daily — a watchdog with no schedule is the very silence it exists to catch
  workflow_dispatch: {} # the drill entrance — every loop must be fireable on purpose

permissions:
  contents: read
  issues: write
  # actions: write is what lets `gh workflow run triage.yml` hand an alarm to the
  # triage loop. Without it the dispatch 403s and the issue is raised into silence
  # — exactly the break this handoff exists to fix, one layer down. Found by drill
  # run 30309508655: issue #162 was raised, the dispatch failed, and only the
  # `|| warn` fallback made it visible.
  actions: write

concurrency:
  group: absence-check
  cancel-in-progress: false

jobs:
  watchdog:
    name: Are the watchers still running?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Check every scheduled workflow reported inside its window
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/watchdog_check.py --json watchdog.json > watchdog.md 2>&1
          code=$?
          set -e
          cat watchdog.md
          cat watchdog.md >> "$GITHUB_STEP_SUMMARY"
          echo "stopped=$code" >> "$GITHUB_OUTPUT"
          # THE SECOND QUESTION (slice 4, 2026-09-11): which watchers are
          # running but RED? Two of the three production watchers were
          # silent-red for a month with every dashboard green — each opened
          # its own issue, which went to triage, which emailed, and nothing
          # reached the channel the owner reads. This roll-up is the one
          # wire that turns "N watchers are red" into ONE Slack message.
          # Absent JSON means the checker crashed before writing it, and an
          # unknown count must never read as zero.
          if [ -f watchdog.json ]; then
            echo "red_count=$(jq -r .red_count watchdog.json)" >> "$GITHUB_OUTPUT"
            echo "red_list=$(jq -r '.red_list | join(", ")' watchdog.json)" >> "$GITHUB_OUTPUT"
          fi
          [ "$code" -le 1 ] || exit "$code"

      - name: Open, update or close the tracking issue
        id: wraise
        if: always() && steps.watch.outputs.stopped != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="WATCHDOG: a scheduled workflow has stopped running"
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "${{ steps.watch.outputs.stopped }}" = "1" ]; then
            {
              cat watchdog.md
              echo
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > wbody.md
            if [ -z "$num" ]; then
              new=$(gh issue create --title "$title" --body-file wbody.md --label harness)
              n="${new##*/}"   # same GITHUB_TOKEN recursion block as above
              echo "raised=$n" >> "$GITHUB_OUTPUT"
              if gh workflow run triage.yml -f issue="$n"; then
                echo "woken=yes" >> "$GITHUB_OUTPUT"
              else
                # Triage will not run, so it cannot send the alert either.
                # Record that so the fallback step emails the owner directly:
                # a broken handoff must never mean a silent alarm, which is
                # the one outcome this entire chain exists to prevent.
                echo "woken=no" >> "$GITHUB_OUTPUT"
                echo "::warning::issue #$n was raised but triage could not be woken - diagnose it by hand"
              fi
            else
              gh issue comment "$num" --body-file wbody.md
            fi
          # Never close an outage issue on a canary-blind run — kept simple
          # here: this job has no canary of its own (the sourcing job that
          # provided CANARY_OUTCOME was deleted with the absence check).
          elif [ -n "$num" ]; then
            gh issue close "$num" \
              --comment "All watchers reporting again as of run ${{ github.run_id }}. (auto-close)"
          fi

      # FALLBACK last mile: normally triage posts the Slack message, because
      # its alert carries the diagnosis. But if the handoff failed, triage
      # never runs and never alerts — so the alarm would be silent. That is
      # precisely the 403 bug found on 2026-07-27, which stayed invisible
      # because the failing call was the last thing the job did. Slack is the
      # one place the owner is told (decision 2026-10-02: no email), so the
      # fallback speaks there too.
      - name: Slack — triage could not be woken
        if: always() && steps.wraise.outputs.woken == 'no'
        uses: ./.github/actions/slack
        with:
          channel: needs-your-decision
          severity: warn
          title: "Watchdog issue #${{ steps.wraise.outputs.raised }} needs you"
          body: |
            What happened: a scheduled workflow stopped running, and the helper that normally explains it could not be started.
            What to do: open the issue and check which workflow stopped. Re-enable it under Actions if GitHub switched it off.
            Link: ${{ github.server_url }}/${{ github.repository }}/issues/${{ steps.wraise.outputs.raised }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # Rule B (scripts/check_alert_paths.py): the step above keys off outputs
      # the tracking-issue step only writes if it reaches that line. If it dies
      # half way (a gh 403), say THAT instead of going silent.
      - name: Slack — the watchdog could not open its tracking issue
        if: always() && steps.wraise.outcome == 'failure'
        uses: ./.github/actions/slack
        with:
          channel: needs-your-decision
          severity: warn
          title: "Watchdog could not open its tracking issue"
          body: |
            What happened: the watchdog ran but failed while opening or updating its issue, so a stopped workflow may be unreported.
            What to do: open the run, read the red step, and check Actions for any workflow that stopped.
            Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # ── RED WATCHERS REACH SLACK — ANNOUNCE THE TRANSITION, NOT THE STATE ──
      # scripts/slack_transition.py reads the marker issue `Loop RED:
      # watchdog-red` and decides: green->red SEND (kind `opened`), red->red
      # SILENT, red->green SEND (kind `recovered`), green->green SILENT. The
      # marker is opened and closed HERE, in the same step, so Slack and the
      # tracker cannot disagree. Measured 2026-08-17: synthetic-live alone was
      # 29 msg/week of pure repetition under "post every failure"; under
      # transitions it is one message when it breaks and one when it is fixed.
      - name: Announce the transition, not the state
        id: transition
        if: always() && steps.watch.outputs.red_count != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RED_COUNT: ${{ steps.watch.outputs.red_count }}
          RED_LIST: ${{ steps.watch.outputs.red_list }}
        run: |
          set -euo pipefail
          state=ok
          [ "$RED_COUNT" != "0" ] && state=failing
          python scripts/slack_transition.py --key watchdog-red --state "$state" \
            --channel needs-your-decision --severity warn > transition.json
          send=$(jq -r .send transition.json)
          kind=$(jq -r .kind transition.json)
          echo "send=$send" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          title="Loop RED: watchdog-red"
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          # The marker body records WHICH watchers are red (`Red watchers:
          # a,b`). Red->red is silent only while that SET is unchanged: one
          # marker issue stays open for weeks, and a NEW watcher going red
          # underneath it used to post nothing (run 37017018120 saw
          # external-health.yml red while #667 was open for security.yml).
          cur=$(jq -r '.red_list | sort | join(",")' watchdog.json)
          write_marker() {
            local list="$1" n
            n=$(printf '%s' "$list" | tr ',' '\n' | grep -c . || true)
            {
              echo "$n watcher(s) are running but RED: ${list//,/, }"
              echo
              echo "Red watchers: $list"
              echo
              echo "This is the marker issue for the Slack transition rule — it closes itself when all watchers are green again."
              echo "Details: the watchdog run summary. Each red watcher also has its own \`Loop RED:\` issue."
              echo
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > marker.md
          }
          if [ "$kind" = "opened" ] && [ -z "$num" ]; then
            write_marker "$cur"
            gh issue create --title "$title" --body-file marker.md --label harness
          elif [ "$kind" = "recovered" ] && [ -n "$num" ]; then
            gh issue close "$num" --comment "All watchers green again as of run ${{ github.run_id }}. (auto-close)"
          elif [ "$kind" = "still_failing" ] && [ -n "$num" ]; then
            body=$(gh issue view "$num" --json body --jq .body)
            recorded=$(printf '%s\n' "$body" | sed -n 's/^Red watchers: //p' | head -1)
            if [ -z "$recorded" ]; then
              # Marker written before the set was recorded: use its first line.
              recorded=$(printf '%s\n' "$body" | sed -n 's/^[0-9]* watcher(s) are running but RED: //p' | head -1 | sed 's/, /,/g')
            fi
            rec_sorted=$(printf '%s' "$recorded" | tr ',' '\n' | grep . | sort -u || true)
            cur_sorted=$(printf '%s' "$cur" | tr ',' '\n' | grep . | sort -u || true)
            new=$(comm -13 <(printf '%s\n' "$rec_sorted") <(printf '%s\n' "$cur_sorted") | grep . | paste -sd, - || true)
            if [ "$rec_sorted" != "$cur_sorted" ]; then
              write_marker "$cur"
              gh issue edit "$num" --body-file marker.md
            fi
            if [ -n "$new" ]; then
              echo "send=true" >> "$GITHUB_OUTPUT"
              echo "kind=grew" >> "$GITHUB_OUTPUT"
              echo "new_list=${new//,/, }" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Slack — watchers are RED
        if: always() && steps.transition.outputs.send == 'true' && steps.transition.outputs.kind == 'opened'
        uses: ./.github/actions/slack
        with:
          channel: needs-your-decision
          severity: warn
          title: "watchdog: ${{ steps.watch.outputs.red_count }} watcher(s) are red — ${{ steps.watch.outputs.red_list }}"
          body: |
            Each has failed at least twice in a row. The run summary shows the streak and the last green day per watcher.
            A watcher that is red for a missing secret stays red until the secret exists — that is yours to set, not code.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # THE SET GREW: marker already open, but a watcher that was not in it is
      # red now. That is news (green->red for THAT watcher), not repetition.
      - name: Slack — another watcher went red
        if: always() && steps.transition.outputs.kind == 'grew'
        uses: ./.github/actions/slack
        with:
          channel: needs-your-decision
          severity: warn
          title: "Another watcher went red: ${{ steps.transition.outputs.new_list }}"
          body: |
            What happened: a checker that was passing has started failing. All red now: ${{ steps.watch.outputs.red_list }}.
            What to do: open the run and read the streak for the new one. If it says a secret is missing, add the secret.
            Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # Recovery is NOT an incident — it is news. It goes to the muted log
      # channel so needs-your-decision only ever contains things still open.
      - name: Slack — watchers back to green
        if: always() && steps.transition.outputs.send == 'true' && steps.transition.outputs.kind == 'recovered'
        uses: ./.github/actions/slack
        with:
          channel: log-github-ci
          severity: info
          title: "watchdog: every watcher is green again"
          body: |
            The red watchers reported in `Loop RED: watchdog-red` are passing again and the marker was auto-closed.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # FALLBACK LAST MILE (scripts/check_alert_paths.py rule B). Every branch
      # above keys off outputs the transition step only writes if it SUCCEEDS —
      # a gh 403 or an unreadable marker would skip them all and the red
      # watchers would go unannounced. If the alarm path itself broke, say THAT.
      - name: Slack — the watchdog's alarm path itself broke
        if: always() && (steps.transition.outcome == 'failure' || steps.watch.outcome == 'failure')
        uses: ./.github/actions/slack
        with:
          channel: needs-your-decision
          severity: warn
          title: "watchdog: the alarm path itself broke — red watchers may be unannounced"
          body: |
            The watchdog ran but could not decide whether to announce (the checker crashed, or the
            transition marker could not be read). Open the run and look; no message here means
            the messenger broke, not that every watcher is fine.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
