name: External health (does anyone read Sentry? are our keys alive?)

# TWO DETECTOR CLASSES THIS HARNESS HAD ZERO OF, both proven by real incidents.
#
# 1. NOBODY READ SENTRY. Measured 2026-08-03: `git grep -i sentry` across
#    .github/ and scripts/ returned ZERO hits, while ten unresolved issues sat
#    in the project unread. One of them — PYTHON-FASTAPI-8, a btree index-size
#    crash from /api/search — had been there since 2026-07-27 describing, with a
#    full stack trace, the exact fault that froze a real user's feed for SEVEN
#    DAYS. It was rediscovered by hand a week later. An error tracker with no
#    consumer is a diary.
#
# 2. NO KEY EVER ANNOUNCED ITS OWN EXPIRY. GROQ_API_KEY died silently; the
#    provider chain logged "PERMANENTLY misconfigured" and kept calling it, so
#    one CV upload cost 584 seconds of doomed round-trips. RESEND_API_KEY has
#    the same exposure and a worse blast radius: login is passwordless, so a
#    dead Resend key means NOBODY CAN LOG IN — and no existing check would go
#    red, because every live probe injects a session cookie instead of walking
#    the real email path.
#
# Both jobs are dumb: HTTP calls and comparisons, no model. That is what lets
# them raise an alarm on their own authority.

on:
  schedule:
    - cron: "10 7 * * *" # 07:10 UTC daily — before the 08:00 absence check
  workflow_dispatch:
    inputs:
      drill:
        description: "FIRE DRILL — force a red to prove the escalation path works end to end"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write # to hand the alarm to the triage loop

concurrency:
  group: external-health
  cancel-in-progress: false

jobs:
  sentry:
    name: Read Sentry (nothing else does)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the Sentry token exists
        id: tok
        run: echo "have=${{ secrets.SENTRY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Say so loudly if it cannot run
        if: steps.tok.outputs.have != 'true'
        run: |
          echo "::error::SENTRY_API_TOKEN is not set — the Sentry poller cannot run."
          echo "A silent skip here recreates the exact blindness this loop exists to end."
          echo "Create a token with event:read at https://sentry.io/settings/account/api/auth-tokens/"
          echo "then: gh secret set SENTRY_API_TOKEN"
          exit 1

      - name: Poll Sentry for NEW unresolved issues
        id: poll
        env:
          SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
          SENTRY_FORCE_RED: ${{ inputs.drill && '1' || '' }}
        run: |
          set +e
          python scripts/sentry_poll.py > sentry.md 2>&1
          code=$?
          set -e
          cat sentry.md
          cat sentry.md >> "$GITHUB_STEP_SUMMARY"
          echo "new=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -le 1 ] || exit "$code" # exit 2 = blind, fail LOUD

      - name: Raise it, and hand it to triage
        if: always() && steps.poll.outputs.new != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.drill }}" = "true" ]; then
            title="DRILL: Sentry poll test - not a real problem"
          else
            title="SENTRY: new unresolved errors in production"
          fi
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "${{ steps.poll.outputs.new }}" = "1" ]; then
            { cat sentry.md
              echo
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > body.md
            if [ -z "$num" ]; then
              new=$(gh issue create --title "$title" --body-file body.md --label harness)
              n="${new##*/}"
              gh workflow run triage.yml -f issue="$n" \
                || echo "::warning::issue #$n raised but triage could not be woken"
            else
              gh issue comment "$num" --body-file body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "No new unresolved Sentry issues as of run ${{ github.run_id }}. (auto-close)"
          fi

  providers:
    name: Are our credentials still alive?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Probe every configured provider
        id: probe
        env:
          # Absent keys are simply not probed — absent is not broken. But if
          # NONE are set the script exits 2, because a probe with nothing to
          # probe is blind, not clean.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          PROBE_FORCE_RED: ${{ inputs.drill && '1' || '' }}
        run: |
          set +e
          python scripts/provider_probe.py > providers.md 2>&1
          code=$?
          set -e
          cat providers.md
          cat providers.md >> "$GITHUB_STEP_SUMMARY"
          echo "dead=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -le 1 ] || exit "$code" # exit 2 = nothing configured, fail LOUD

      - name: Raise it, and hand it to triage
        if: always() && steps.probe.outputs.dead != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.drill }}" = "true" ]; then
            title="DRILL: provider probe test - not a real problem"
          else
            title="KEYS: a provider credential is dead"
          fi
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "${{ steps.probe.outputs.dead }}" = "1" ]; then
            { cat providers.md
              echo
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > body.md
            if [ -z "$num" ]; then
              new=$(gh issue create --title "$title" --body-file body.md --label harness)
              n="${new##*/}"
              gh workflow run triage.yml -f issue="$n" \
                || echo "::warning::issue #$n raised but triage could not be woken"
            else
              gh issue comment "$num" --body-file body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Every configured credential authenticated as of run ${{ github.run_id }}. (auto-close)"
          fi
