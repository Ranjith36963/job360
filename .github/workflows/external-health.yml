name: External health (does anyone read Sentry? are our keys alive?)

# TWO DETECTOR CLASSES THIS HARNESS HAD ZERO OF, both proven by real incidents.
#
# 1. NOBODY READ SENTRY. Measured 2026-08-03: `git grep -i sentry` across
#    .github/ and scripts/ returned ZERO hits, while ten unresolved issues sat
#    in the project unread. One of them — PYTHON-FASTAPI-8, a btree index-size
#    crash from /api/search — had been there since 2026-07-27 describing, with a
#    full stack trace, the exact fault that froze a real user's feed for SEVEN
#    DAYS. It was rediscovered by hand a week later. An error tracker with no
#    consumer is a diary.
#
# 2. NO KEY EVER ANNOUNCED ITS OWN EXPIRY. GROQ_API_KEY died silently; the
#    provider chain logged "PERMANENTLY misconfigured" and kept calling it, so
#    one CV upload cost 584 seconds of doomed round-trips. RESEND_API_KEY has
#    the same exposure and a worse blast radius: login is passwordless, so a
#    dead Resend key means NOBODY CAN LOG IN — and no existing check would go
#    red, because every live probe injects a session cookie instead of walking
#    the real email path.
#
# Both jobs are dumb: HTTP calls and comparisons, no model. That is what lets
# them raise an alarm on their own authority.

on:
  schedule:
    - cron: "10 7 * * *" # 07:10 UTC daily — before the 08:00 absence check
  workflow_dispatch:
    inputs:
      drill:
        description: "FIRE DRILL — force a red to prove the escalation path works end to end"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write # to hand the alarm to the triage loop

concurrency:
  group: external-health
  cancel-in-progress: false

jobs:
  sentry:
    name: Read Sentry (nothing else does)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Check the Sentry token exists
        id: tok
        run: echo "have=${{ secrets.SENTRY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Say so loudly if it cannot run
        if: steps.tok.outputs.have != 'true'
        run: |
          echo "::error::SENTRY_API_TOKEN is not set — the Sentry poller cannot run."
          echo "A silent skip here recreates the exact blindness this loop exists to end."
          echo "Create a token with event:read at https://sentry.io/settings/account/api/auth-tokens/"
          echo "then: gh secret set SENTRY_API_TOKEN"
          exit 1

      - name: Poll Sentry for NEW unresolved issues
        id: poll
        env:
          SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
          SENTRY_FORCE_RED: ${{ inputs.drill && '1' || '' }}
        run: |
          set +e
          python scripts/sentry_poll.py > sentry.md 2>&1
          code=$?
          set -e
          cat sentry.md
          cat sentry.md >> "$GITHUB_STEP_SUMMARY"
          echo "new=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -le 1 ] || exit "$code" # exit 2 = blind, fail LOUD

      - name: Raise it, and hand it to triage
        if: always() && steps.poll.outputs.new != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.drill }}" = "true" ]; then
            title="DRILL: Sentry poll test - not a real problem"
          else
            title="SENTRY: new unresolved errors in production"
          fi
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "${{ steps.poll.outputs.new }}" = "1" ]; then
            { cat sentry.md
              echo
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > body.md
            if [ -z "$num" ]; then
              new=$(gh issue create --title "$title" --body-file body.md --label harness)
              n="${new##*/}"
              gh workflow run triage.yml -f issue="$n" \
                || echo "::warning::issue #$n raised but triage could not be woken"
            else
              gh issue comment "$num" --body-file body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "No new unresolved Sentry issues as of run ${{ github.run_id }}. (auto-close)"
          fi

  providers:
    name: Are our credentials still alive?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Probe every configured provider
        id: probe
        env:
          # Absent keys are simply not probed — absent is not broken. But if
          # NONE are set the script exits 2, because a probe with nothing to
          # probe is blind, not clean.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # email_sender.py falls back to SMTP_PASSWORD when it looks like a
          # Resend key, and the probe mirrors that fallback — so without this
          # line an installation keyed that way reads as "no email credential
          # in CI secrets" and opens a daily issue while login works fine. A
          # false alarm on the loudest possible subject.
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          PROBE_FORCE_RED: ${{ inputs.drill && '1' || '' }}
        run: |
          set +e
          python scripts/provider_probe.py > providers.md 2>&1
          code=$?
          set -e
          cat providers.md
          cat providers.md >> "$GITHUB_STEP_SUMMARY"
          echo "dead=$code" >> "$GITHUB_OUTPUT"
          # 0 ok · 1 a key is dead · 3 a whole capability has NO key — 1 and 3
          # are both reported as issues below, so the step itself stays green.
          # 2 (the probe is blind) is the one that must fail the job LOUD.
          case "$code" in 0 | 1 | 3) ;; *) exit "$code" ;; esac

      - name: Raise it, and hand it to triage
        if: always() && steps.probe.outputs.dead != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code="${{ steps.probe.outputs.dead }}"
          # TWO ALARMS, because they have TWO DIFFERENT FIXES (same lesson as
          # accuracy-audit.yml). "dead" = a key we own stopped working -> rotate
          # it. "missing" = we never had one -> create one. Blurring them sends
          # the owner to the wrong page.
          if [ "${{ inputs.drill }}" = "true" ]; then
            title="DRILL: provider probe test - not a real problem"
          elif [ "$code" = "3" ]; then
            title="KEYS: no email credential in CI secrets - production status unverified"
          else
            title="KEYS: a provider credential is dead"
          fi
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "$code" = "1" ] || [ "$code" = "3" ]; then
            { cat providers.md
              echo
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > body.md
            if [ -z "$num" ]; then
              new=$(gh issue create --title "$title" --body-file body.md --label harness)
              n="${new##*/}"
              gh workflow run triage.yml -f issue="$n" \
                || echo "::warning::issue #$n raised but triage could not be woken"
            else
              gh issue comment "$num" --body-file body.md
            fi
          elif [ "$code" = "0" ]; then
            # ONLY a real green run may close an alarm. This used to be a bare
            # `elif`, so exit 2 — the probe measured NOTHING and said so — would
            # auto-close the open alarm: a blind run silently reporting all-clear,
            # which is the exact failure shape this repo keeps paying for.
            # Both titles close here: whichever fix the owner applied (rotated a
            # dead key, or created a first one), a clean probe proves it worked.
            for t in "KEYS: a provider credential is dead" \
                     "KEYS: no email credential in CI secrets - production status unverified"; do
              n=$(gh issue list --state open --json number,title \
                    --jq ".[] | select(.title==\"$t\") | .number" | head -1)
              # `if`, not `[ -n "$n" ] && ...` — under `set -e` a false test as
              # the last command of a loop body kills the whole step.
              if [ -n "$n" ]; then
                gh issue close "$n" \
                  --comment "Every configured credential authenticated as of run ${{ github.run_id }}. (auto-close)"
              fi
            done
          fi

  secrets:
    name: Which repository secrets exist? (names only, never values)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # PRESENCE ONLY. Every line below is a `!= ''` comparison, so the runner
      # only ever sees "true" or "false" — the secret VALUE never enters this
      # job's environment, logs, summary or issue body. Nobody should have to run
      # `gh secret list` to learn what is set: RAILWAY_TOKEN decides whether the
      # auto-rollback can act at all, and SENTRY_AUTH_TOKEN sat empty for weeks
      # with nothing reporting it. When a workflow starts using a new secret,
      # add it here AND to the REQUIREMENTS table in the step; a name found in
      # the workflows but missing from the table is flagged UNCLASSIFIED.
      - name: Check which secrets exist (presence only)
        id: check
        env:
          HAS_BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE != '' }}
          HAS_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_CODERABBIT_TRIGGER_TOKEN: ${{ secrets.CODERABBIT_TRIGGER_TOKEN != '' }}
          HAS_MERGE_TOKEN: ${{ secrets.MERGE_TOKEN != '' }}
          HAS_OWNER_ALERT_EMAIL: ${{ secrets.OWNER_ALERT_EMAIL != '' }}
          HAS_PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL != '' }}
          HAS_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAS_R2_BUCKET: ${{ secrets.R2_BUCKET != '' }}
          HAS_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT != '' }}
          HAS_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
          HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
          HAS_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY != '' }}
          HAS_SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN != '' }}
          HAS_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
          HAS_SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN != '' }}
          HAS_SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD != '' }}
          HAS_SMOKE_SESSION: ${{ secrets.SMOKE_SESSION != '' }}
          HAS_SMTP_EMAIL: ${{ secrets.SMTP_EMAIL != '' }}
          HAS_SMTP_FROM: ${{ secrets.SMTP_FROM != '' }}
          HAS_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD != '' }}
          SECRETS_FORCE_RED: ${{ inputs.drill && '1' || '' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          # (names, level, one-line reason, what breaks when ALL names are absent)
          # A group of several names is an alias/fallback set: satisfied if ANY
          # one of them is present.
          REQUIREMENTS = [
              (["CLAUDE_CODE_OAUTH_TOKEN"], "REQUIRED",
               "review-bugs fails loud without it; triage and PR repair cannot run",
               "the reviewer-bugs merge gate goes red, and the triage / PR-repair loops cannot run"),
              (["RAILWAY_TOKEN"], "REQUIRED",
               "auto-rollback REFUSES without it (post-merge-watch, synthetic-live)",
               "a bad deploy is NOT rolled back automatically; the rollback step refuses"),
              (["SLACK_BOT_TOKEN"], "REQUIRED",
               "every alert reaches Slack through it; slack-drill fails without it",
               "the harness is mute on Slack: alerts are raised on GitHub only"),
              (["SENTRY_API_TOKEN"], "REQUIRED",
               "scripts/sentry_poll.py reads ONLY this name; it fails loud without it",
               "nobody reads Sentry: the poller cannot run and post-merge-watch cannot see new errors"),
              (["SENTRY_AUTH_TOKEN"], "OPTIONAL",
               "legacy name; post-merge-watch falls back to it only if SENTRY_API_TOKEN is unset",
               "nothing on its own; it never satisfies the poller"),
              (["RESEND_API_KEY", "SMTP_PASSWORD"], "REQUIRED",
               "login is passwordless email; SMTP_PASSWORD is the documented Resend fallback",
               "no login email can be sent, so NOBODY can log in; the owner email alert is also mute"),
              (["SMOKE_PASSWORD", "SMOKE_SESSION"], "REQUIRED",
               "the scheduled synthetic walk demands an authed session (SMOKE_REQUIRE_AUTHED)",
               "the scheduled live walk of production goes red, or the authed corners go unwalked"),
              (["PROD_DATABASE_URL"], "REQUIRED",
               "db-backup dumps production with it",
               "the nightly database backup cannot dump production"),
              (["BACKUP_PASSPHRASE"], "REQUIRED",
               "db-backup encrypts the dump with it",
               "the nightly database backup cannot encrypt, so it fails"),
              (["R2_ACCESS_KEY_ID"], "REQUIRED",
               "db-backup uploads to R2 with it",
               "the nightly backup cannot upload to R2"),
              (["R2_SECRET_ACCESS_KEY"], "REQUIRED",
               "db-backup uploads to R2 with it",
               "the nightly backup cannot upload to R2"),
              (["R2_ENDPOINT"], "REQUIRED",
               "db-backup needs the R2 endpoint",
               "the nightly backup cannot upload to R2"),
              (["R2_BUCKET"], "REQUIRED",
               "db-backup needs the bucket name",
               "the nightly backup cannot upload to R2"),
              (["MERGE_TOKEN"], "OPTIONAL",
               "falls back to GITHUB_TOKEN and warns loudly each run",
               "a queued merge starts no workflow on main"),
              (["CODERABBIT_TRIGGER_TOKEN"], "OPTIONAL",
               "pr-advisor skips quietly; reviews are triggered by hand",
               "CodeRabbit is not auto-triggered"),
              (["OWNER_ALERT_EMAIL"], "OPTIONAL",
               "the alert action never fails the caller; it warns",
               "the owner gets no direct email when triage cannot be woken"),
              (["SMTP_EMAIL"], "OPTIONAL",
               "only an input to the provider probe",
               "the email probe has less to go on"),
              (["SMTP_FROM"], "OPTIONAL",
               "only an input to the provider probe",
               "the email probe has less to go on"),
          ]

          def present(name):
              return os.environ.get("HAS_" + name, "false") == "true"

          wf_dir = Path(".github/workflows")
          texts = {p.name: p.read_text(encoding="utf-8") for p in sorted(wf_dir.glob("*.yml"))}
          found = {}  # name -> set of workflow files using it
          for text in texts.values():
              for m in re.finditer(r"secrets\.([A-Z0-9_]+)", text):
                  if m.group(1) != "GITHUB_TOKEN":
                      found.setdefault(m.group(1), set())
          for name in found:
              for fname, text in texts.items():
                  # This file lists every secret as a presence check; only a use
                  # that is NOT a bare `!= ''` comparison counts as this file using it.
                  tail = r"(?!\s*!=\s*'')" if fname == "external-health.yml" else ""
                  if re.search(r"secrets\." + name + r"\b" + tail, text):
                      found[name].add(fname)

          known = {n for names, *_ in REQUIREMENTS for n in names}
          unclassified = sorted(set(found) - known)

          rows = []
          missing = []  # (names, breaks)
          for names, level, reason, breaks in REQUIREMENTS:
              group_ok = any(present(n) for n in names)
              for n in names:
                  if present(n):
                      status = "yes"
                  elif group_ok:
                      status = "no (alias ok)"
                  else:
                      status = "NO"
                  used = ", ".join(sorted(found.get(n, []))) or "(none found)"
                  rows.append((n, status, level, used, reason))
              if level == "REQUIRED" and not group_ok:
                  missing.append((names, breaks))

          if os.environ.get("SECRETS_FORCE_RED") == "1":
              missing.append((["DRILL_FAKE_SECRET"],
                              "nothing real: this is a forced red to prove the escalation path"))

          out = ["## Repository secrets: presence only (values are never read)", "",
                 "| secret | present | tier | used by | why |", "|---|---|---|---|---|"]
          for n, status, level, used, reason in rows:
              out.append(f"| `{n}` | {status} | {level} | {used} | {reason} |")
          if unclassified:
              out += ["", "UNCLASSIFIED (used by a workflow but not in this table, add it): "
                      + ", ".join(f"`{n}`" for n in unclassified)]
              for n in unclassified:
                  print(f"::warning::secret {n} is used by a workflow but is not classified in external-health.yml")
          out += ["", f"Required secrets missing: {len(missing)}"]
          text = "\n".join(out) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(text)

          run_url = "{}/{}/actions/runs/{}".format(
              os.environ.get("GITHUB_SERVER_URL", ""),
              os.environ.get("GITHUB_REPOSITORY", ""),
              os.environ.get("GITHUB_RUN_ID", ""))
          body = ["These REQUIRED repository secrets are missing (names only, no values were read):", ""]
          for names, breaks in missing:
              label = " or ".join(f"`{n}`" for n in names)
              body.append(f"- {label}: without it, {breaks}.")
          body += ["", "Set each one with `gh secret set NAME` (or Settings, Secrets and variables, Actions).",
                   "", f"- Run: {run_url}"]
          Path("body.md").write_text("\n".join(body) + "\n", encoding="utf-8")

          for names, _breaks in missing:
              print("::error::required secret missing: " + " or ".join(names))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"missing={len(missing)}\n")
          PY

      - name: Raise it, and hand it to triage
        if: always() && steps.check.outputs.missing != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.drill }}" = "true" ]; then
            title="DRILL: required secrets check test - not a real problem"
          else
            title="KEYS: required secrets missing"
          fi
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "${{ steps.check.outputs.missing }}" != "0" ]; then
            if [ -z "$num" ]; then
              new=$(gh issue create --title "$title" --body-file body.md --label harness)
              n="${new##*/}"
              gh workflow run triage.yml -f issue="$n" \
                || echo "::warning::issue #$n raised but triage could not be woken"
            else
              gh issue comment "$num" --body-file body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" \
              --comment "Every REQUIRED secret is present as of run ${{ github.run_id }}. (auto-close)"
          fi

      # Red AFTER the alarm is raised, so a missing secret is both an issue and a
      # failed run. `always()` because the step above must never decide this.
      - name: Fail the run if a required secret is missing
        if: always() && steps.check.outputs.missing != '' && steps.check.outputs.missing != '0'
        run: |
          echo "::error::${{ steps.check.outputs.missing }} required secret group(s) missing - see the job summary."
          exit 1
