# Self-verifying encrypted Postgres backup → Cloudflare R2.
#
# Trust model: a backup is only counted if it PROVES it can be restored. Every
# run dumps prod, restores that dump into a throwaway Postgres, and asserts the
# data is really there (users/jobs/migration head) BEFORE encrypting + uploading.
# A corrupt/empty dump makes the job go RED → GitHub emails the owner. So a green
# run means "this exact file was proven restorable tonight".
#
# The dump holds user PII (emails, CVs), so it is encrypted with a passphrase
# (BACKUP_PASSPHRASE secret) before it ever leaves the runner — R2 only ever sees
# ciphertext. Restore: docs/RUNBOOK-backups.md.
name: db-backup
on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC nightly
  workflow_dispatch: {} # fire on demand from the Actions tab

# Least-privilege token (CodeQL actions/missing-workflow-permissions):
# these jobs only check out code and run tests/uploads — no repo writes.
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Throwaway Postgres used ONLY to restore-verify tonight's dump.
      #
      # MUST carry pgvector, not stock postgres. Prod enabled the `vector`
      # extension on 2026-08-07 (migration 0027, PR #244 — prod runs pgvector
      # 0.8.3 on server 18.4, verified live 2026-08-11), so pg_dump now emits
      # `CREATE EXTENSION IF NOT EXISTS vector` near the top of every dump.
      # Against stock `postgres:18` that line dies with
      #   psql:dump.sql:26: ERROR: extension "vector" is not available
      # and `-v ON_ERROR_STOP=1` aborts the restore. That failure SKIPS the
      # encrypt + upload steps, so four consecutive nights (2026-08-08 ->
      # 2026-08-11, runs 31237821860/31293351679/31354509976/31456829224)
      # pushed NOTHING to R2 while the dump itself was healthy (~23 MB).
      # The dump was never the problem — the verifier was.
      #
      # PR #244 moved ci.yml + ci-offline.yml to the pgvector image but missed
      # this workflow. Keep the major version matched to Railway's Postgres 18.
      verify_db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verify"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Install tools (Postgres client 18)
        run: |
          # Railway's Postgres is 18.x; pg_dump refuses to dump a server newer
          # than itself, and Ubuntu 24.04's default client is 16. Use PostgreSQL's
          # OFFICIAL repo-setup script (postgresql-common) — it installs the PGDG
          # apt key/repo correctly, avoiding the `sudo gpg --dearmor` /dev/tty
          # failure that a manual key import hits in CI. aws CLI v2 is pre-installed.
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          # Ubuntu's base client-16 owns /usr/bin/pg_dump, so plain `pg_dump`
          # stays 16 even with 18 installed. Put the 18 binaries first on PATH
          # for every later step (dump + verify both need pg_dump/psql 18).
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          aws --version

      - name: Dump prod database
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          echo "TS=$TS" >> "$GITHUB_ENV"
          pg_dump --no-owner --no-privileges "$DATABASE_URL" > dump.sql
          SIZE=$(stat -c%s dump.sql)
          echo "dump size: $SIZE bytes"
          # A real dump of a live DB is far bigger than 10 KB. Guards against
          # "backed up the wrong / empty database".
          test "$SIZE" -gt 10000

      - name: VERIFY — restore the dump into a throwaway DB and check the data
        run: |
          export PGPASSWORD=verify
          psql -h localhost -U verify -d verify -v ON_ERROR_STOP=1 -f dump.sql
          USERS=$(psql -h localhost -U verify -d verify -tAc "SELECT count(*) FROM users")
          JOBS=$(psql -h localhost -U verify -d verify -tAc "SELECT count(*) FROM jobs")
          # _schema_migrations.id is TEXT (e.g. '0024_tailored_flagged_terms'), so
          # COUNT the applied migrations (an integer) rather than max(id).
          MIG=$(psql -h localhost -U verify -d verify -tAc "SELECT count(*) FROM _schema_migrations")
          echo "restored: users=$USERS jobs=$JOBS migrations_applied=$MIG"
          # Hard gates — a dump that restores but is empty is NOT a valid backup.
          test "$USERS" -ge 1
          test "$MIG" -ge 20
          {
            echo "## ✅ Backup verified by restore"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| users restored | $USERS |"
            echo "| jobs restored | $JOBS |"
            echo "| migrations applied | $MIG |"
            echo "| dump size (bytes) | $(stat -c%s dump.sql) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt (gpg symmetric) — R2 only ever sees ciphertext
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gzip -c dump.sql > dump.sql.gz
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            -o "job360-${TS}.sql.gz.gpg" dump.sql.gz
          rm -f dump.sql dump.sql.gz
          echo "encrypted artifact: job360-${TS}.sql.gz.gpg ($(stat -c%s job360-${TS}.sql.gz.gpg) bytes)"

      - name: Upload to Cloudflare R2 (S3-compatible)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp "job360-${TS}.sql.gz.gpg" "s3://${R2_BUCKET}/job360-${TS}.sql.gz.gpg" \
            --endpoint-url "$R2_ENDPOINT"
          echo "uploaded to r2://${R2_BUCKET}/job360-${TS}.sql.gz.gpg"

      - name: Prune R2 to the newest 30 backups
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # List backups oldest→newest, delete all but the newest 30.
          mapfile -t OLD < <(aws s3 ls "s3://${R2_BUCKET}/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $4}' | grep '^job360-.*\.sql\.gz\.gpg$' | sort | head -n -30)
          for key in "${OLD[@]}"; do
            [ -n "$key" ] && aws s3 rm "s3://${R2_BUCKET}/${key}" --endpoint-url "$R2_ENDPOINT"
          done
          echo "retention: kept newest 30, pruned ${#OLD[@]}"

  # ── Make this loop LOUD ───────────────────────────────────────────────────
  # A watcher nobody reads is worse than no watcher: measured 2026-07-26, every
  # artifact here without a notifier died (MISSIONS.md 39d, STATUS-DAILY.md 5w,
  # TELEMETRY.jsonl 6w) and live-e2e failed 8 nights unseen. A finding must be an
  # OBJECT with a lifecycle: fail -> one deduped issue; pass -> auto-close.
  notify:
    name: Report failure as an issue
    needs: [backup]
    # Also fires on a manual dispatch, so the ALARM PATH itself can be
    # drilled. Previously this was schedule-only: the one way to force a
    # red on demand skipped the very step you would be drilling, so the
    # notify layer could not be exercised until a real incident — the
    # worst possible moment to discover it broken. Two loops in this repo
    # were dead on arrival and only a deliberate drill revealed it.
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: write # to wake the triage loop (gh workflow run triage.yml)
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Loop RED: nightly db-backup is failing"
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            {
              echo "\`db-backup.yml\` failed on its schedule."
              echo
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "- Commit: \`${{ github.sha }}\`"
            } > notify-body.md
            if [ -z "$num" ]; then
              # LABEL + HAND OFF. Until 2026-08-03 this line was the end of the road:
              # the issue was created with GITHUB_TOKEN, which raises NO `issues:
              # opened` event (GitHub blocks that recursion), carried no `harness`
              # label, and dispatched nothing — so no loop ever diagnosed it and no
              # email was sent. The alarm rang into an empty room. Proven live:
              # issue #190 (security RED) opened and auto-closed with zero
              # diagnosis; #185 sat unread for days. Seven loops shared this bug.
              new=$(gh issue create --title "$title" --body-file notify-body.md --label harness)
              n="${new##*/}"
              if gh workflow run triage.yml -f issue="$n"; then
                echo "raised #$n and woke triage" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::issue #$n raised but triage could not be woken - diagnose by hand"
              fi
            else
              gh issue comment "$num" --body-file notify-body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" \
              --comment "Green again in run ${{ github.run_id }}. (auto-close)"
          fi
