name: Post-merge watch (the eyes after the merge)

# ═══════════════════════════════════════════════════════════════════════════
# WHY THIS EXISTS
#
# `.github/merge-policy.yml` lets the `product` lane auto-merge with NO human
# in that loop, and justifies it in its own words:
#
#   "Speed comes from being able to UNDO, not from being sure. The product
#    lane is fast because `deploymentRollback` puts users back in seconds."
#
# That sentence is only true if something actually watches after the merge
# and actually pulls the undo. Before this file, nothing did — the cage
# could merge to `product` and then nobody was looking. `scripts/rollback_gear.py`
# is the undo; this workflow is the eyes and the hand that pulls it.
#
# EVERY NUMBER BELOW IS READ FROM `.github/merge-policy.yml` AT RUN TIME, NOT
# HARDCODED HERE. The `policy` job parses it once and every other job reads
# its outputs — the same discipline `ratchets` already uses ("measured by the
# same script CI runs, never re-implemented here"). A number typed twice is a
# number that will one day disagree with itself.
#
# THE HONESTY RULE (used throughout this repo, see uptime.yml / external-health.yml):
# every run writes what it watched, what it could NOT watch, and the verdict
# to $GITHUB_STEP_SUMMARY. Sentry is the sharpest example: if SENTRY_AUTH_TOKEN
# is missing, this workflow does NOT quietly skip that dimension and report
# green — it says so loudly, because a watcher that goes silently blind is
# how a 7-day production outage (the PYTHON-FASTAPI-8 incident referenced in
# external-health.yml) sits unnoticed for a week.
#
# THE DRILL ENTRANCE: `workflow_dispatch` with `dry_run` (default true) lets
# anyone fire this by hand and watch the whole wait -> watch -> Sentry ->
# decide chain run for real against live prod (all read-only), while the
# ACTING half — the real `deploymentRollback` mutation, a real GitHub issue,
# a real Slack ping — stays a rehearsal. `push` to `main` always runs LIVE:
# that is the actual post-merge trigger this workflow exists for.
#
# VERIFIED DEPLOYS (2026-10-20, FC-009; first designed in PR #728). This watch
# rolled prod back 5 times on noise (#722 #724 #725 #910 #911) and always began
# on the OLD container: its readyz 200 answered at 0 s. Now:
#   Step 1  waits until https://job360.uk/api/version serves THIS commit
#           (scripts/deploy_settle.py). Never served = RED "deploy never went
#           live", and NO rollback: the previous deployment is still serving.
#   Step 2  also probes job360.uk itself (DNS + TLS + the /api proxy). A domain
#           failure is an alarm, never a rollback; a rollback cannot fix DNS.
#   Step 3  counts only Sentry issues first seen after the swap that clear the
#           noise rule, and rolls back the service each came from
#           (scripts/sentry_poll.py WATCH_PRESET; frontend errors no longer roll
#           the backend back, which #911 did).
# Every rule is drilled offline (scripts/drill_registry.py). A dispatch with
# `expect_sha` set to a commit that is NOT an ancestor of live main (e.g. the
# head of an unmerged branch) must end red: that is the drill of the live
# wiring. An OLDER main commit reads as superseded and ends green by design.
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Rehearse the full watch -> decide -> rollback -> issue -> Slack chain
          without calling Railway's rollback mutation or raising a real alarm.
        type: boolean
        default: true
      expect_sha:
        description: >-
          Commit the watch expects to see live (default: the commit dispatched
          on). To drill the red path use a sha that is NOT an ancestor of live
          main (an unmerged branch head); an older main commit reads as
          superseded and stays green.
        type: string
        default: ""

concurrency:
  group: post-merge-watch-${{ github.ref }}
  cancel-in-progress: false

# Least privilege (CodeQL actions/missing-workflow-permissions): this workflow
# only reads the repo, polls public URLs, calls Railway/Sentry with secrets it
# never prints, and — only on a real trip — opens/comments an issue and wakes
# triage.yml.
permissions:
  contents: read
  issues: write
  actions: write # to wake triage.yml on a real trip, same handoff every loop here uses
  pull-requests: read # the "merged and live (PR #N)" line looks up the PR behind the merge commit

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # THE DIAL. Everything downstream reads its outputs; nothing downstream
  # re-parses the policy file or repeats a number from it.
  # ───────────────────────────────────────────────────────────────────────
  policy:
    name: Read the dial (merge-policy.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      readyz_url: ${{ steps.parse.outputs.readyz_url }}
      frontend_url: ${{ steps.parse.outputs.frontend_url }}
      poll_seconds: ${{ steps.parse.outputs.poll_seconds }}
      watch_minutes: ${{ steps.parse.outputs.watch_minutes }}
      readyz_non_200: ${{ steps.parse.outputs.readyz_non_200 }}
      frontend_non_200: ${{ steps.parse.outputs.frontend_non_200 }}
      sentry_new_issues: ${{ steps.parse.outputs.sentry_new_issues }}
      sentry_error_rate_multiple: ${{ steps.parse.outputs.sentry_error_rate_multiple }}
      services: ${{ steps.parse.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Parse .github/merge-policy.yml — the ONLY place these numbers are read
        id: parse
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml

          with open(".github/merge-policy.yml", encoding="utf-8") as f:
              policy = yaml.safe_load(f)

          watch = policy["watch"]
          trip = watch["trip_when"]
          product = policy["lanes"]["product"]
          rollback = policy["rollback"]

          print(f"readyz_url={watch['readyz_url']}")
          print(f"frontend_url={watch['frontend_url']}")
          print(f"poll_seconds={watch['poll_seconds']}")
          print(f"watch_minutes={product['watch_minutes']}")
          print(f"readyz_non_200={trip['readyz_non_200']}")
          print(f"frontend_non_200={trip['frontend_non_200']}")
          print(f"sentry_new_issues={trip['sentry_new_issues']}")
          print(f"sentry_error_rate_multiple={trip['sentry_error_rate_multiple']}")
          print(f"services={','.join(rollback['services'])}")
          PY

      - name: Show what was read (eyeball it — never trust a parse blind)
        run: |
          {
            echo "### Thresholds read from \`.github/merge-policy.yml\` — nothing below is hardcoded"
            echo
            echo "| key | value |"
            echo "|---|---|"
            echo "| readyz_url | ${{ steps.parse.outputs.readyz_url }} |"
            echo "| frontend_url | ${{ steps.parse.outputs.frontend_url }} |"
            echo "| poll_seconds | ${{ steps.parse.outputs.poll_seconds }} |"
            echo "| watch_minutes (product lane) | ${{ steps.parse.outputs.watch_minutes }} |"
            echo "| readyz_non_200 trip | ${{ steps.parse.outputs.readyz_non_200 }} |"
            echo "| frontend_non_200 trip | ${{ steps.parse.outputs.frontend_non_200 }} |"
            echo "| sentry_new_issues trip | ${{ steps.parse.outputs.sentry_new_issues }} |"
            echo "| sentry_error_rate_multiple trip | ${{ steps.parse.outputs.sentry_error_rate_multiple }} |"
            echo "| rollback.services (fallback target) | ${{ steps.parse.outputs.services }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────
  # THE EYES, AND — ONLY ON A REAL TRIP — THE HAND.
  # ───────────────────────────────────────────────────────────────────────
  watch:
    name: Watch prod after the merge
    needs: policy
    runs-on: ubuntu-latest
    # 50, was 40: up to 12 min for the sha to serve, then the 15 min watch.
    timeout-minutes: 50
    env:
      # The domain users hit. Not in merge-policy.yml: that file is owner-lane,
      # and its Railway URLs stay the rollback signal.
      DOMAIN_URL: https://job360.uk
      EXPECT_SHA: ${{ inputs.expect_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # deploy_settle asks git whether a live sha is newer than ours
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Decide LIVE vs rehearsal
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # This IS the post-merge trigger. There is no rehearsal on main.
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

      # ── STEP 1 — wait until production SERVES this commit ─────────────────
      # Was: poll readyz until 200, which the OLD container answers at 0 s, so
      # the watch sampled old code and a failed build still said "merged and
      # live". /api/version serves Railway's RAILWAY_GIT_COMMIT_SHA; job360.uk
      # first, then the backend's own URL so a frontend outage alone cannot read
      # as "the backend never deployed". Railway is only asked to EXPLAIN a
      # timeout (FAILED / BUILDING / SKIPPED). `since` feeds Step 3.
      - name: "Step 1 — wait until /api/version serves this commit (timeout 12 min)"
        id: wait
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          READYZ_URL: ${{ needs.policy.outputs.readyz_url }}
          DEPLOY_WAIT_MINUTES: "12"
          DEPLOY_POLL_SECONDS: "15"
        run: |
          set +e
          if [ -n "$RAILWAY_TOKEN" ]; then npm i -g @railway/cli --silent 2>&1 | tail -3; fi
          python scripts/deploy_settle.py --sha "$EXPECT_SHA" \
            --url "$DOMAIN_URL/api/version" --url "${READYZ_URL%/api/readyz}/api/version" > settle.out
          code=$?
          cat settle.out
          # One named line per output (chain_check reads them); a crash leaves
          # deploy_state empty, which `decide` treats as RED.
          val() { grep "^$1=" settle.out | head -1 | cut -d= -f2-; }
          {
            echo "deploy_state=$(val deploy_state)"
            echo "live_sha=$(val live_sha)"
            echo "live_at=$(val live_at)"
            echo "since=$(val since)"
            echo "live_url=$(val live_url)"
            echo "detail=$(val detail)"
            echo "exit=$code"
          } >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::error::$(val detail) (deploy_settle.py exit $code)"
          fi

      # ── STEP 2 — watch for watch_minutes, every poll_seconds ─────────────
      # A single non-200 can be a blip (a redeploy mid-request, a cold LB).
      # `readyz_non_200`/`frontend_non_200` — both from the policy file — are
      # CONSECUTIVE-failure counts for exactly that reason: one bad poll is
      # noise, N in a row is a trend.
      - name: "Step 2 — watch readyz + frontend + job360.uk for the policy's watch window"
        id: probe
        if: steps.wait.outputs.deploy_state == 'live'
        run: |
          set +e
          readyz="${{ needs.policy.outputs.readyz_url }}"
          frontend="${{ needs.policy.outputs.frontend_url }}"
          poll="${{ needs.policy.outputs.poll_seconds }}"
          watch_minutes="${{ needs.policy.outputs.watch_minutes }}"
          readyz_trip="${{ needs.policy.outputs.readyz_non_200 }}"
          frontend_trip="${{ needs.policy.outputs.frontend_non_200 }}"

          tripped="false"
          reason=""
          services=""
          # job360.uk: the same backend through the frontend's /api proxy, plus the
          # page. Code 000 = DNS/TLS/connect failure. Alarm only, never a rollback.
          domain_tripped="false"
          domain_reason=""

          readyz_fails=0
          frontend_fails=0
          domain_fails=0
          deadline=$((SECONDS + watch_minutes * 60))
          while [ "$tripped" = "false" ] && [ "$SECONDS" -lt "$deadline" ]; do
            rc=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$readyz")
            fc=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$frontend")
            da=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$DOMAIN_URL/api/readyz")
            dr=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$DOMAIN_URL/")
            echo "[$SECONDS s] readyz=$rc (fails=$readyz_fails) frontend=$fc (fails=$frontend_fails) domain api=$da root=$dr (fails=$domain_fails)"
            if [ "$rc" = "200" ]; then readyz_fails=0; else readyz_fails=$((readyz_fails + 1)); fi
            if [ "$fc" = "200" ]; then frontend_fails=0; else frontend_fails=$((frontend_fails + 1)); fi
            if [ "$da" = "200" ] && [ "$dr" = "200" ]; then domain_fails=0; else domain_fails=$((domain_fails + 1)); fi

            if [ "$readyz_fails" -ge "$readyz_trip" ]; then
              tripped="true"
              services="backend"
              reason="readyz: $readyz_fails consecutive non-200 (trip limit $readyz_trip)"
            elif [ "$frontend_fails" -ge "$frontend_trip" ]; then
              tripped="true"
              services="frontend"
              reason="frontend: $frontend_fails consecutive non-200 (trip limit $frontend_trip)"
            else
              if [ "$domain_tripped" = "false" ] && [ "$domain_fails" -ge "$frontend_trip" ]; then
                domain_tripped="true"
                domain_reason="job360.uk: $domain_fails consecutive failures (api/readyz=$da, /=$dr) while the Railway URLs answered"
              fi
              sleep "$poll"
            fi
          done

          echo "tripped=$tripped" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "domain_tripped=$domain_tripped" >> "$GITHUB_OUTPUT"
          echo "domain_reason=$domain_reason" >> "$GITHUB_OUTPUT"

      # ── STEP 3 — Sentry, honestly ─────────────────────────────────────────
      # Reuses scripts/sentry_poll.py rather than re-deriving the Sentry query
      # here — a detector re-implemented in a second place is how "4 vs 0" bugs
      # happen (see cage_blockers.py). Contract: 0 clean / 1 trip / 2 blind.
      # Was: ANY new issue in an org-wide 1 h window tripped, which is how the
      # old container's swap noise rolled prod back (FC-009). Now SENTRY_SINCE is
      # the last poll that still saw the old sha (Step 1), the preset applies the
      # noise rule, and each tripping issue names its service.
      - name: "Step 3 — Sentry: any NEW issue since this deploy went live?"
        id: sentry
        if: steps.wait.outputs.deploy_state == 'live'
        env:
          SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_WINDOW_HOURS: "1"
          SENTRY_PRESET: post-merge-watch
          SENTRY_SERVICES_OUT: sentry_services.txt
          LIVE_SINCE: ${{ steps.wait.outputs.since }}
          POLICY_SERVICES: ${{ needs.policy.outputs.services }}
        run: |
          set +e
          SENTRY_SINCE="${LIVE_SINCE:-$(git log -1 --format=%cI "$EXPECT_SHA")}"
          export SENTRY_SINCE
          echo "Sentry filter: since=$SENTRY_SINCE preset=$SENTRY_PRESET"
          if [ -z "$SENTRY_API_TOKEN" ]; then
            echo "watched=false" >> "$GITHUB_OUTPUT"
            echo "tripped=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SENTRY_API_TOKEN is not set. Sentry is an UNWATCHED dimension of this run — a new production error would NOT trip a rollback. Add the secret to close this gap."
            exit 0
          fi
          python scripts/sentry_poll.py > sentry.md
          code=$?
          cat sentry.md
          if [ "$code" -eq 1 ]; then
            services=$(cat sentry_services.txt 2>/dev/null)
            # "all" = an issue whose project could not be read: fail toward the alarm.
            case ",$services," in
              ,,|*,all,*) services="$POLICY_SERVICES" ;;
            esac
            echo "watched=true" >> "$GITHUB_OUTPUT"
            echo "tripped=true" >> "$GITHUB_OUTPUT"
            echo "services=$services" >> "$GITHUB_OUTPUT"
            echo "reason=new Sentry issue(s) first seen after this deploy went live that cleared the noise rule (table in the issue body)" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "watched=true" >> "$GITHUB_OUTPUT"
            echo "tripped=false" >> "$GITHUB_OUTPUT"
          else
            echo "watched=false" >> "$GITHUB_OUTPUT"
            echo "tripped=false" >> "$GITHUB_OUTPUT"
            echo "::warning::sentry_poll.py itself failed (exit $code) — Sentry is UNWATCHED for this run, not clear."
          fi

      # ── DECIDE ─────────────────────────────────────────────────────────
      # Two outputs on purpose: `tripped` = roll something back; `alarm` = the
      # run is red and a human hears. A deploy that never went live and a dead
      # domain are alarms WITHOUT a rollback: rolling back cannot fix either.
      - name: Decide the verdict
        id: decide
        env:
          DEPLOY_STATE: ${{ steps.wait.outputs.deploy_state }}
          DEPLOY_DETAIL: ${{ steps.wait.outputs.detail }}
          PROBE_TRIPPED: ${{ steps.probe.outputs.tripped }}
          PROBE_REASON: ${{ steps.probe.outputs.reason }}
          PROBE_SERVICES: ${{ steps.probe.outputs.services }}
          DOMAIN_TRIPPED: ${{ steps.probe.outputs.domain_tripped }}
          DOMAIN_REASON: ${{ steps.probe.outputs.domain_reason }}
          SENTRY_TRIPPED: ${{ steps.sentry.outputs.tripped }}
          SENTRY_REASON: ${{ steps.sentry.outputs.reason }}
          SENTRY_SERVICES: ${{ steps.sentry.outputs.services }}
          POLICY_SERVICES: ${{ needs.policy.outputs.services }}
        run: |
          tripped="false"
          alarm="false"
          reasons=()
          services=()

          case "$DEPLOY_STATE" in
            live) ;;
            superseded|skipped)
              echo "::notice::$DEPLOY_DETAIL — not this run's deploy to judge." ;;
            *)
              # never_live, or Step 1 died before writing a state: fail toward the alarm.
              alarm="true"
              reasons+=("${DEPLOY_DETAIL:-Step 1 never reported a deploy state} (no rollback: the previous deployment is still serving)") ;;
          esac

          if [ "$PROBE_TRIPPED" = "true" ]; then
            tripped="true"
            reasons+=("$PROBE_REASON")
            services+=($PROBE_SERVICES)
          fi
          if [ "$DOMAIN_TRIPPED" = "true" ]; then
            alarm="true"
            reasons+=("$DOMAIN_REASON (no rollback: a rollback cannot fix DNS/TLS)")
          fi
          if [ "$SENTRY_TRIPPED" = "true" ]; then
            tripped="true"
            reasons+=("$SENTRY_REASON")
            services+=(${SENTRY_SERVICES//,/ })
          fi

          if [ "$tripped" = "true" ]; then
            alarm="true"
            if [ "${#services[@]}" -eq 0 ]; then
              # Must never claim tripped while targeting nothing.
              services=(${POLICY_SERVICES//,/ })
            fi
          fi

          services_uniq=$(printf '%s\n' "${services[@]}" | sed '/^$/d' | sort -u | paste -sd, -)
          reason_joined=$(IFS='; '; echo "${reasons[*]}")

          echo "tripped=$tripped" >> "$GITHUB_OUTPUT"
          echo "alarm=$alarm" >> "$GITHUB_OUTPUT"
          echo "live=$([ "$DEPLOY_STATE" = "live" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "trip_reason=$reason_joined" >> "$GITHUB_OUTPUT"
          echo "services=$services_uniq" >> "$GITHUB_OUTPUT"

      # ── STEP 4 — pull the undo, only for the service(s) that are failing ──
      # `rollback_gear.py` re-confirms `canRollback` itself before it ever
      # calls the mutation — this step does not shortcut that. RAILWAY_TOKEN
      # missing is a REFUSAL (exit continues so the alarm below still fires),
      # never a silent no-op.
      - name: "Step 4 — roll back the tripped service(s)"
        id: rollback
        if: steps.decide.outputs.tripped == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          services: ${{ steps.decide.outputs.services }}
        run: |
          set +e
          echo "verdict: TRIPPED — rolling back: $services"

          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set — cannot attempt the rollback. This is a REFUSAL, not a skip."
            {
              echo "summary<<GEAR_EOF"
              echo "RAILWAY_TOKEN missing — no rollback was attempted for: $services"
              echo "GEAR_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0 # let the workflow continue on to raise the alarm below
          fi

          # ubuntu-latest ships Node.js; this needs no separate setup-node step.
          npm i -g @railway/cli --silent 2>&1 | tail -5

          flag=""
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            flag="--dry-run"
          fi

          overall_ok="true"
          lines=""
          IFS=',' read -ra svc_list <<< "$services"
          for svc in "${svc_list[@]}"; do
            [ -z "$svc" ] && continue
            echo "::group::rollback_gear.py --rollback --service $svc $flag"
            out=$(python scripts/rollback_gear.py --rollback --service "$svc" $flag 2>&1)
            rc=$?
            echo "$out"
            echo "::endgroup::"
            lines="$lines- \`$svc\`: exit $rc — $(echo "$out" | tail -1)"$'\n'
            [ "$rc" -eq 0 ] || overall_ok="false"
          done

          echo "ok=$overall_ok" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<GEAR_EOF"
            printf '%s' "$lines"
            echo "GEAR_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── ONE deduped issue, titled with the reverted commit ────────────────
      # Every value reaches bash through env, never `${{ }}` inside the script:
      # until 2026-10-20 the gear summary's backticks ran as command
      # substitution here, so issues #910/#911 read "- : exit 0" with the
      # service name gone. The Sentry table that tripped is now in the body.
      - name: "Step 5 — open (or reuse) ONE issue for this trip"
        if: always() && steps.decide.outputs.alarm == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          TRIPPED: ${{ steps.decide.outputs.tripped }}
          TRIP_REASON: ${{ steps.decide.outputs.trip_reason }}
          SERVICES: ${{ steps.decide.outputs.services }}
          GEAR_SUMMARY: ${{ steps.rollback.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          short="${EXPECT_SHA:0:12}"
          if [ "$DRY_RUN" = "true" ]; then
            title="DRILL: post-merge watch rehearsal on $short — not a real rollback"
          elif [ "$TRIPPED" = "true" ]; then
            title="PROD ROLLBACK: $short reverted after post-merge watch tripped"
          else
            title="PROD DEPLOY RED: $short — post-merge watch alarm, nothing rolled back"
          fi

          # Dedup by exact title, same pattern every loop in this repo uses —
          # a retry or a re-run of this workflow for the same commit must not
          # spam a second issue.
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)

          {
            printf '`post-merge-watch.yml` raised an alarm on commit `%s`.\n\n' "$EXPECT_SHA"
            printf '**Why:** %s\n\n' "$TRIP_REASON"
            if [ "$TRIPPED" = "true" ]; then
              printf '**Services rolled back:** %s\n\n%s\n' "$SERVICES" "$GEAR_SUMMARY"
            else
              printf '**Nothing was rolled back** (a deploy that never served, or a domain failure, is not fixed by a rollback).\n'
            fi
            if [ -s sentry.md ]; then printf '\n<details><summary>Sentry poll</summary>\n\n'; cat sentry.md; printf '\n</details>\n'; fi
            printf '\n- Run: %s\n' "$RUN_URL"
          } > body.md

          if [ -z "$num" ]; then
            new=$(gh issue create --title "$title" --body-file body.md --label harness)
            n="${new##*/}"
            if [ "$DRY_RUN" != "true" ]; then
              # Same handoff every loop here uses (uptime.yml, synthetic-live.yml,
              # external-health.yml): an issue opened with GITHUB_TOKEN raises no
              # `issues: opened` event, so nothing diagnoses it unless woken by hand.
              gh workflow run triage.yml -f issue="$n" \
                || echo "::warning::issue #$n raised but triage could not be woken — diagnose by hand"
            fi
            echo "raised #$n" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue comment "$num" --body-file body.md
            echo "issue #$num already open for this trip — commented instead of duplicating" >> "$GITHUB_STEP_SUMMARY"
          fi

      # THE SAME VOICE AS EVERY OTHER WATCHER. Until 2026-09-11 this step
      # posted to an incoming webhook (SLACK_WEBHOOK_URL) and swallowed every
      # failure with a ::warning:: — the exact RESEND_API_KEY shape: a secret
      # that may never have been set, and a step that goes green either way.
      # A production rollback is the one message that must not be lost, so it
      # now uses the bot-token action that slack-drill.yml proved live on
      # 2026-09-11, which fails LOUD when it cannot speak.
      - name: "Step 6 — Slack: production was rolled back, or the deploy is red"
        if: always() && steps.decide.outputs.alarm == 'true'
        uses: ./.github/actions/slack
        with:
          channel: production-incidents
          severity: critical
          title: "${{ steps.mode.outputs.dry_run == 'true' && '[DRILL] ' || '' }}post-merge watch tripped on ${{ env.EXPECT_SHA }} — ${{ steps.decide.outputs.tripped == 'true' && 'rolled back' || 'nothing rolled back' }}"
          body: |
            ${{ steps.decide.outputs.trip_reason }} (services: ${{ steps.decide.outputs.services }})

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # FALLBACK LAST MILE (scripts/check_alert_paths.py rule B). Step 6 keys
      # off outputs that `mode` and `decide` only write if they REACH that
      # line. If either dies half way — an unbound variable, a gh 403 — the
      # trip is never announced and a rolled-back (or NOT rolled-back)
      # production goes unmentioned. If the alarm path itself broke, say THAT.
      - name: "Slack — the post-merge watch's alarm path itself broke"
        if: always() && (steps.mode.outcome == 'failure' || steps.decide.outcome == 'failure')
        uses: ./.github/actions/slack
        with:
          channel: needs-your-decision
          severity: warn
          title: "post-merge watch on ${{ github.sha }} could not reach a verdict"
          body: |
            The watch ran after a merge to main but the step that decides LIVE vs rehearsal, or the
            step that decides whether to roll back, failed before writing its verdict. Production may
            or may not be fine — nobody checked. Open the run and look.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # ── THE HONESTY RULE — always, win or lose ────────────────────────────
      - name: "HONESTY — what this run watched, what it could NOT, and the verdict"
        if: always()
        env:
          TRIP_REASON: ${{ steps.decide.outputs.trip_reason }}
        run: |
          {
            echo "## Post-merge watch — run summary"
            echo
            echo "Commit: \`$EXPECT_SHA\`"
            echo "Mode: **${{ steps.mode.outputs.dry_run == 'true' && 'DRY RUN — rehearsal only, no real rollback, no real alarm' || 'LIVE' }}**"
            echo
            echo "### Watched"
            echo "- deploy identity — \`${{ steps.wait.outputs.deploy_state || 'not reached' }}\` (live = /api/version served $EXPECT_SHA at ${{ steps.wait.outputs.live_at || '-' }} via ${{ steps.wait.outputs.live_url || '-' }}; superseded/skipped = not this run's deploy; anything else = RED, deploy never went live)"
            echo "- \`readyz\` (${{ needs.policy.outputs.readyz_url }}) — every ${{ needs.policy.outputs.poll_seconds }}s for ${{ needs.policy.outputs.watch_minutes }} min; trips at ${{ needs.policy.outputs.readyz_non_200 }} consecutive non-200"
            echo "- \`frontend\` (${{ needs.policy.outputs.frontend_url }}) — same cadence; trips at ${{ needs.policy.outputs.frontend_non_200 }} consecutive non-200"
            echo "- \`$DOMAIN_URL\` (/api/readyz and /) — same cadence; ${{ needs.policy.outputs.frontend_non_200 }} consecutive failures = alarm, never a rollback"
            if [ "${{ steps.sentry.outputs.watched }}" = "true" ]; then
              echo "- Sentry — new issues first seen after the deploy went live that cleared the noise rule (scripts/sentry_poll.py WATCH_PRESET; ignored issues are listed in Step 3, not hidden)"
            fi
            echo
            echo "### NOT watched — say it loud, never a silent skip"
            if [ "${{ steps.sentry.outputs.watched }}" != "true" ]; then
              echo "- **Sentry is UNWATCHED this run.** SENTRY_API_TOKEN is missing, the poller failed, or the deploy never went live. A new production error right now would NOT trip a rollback."
            fi
            echo "- **\`sentry_error_rate_multiple\` (${{ needs.policy.outputs.sentry_error_rate_multiple }}x)** is read from the policy but this workflow does not yet compute a live hourly error-rate baseline to compare against — only the new-unresolved-issue signal is wired to a trip. Treat this threshold as DECLARED in the policy, not YET ENFORCED here."
            echo
            echo "### Verdict"
            if [ "${{ steps.decide.outputs.tripped }}" = "true" ]; then
              echo "**TRIPPED** — $TRIP_REASON"
              echo
              echo "Rollback attempted for: \`${{ steps.decide.outputs.services }}\`"
            elif [ "${{ steps.decide.outputs.alarm }}" = "true" ]; then
              echo "**RED, nothing rolled back** — $TRIP_REASON"
            else
              echo "**Clean** — nothing watched crossed its trip threshold."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── MERGED -> TOLD ────────────────────────────────────────────────────
      # The owner asked to hear when something actually shipped. The honest
      # moment for that is not the merge (main auto-deploys, so a merge is a
      # promise) and not the deploy (Railway can roll out a broken image) — it
      # is HERE, after the watch window closed with nothing tripped. So the
      # message says "merged and live", and it can only be written by a run that
      # watched and saw nothing wrong.
      #
      # Two non-blank lines on purpose: `check_alert_paths.py` rule B demands a
      # fallback alert for any SUBSTANTIAL step an alert step quotes, and
      # "substantial" is a `uses:` step or a `run:` longer than three lines. A
      # one-line subject read is neither, so it needs no second alarm of its own
      # — and if it somehow failed, the Slack step below simply says the subject
      # is blank rather than going silent. `always()` is rule A: nothing after
      # the job's first alert step may key off the job's own status.
      - name: The subject line of the commit that just merged
        id: subject
        if: always()
        run: |
          subject=$(git log -1 --pretty=%s)
          echo "text=$subject" >> "$GITHUB_OUTPUT"

      # The PR this commit came from, so "merged and live" carries a link the
      # owner can open. Derived from the merge commit (GitHub knows which PR
      # introduced a sha); a lookup that fails or finds nothing falls back to the
      # commit URL rather than going silent. Three non-blank lines on purpose,
      # for the same rule-B reason as the step above.
      - name: The pull request that introduced that commit
        id: prlink
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "link=$GITHUB_SERVER_URL/$GH_REPO/$([ -n "$pr" ] && echo "pull/$pr" || echo "commit/$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      # Only on a LIVE run (a rehearsal announcing a merge would be a lie), only
      # when `decide` really reached a verdict, and only when that verdict was
      # clean. A trip has its own critical message to production-incidents above;
      # this one is the quiet "it landed and it is fine" line, which belongs in
      # log-github-ci and nowhere louder.
      - name: "Slack — merged, watched, and still standing"
        if: always() && steps.decide.outcome == 'success' && steps.decide.outputs.alarm != 'true' && steps.decide.outputs.live == 'true' && steps.mode.outputs.dry_run != 'true'
        uses: ./.github/actions/slack
        with:
          channel: log-github-ci
          severity: info
          title: "merged and live${{ steps.prlink.outputs.number && format(' (PR #{0})', steps.prlink.outputs.number) || '' }}: ${{ steps.subject.outputs.text }}"
          body: |
            What happened: commit `${{ github.sha }}` is on main, deployed, and nothing broke during the post-merge watch.
            What to do: nothing, this is for your information only.
            Link: ${{ steps.prlink.outputs.link }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # Show red in the Actions tab too, not just inside the summary text —
      # a green checkmark next to a rolled-back prod is exactly the kind of
      # thing that gets missed. Placed LAST so it never blocks the alarm
      # steps above (all of which are `if: always()` or unconditional).
      # `always()` is load-bearing (scripts/check_alert_paths.py rule A): the
      # Slack step above fails LOUD when it cannot speak, and without this the
      # implicit `success()` here would let a Slack outage decide whether the
      # run reports the trip. The verdict is `decide`'s, never the messenger's.
      - name: Fail the run if the watch tripped
        if: always() && steps.decide.outputs.alarm == 'true'
        run: |
          echo "::error::post-merge-watch TRIPPED — ${{ steps.decide.outputs.trip_reason }}"
          exit 1
