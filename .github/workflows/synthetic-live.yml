# Loop 2 — LIVE production synthetic smoke (Playwright walks the real deployed app).
#
# Unlike uptime.yml (a 200/OK ping) this drives a real browser corner-by-corner like a
# human and, on any failure, screenshots it + logs the REASON into the server log system
# (POST /api/client-log). Fails red → GitHub emails the owner (scheduled-workflow default).
#
# Public corners always run. Authed corners run only after the robot LOGS ITSELF IN as a
# dedicated synthetic account and the backend confirms whose account that is.
#
# ── The chore this removed ──────────────────────────────────────────────────────────
# This used to run on SMOKE_SESSION: a `job360_session` cookie the owner pasted into a
# repo secret by hand. Sessions expire after exactly 30 days with no renewal
# (backend/src/services/auth/sessions.py:25), so that secret died on a clock and took the
# check with it — 2026-08-09 → 2026-08-11, nine authed corners reported OK while the
# browser sat on the login page. A recurring manual chore attached to a safety check is a
# countdown on that check, and the owner is one person; he will eventually miss it.
#
# Now: SMOKE_EMAIL (repo VARIABLE) + SMOKE_PASSWORD (repo SECRET), set ONCE. The run logs
# in through POST /api/auth/login every time. Nothing expires on a clock.
# SMOKE_SESSION still works as a fallback, but the run now WARNS before it dies.
#
# ── Why the email is a variable and not a secret ────────────────────────────────────
# GitHub masks secret values in logs. If the address were a secret, the refusal message
# "refused to run as <address>" would print as "refused to run as ***" — the one fact you
# need in order to fix it. It is an address, not a credential; the password is the secret.
#
# ── The safety rule (frontend/tests/synthetic/session-gate.mjs) ─────────────────────
# The walk refuses to proceed unless the BACKEND says the session belongs to a synthetic
# address. Not the string we were handed — the server's own answer, so it holds for the
# pasted-cookie path too.
#
# ── The drill ───────────────────────────────────────────────────────────────────────
# Run this workflow by hand with `drill: dead-session` or `drill: wrong-account` to prove
# the check still goes RED. A synthetic monitor that cannot fail is the original bug.
#
# ── OWNER: one-time setup, then never again ─────────────────────────────────────────
# 1. Create the robot account on prod. NO MAILBOX IS NEEDED — `POST /api/auth/register`
#    takes an email + password and the account can sign in immediately
#    (backend/tests/test_auth_routes.py::test_register_creates_user_but_does_not_auto_login).
#    The nine corners this walks (dashboard/profile/jobs/pipeline/channels/settings/
#    notifications) are gated on `require_user`, NOT `require_verified_user` — only
#    `search.py:177` and `tailor.py` need a verified email, and neither is walked. So an
#    unverified robot account is enough.
#      curl -X POST https://<backend>/api/auth/register \
#        -H 'Content-Type: application/json' \
#        -d '{"email":"synthetic@job360.uk","password":"<a long random password>"}'
# 2. Repo VARIABLE  SMOKE_EMAIL    = that address (must satisfy the synthetic rule).
#    Repo SECRET    SMOKE_PASSWORD = that password.
# 3. DELETE the SMOKE_SESSION secret. It exists only as a fallback and it is the chore.
# 4. Run this workflow by hand once with `drill: dead-session` and confirm it goes RED.
#    A guard nobody has ever seen fire is a guess.
# 5. ONLY AFTER 1-4 ARE DONE AND THIS HAS GONE GREEN ONCE: set repo VARIABLE
#    AUTO_REVERT_ON_SMOKE = on. That arms the auto-revert below (harness
#    simplification slice 6, owner decision 2026-09-08): on the green->red
#    EDGE of a scheduled walk, production is rolled back on Railway (both
#    services, previous deployment's image + variables, no rebuild) and the
#    reverse gear is asked to open the revert PR that puts `main` back in
#    agreement. It fires on the transition only — this check has been red for
#    a month on missing credentials, and a naive "revert when red" would have
#    reverted every merge since. With the variable unset it REHEARSES: it logs
#    what it would have rolled back and touches nothing.
# Magic-link is NOT usable here: an account created that way gets a random unguessable
# password (services/auth/magic_link.py:180-186), so it can never log in with one.
name: synthetic-live
on:
  schedule:
    - cron: "0 */6 * * *" # every 6h; tune to taste (authed run makes a real LLM call)
  workflow_dispatch:
    inputs:
      drill:
        description: "Fire a DRILL instead of a real walk — proves this check can go RED."
        type: choice
        required: false
        default: "none"
        options:
          - "none"
          - "dead-session" # a syntactically valid but dead cookie -> must fail
          - "wrong-account" # a NON-synthetic address -> must refuse before sending anything

# Least-privilege token (CodeQL actions/missing-workflow-permissions):
# these jobs only check out code and run tests/uploads — no repo writes.
permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install deps + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Walk live production
        if: inputs.drill == '' || inputs.drill == 'none'
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
          # Log in at run time — nothing here expires on a clock.
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          # Legacy pasted-cookie fallback. Kept so this change can never make the
          # check worse than it was; the run warns when it is nearing its 30 days.
          SMOKE_SESSION: ${{ secrets.SMOKE_SESSION }}
          # Only the SCHEDULE demands an authed walk. Deleting the credentials would
          # otherwise turn nine corners off silently and the run would stay green —
          # which is exactly how the last three checks died. A hand-run
          # (workflow_dispatch) may legitimately walk the public corners only.
          SMOKE_REQUIRE_AUTHED: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: node tests/synthetic/live-smoke.mjs

      # ── THE DRILL ─────────────────────────────────────────────────────────────
      # Fire the failure on purpose and assert the script EXITS NON-ZERO. Two loops
      # in this repo were dead on arrival and only firing them deliberately revealed
      # it, so every guard gets an entrance you can walk through.
      #
      # Neither drill needs a real credential: `dead-session` uses a made-up cookie
      # (the signature cannot verify, so it is refused), and `wrong-account` is
      # refused BEFORE any network call because the address is not synthetic — the
      # dummy password is never transmitted.
      - name: DRILL — prove this check can still go RED
        if: inputs.drill != '' && inputs.drill != 'none'
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
          SMOKE_EMAIL: ${{ inputs.drill == 'wrong-account' && 'a-real-human@example.com' || '' }}
          SMOKE_PASSWORD: ${{ inputs.drill == 'wrong-account' && 'not-a-real-password' || '' }}
          SMOKE_SESSION: ${{ inputs.drill == 'dead-session' && 'deadbeef0123456789abcdef.an2pww.this-signature-is-not-valid' || '' }}
        run: |
          echo "DRILL: ${{ inputs.drill }} — the script MUST exit non-zero."
          # GitHub runs `run:` blocks under `bash -e`, so a non-zero node exit would
          # abort the step before we could check it. `set +e` is load-bearing here:
          # a FAILING script is the PASSING outcome of a drill.
          set +e
          node tests/synthetic/live-smoke.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::DRILL FAILED — live-smoke.mjs exited 0 on a deliberately broken session (${{ inputs.drill }}). The session gate is NOT working: a monitor that cannot go red reports OK about nothing."
            exit 1
          fi
          echo "DRILL PASSED — the gate refused and the script exited $code." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report + failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-smoke-report
          path: frontend/smoke-artifacts/
          if-no-files-found: ignore

  # ── Make this loop LOUD ───────────────────────────────────────────────────
  # A watcher nobody reads is worse than no watcher: measured 2026-07-26, every
  # artifact here without a notifier died (MISSIONS.md 39d, STATUS-DAILY.md 5w,
  # TELEMETRY.jsonl 6w) and live-e2e failed 8 nights unseen. A finding must be an
  # OBJECT with a lifecycle: fail -> one deduped issue; pass -> auto-close.
  notify:
    name: Report failure as an issue
    needs: [live-smoke]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # was 5; the auto-revert installs the Railway CLI and asks it twice
    permissions:
      contents: read # needed to check out the repo so ./.github/actions/slack resolves
      issues: write
      actions: write # to wake the triage loop (gh workflow run triage.yml)
    steps:
      # A local composite action is just files in the repo — without a checkout
      # `uses: ./.github/actions/slack` cannot resolve and the step errors.
      - uses: actions/checkout@v7

      - name: Open, update or close the tracking issue
        id: raise
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Loop RED: synthetic-live (real site) is failing"
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            {
              echo "\`synthetic-live.yml\` failed on its schedule."
              echo
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "- Commit: \`${{ github.sha }}\`"
            } > notify-body.md
            if [ -z "$num" ]; then
              new=$(gh issue create --title "$title" --body-file notify-body.md)
              n="${new##*/}"
              echo "issue=$n" >> "$GITHUB_OUTPUT"
              # THE VOLUME RULE, in the one place it can be enforced cheaply.
              # This check ran 15 times in the measurement window and failed all
              # 15 (gh run list, 2026-08-13..17). Announcing every failure would
              # be 29.0 Slack messages a week saying the identical thing. So
              # `announce` is written ONLY on the green->red edge; the `else`
              # branch below stays silent in Slack on purpose.
              echo "announce=broken" >> "$GITHUB_OUTPUT"
              # HAND IT TO TRIAGE EXPLICITLY. Until 2026-08-03 this loop opened
              # the issue and stopped — and because an issue created with
              # GITHUB_TOKEN raises no `issues` run (GitHub blocks that
              # recursion, documented in this repo), nothing ever diagnosed it.
              # The alarm rang into an empty room. Note the title deliberately
              # does NOT carry a trusted-origin prefix: this body quotes live
              # page text, so a human still clicks agent:fix.
              if gh workflow run triage.yml -f issue="$n"; then
                echo "raised #$n and woke triage" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::issue #$n raised but triage could not be woken - diagnose by hand"
              fi
            else
              gh issue comment "$num" --body-file notify-body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" \
              --comment "Green again in run ${{ github.run_id }}. (auto-close)"
            echo "issue=$num" >> "$GITHUB_OUTPUT"
            echo "announce=recovered" >> "$GITHUB_OUTPUT"
          fi

      # ── SLACK ────────────────────────────────────────────────────────────
      # production-incidents is the strictest channel in the routing table
      # (.github/actions/slack/action.yml). This earns it: the walk logs into
      # the real site as a real user, so a failure means a person hitting
      # job360.uk right now is having the broken experience.
      - name: Slack — the live site is broken for a real user
        if: steps.raise.outputs.announce == 'broken'
        uses: ./.github/actions/slack
        with:
          channel: production-incidents
          severity: critical
          title: "job360: the synthetic user walk is FAILING on the live site"
          body: |
            A scripted real user could not complete the walk against production.
            This is the live site, not CI.

            Issue: ${{ github.server_url }}/${{ github.repository }}/issues/${{ steps.raise.outputs.issue }}
            Run:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # FALLBACK LAST MILE. Every gate above reads an output that the `raise`
      # step only writes if it REACHES that line. A gh 403 or a rate limit kills
      # the step, no output exists, every branch skips, and the outage goes
      # unannounced — the "alarm rang into an empty room" bug this repo has hit
      # four times. So if the messenger broke, say THAT.
      - name: Slack — the alarm path itself broke
        if: always() && steps.raise.outcome == 'failure'
        uses: ./.github/actions/slack
        with:
          channel: needs-your-decision
          severity: warn
          title: "synthetic-live: the ALARM step failed — a breakage may be unreported"
          body: |
            The notify job could not open/close its tracking issue, so the normal
            alert did not run. This message means the MESSENGER broke, not that
            the site is fine. Check the run by hand.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # `always()` is load-bearing, not decoration: without it GitHub wraps this
      # gate in an implicit `success()`, so the incident alert above failing
      # (rate-limit, rotated token) would silently skip this one too — one broken
      # alert taking a second, unrelated alert down with it. That exact hazard is
      # what scripts/check_alert_paths.py exists to catch.
      - name: Slack — recovered
        if: always() && steps.raise.outputs.announce == 'recovered'
        uses: ./.github/actions/slack
        with:
          channel: log-github-ci
          severity: info
          title: "synthetic-live: back to green"
          body: |
            The synthetic user walk passes again and issue #${{ steps.raise.outputs.issue }} was auto-closed.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # ── THE AUTO-REVERT (slice 6) — ON THE GREEN->RED EDGE, AND ONLY THEN ──
      # Placed AFTER every alert above on purpose (scripts/check_alert_paths.py
      # rule A): nothing this step does may decide whether the "site is broken"
      # alarm fires. `announce == 'broken'` is written by `raise` ONLY when the
      # tracking issue did not exist a moment ago — i.e. the walk was green last
      # time and is red now. A red->red repeat writes nothing, so a check that
      # has been red for a month (this one, on missing SMOKE credentials)
      # cannot trigger a revert on every merge. The gear itself re-confirms
      # `canRollback` on Railway before it touches the mutation.
      - name: Auto-revert — roll production back on the green->red edge
        id: gear
        if: always() && steps.raise.outputs.announce == 'broken'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ARMED: ${{ vars.AUTO_REVERT_ON_SMOKE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ "$ARMED" != "on" ]; then
            echo "AUTO_REVERT_ON_SMOKE is not 'on' — REHEARSAL: would have rolled back backend,frontend on Railway and opened the revert PR. Nothing touched." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "rolled=rehearsed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set — the auto-revert is ARMED but cannot act. This is a REFUSAL, not a skip."
            echo "rolled=refused" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm i -g @railway/cli --silent 2>&1 | tail -3
          overall="true"
          lines=""
          for svc in backend frontend; do
            echo "::group::rollback_gear.py --rollback --service $svc"
            out=$(python scripts/rollback_gear.py --rollback --service "$svc" 2>&1)
            rc=$?
            echo "$out"
            echo "::endgroup::"
            lines="$lines- \`$svc\`: exit $rc — $(echo "$out" | tail -1)"$'\n'
            [ "$rc" -eq 0 ] || overall="false"
          done
          {
            echo "### Auto-revert (green->red edge)"
            printf '%s' "$lines"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$overall" = "true" ]; then
            echo "rolled=true" >> "$GITHUB_OUTPUT"
            # Production is back on the previous image; now put `main` back in
            # agreement. The reverse gear BUILDS the revert PR and a human
            # merges it (revert-main.yml never pushes main). A dispatch that
            # fails must not hide the rollback that succeeded, hence `|| echo`.
            if gh workflow run revert-main.yml -f dry_run=false; then
              echo "revert_pr=dispatched" >> "$GITHUB_OUTPUT"
            else
              echo "revert_pr=failed" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "rolled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Slack — production was rolled back
        if: always() && steps.gear.outputs.rolled == 'true'
        uses: ./.github/actions/slack
        with:
          channel: production-incidents
          severity: critical
          title: "job360: rolled back both services after the live walk went red"
          body: |
            The green->red edge fired the auto-revert: backend and frontend are back on their previous
            Railway deployment (image + variables, no rebuild). Reverse-gear PR dispatch: ${{ steps.gear.outputs.revert_pr }}.
            `main` is now AHEAD of production until that revert PR is merged.

            Issue: ${{ github.server_url }}/${{ github.repository }}/issues/${{ steps.raise.outputs.issue }}
            Run:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # The worst cell: the site is broken AND the undo did not happen. Same
      # channel as the outage, because it IS the outage plus one fact.
      - name: Slack — the auto-revert could NOT roll back
        if: always() && (steps.gear.outputs.rolled == 'false' || steps.gear.outputs.rolled == 'refused')
        uses: ./.github/actions/slack
        with:
          channel: production-incidents
          severity: critical
          title: "job360: live walk went red and the auto-revert could not roll back"
          body: |
            rolled=${{ steps.gear.outputs.rolled }}. Use Railway's dashboard Rollback by hand — previous image + variables, seconds.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # FALLBACK LAST MILE (rule B): the two alerts above key off outputs the
      # gear step only writes if it REACHES that line.
      - name: Slack — the auto-revert step itself broke
        if: always() && steps.gear.outcome == 'failure'
        uses: ./.github/actions/slack
        with:
          channel: production-incidents
          severity: critical
          title: "job360: live walk went red and the auto-revert step crashed before deciding"
          body: |
            No rollback verdict was reached. Production may still be on the broken deploy — use Railway's dashboard Rollback.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
