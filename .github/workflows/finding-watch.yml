name: Finding watch (a finding wakes the fixer)

# THE MISSING DOORBELL.
# ---------------------
# Measured 2026-08-24, and this is the whole reason this file exists:
#
#   `pr-repair.yml`  on: workflow_dispatch          <- a human clicks it
#
# The fixer is real, caged, and good. NOTHING STARTED IT. The harness could
# see a problem and could fix a problem, and the only wire between those two
# facts was the owner noticing and pressing a button. (`repair.yml`, the
# issue-triggered sibling this file was written alongside, was removed
# 2026-09-05 as unwired harness scaffolding — triage.yml is diagnose-and-
# comment only now, so pr-repair.yml is the one fixer left.)
#
# THE SNEAKIER HALF. On PR #375 every CI check was SUCCESS, CodeRabbit's own
# status check was SUCCESS, and SIX OF SIX review threads were unresolved -- one
# of them a Major on data integrity. GitHub called that PR clean. `pr-shepherd`
# only acts on RED checks, so it filed #375 under "GREEN+IDLE -> a summary line
# only" and moved on. A status tick and a review thread are two different
# channels, and everything in this harness was reading the wrong one.
#
# CodeRabbit runs with `fail_commit_status: false` -- its tick is STRUCTURALLY
# INCAPABLE of saying no. `merge_cage.check_review` already knew this and reads
# GraphQL `reviewThreads` instead. This file reads the same channel, so the
# thing that WAKES the fixer and the thing that BLOCKS the merge agree about
# what a finding is. Two instruments disagreeing about that is how a queue rots
# while every dashboard is green.
#
# WHAT IT DOES: counts unresolved review threads and failed checks on a PR, and
# if any of them is something the fixer can act on (`scripts/repairable.py
# triage`), dispatches `pr-repair.yml` at it; if there are findings but none the
# fixer can touch, it says so once on the PR and labels it `autofix:needs-human`
# instead. That is all. It never
# merges, never pushes, never edits code -- it rings a bell that already had no
# rope.
#
# WHY THE TRIGGERS ARE SHAPED LIKE THIS
#   pull_request_review / _review_comment  a finding ARRIVING is the event that
#       matters. CodeRabbit is a GitHub App, not GITHUB_TOKEN, so its reviews DO
#       start workflows -- the recursion rule that kills our own bots' events
#       does not apply to it. (Checked before writing this: the rule is about
#       the automatic token, not about apps in general.)
#   check_suite: completed                 CI going red.
#   pull_request                           a new or updated PR: judge it once.
#   schedule                               THE SWEEP. Every event above can be
#       missed -- a webhook drops, a run is cancelled, a PR is opened while this
#       file is being edited. A queue whose only input is events silently
#       forgets things; the sweep is what makes it eventually consistent.
#   workflow_dispatch                      the drill entrance. Two loops in this
#       repo were dead on arrival on main and only firing them on purpose ever
#       revealed it.
#
# THE RUNAWAY IS THE REAL RISK, AND IT IS GUARDED THREE WAYS.
# pr-repair PUSHES to the PR branch. A push is a `synchronize` event. Naively
# wired, this file dispatches the fixer, the fixer pushes, the push wakes this
# file, forever -- an infinite loop that spends real money.
#   1. NEVER re-dispatch for a commit the fixer itself wrote (author check).
#   2. NEVER dispatch while ANY pr-repair run is already queued or running.
#      Deliberately not branch-scoped: a dispatched run records the ref it was
#      dispatched on, never the branch it repairs, so a branch-scoped query
#      answers 0 every time and the guard would never fire.
#   3. A HARD ATTEMPT CEILING recorded as a label on the PR. After
#      MAX_ATTEMPTS the loop stops, says so on the PR, and waits for a human.
#      A loop without a stop is not a loop, it is a leak. THE LABEL COUNTS REAL
#      ATTEMPTS, NOT DISPATCHES: `pr-repair.yml` writes `autofix:attempt-N` when
#      a run actually starts work; this file only READS it (see GUARD 3).
#   4. (2026-10-02) ONLY DISPATCH FOR WORK THE FIXER CAN DO. A finding is
#      "fixable" only when `scripts/repairable.py triage` says so: an unresolved,
#      NOT-outdated thread on a file the repair cage allows, or a `failure` /
#      `timed_out` check that code can fix. Everything else is for a human, and
#      is said once on the PR (`autofix:needs-human`) instead of being retried.
#
# HONESTY RULE (same as dependabot-auto and pr-shepherd): every PR this file
# looks at gets one line in the job summary -- acted on or left alone, with the
# reason. Silent skipping is how a queue rots invisibly.
#
# THE BOUND, STATED RATHER THAN GLOSSED. On a `pull_request` event GitHub runs
# the PR'S OWN copy of this file, so a PR can edit what this doorbell does and
# have that edit take effect on itself. That is deliberate and it is bounded on
# three sides, none of which this file supplies:
#   * it dispatches, it never writes code -- the worst it can do is ring a bell;
#   * `pr-repair.yml` runs from the DEFAULT branch and applies its own cage
#     (same-repo only, allowlisted author, no shell, path cage, independent
#     re-verification), so a rewritten doorbell cannot widen who gets repaired;
#   * this file is `harness_owner` in merge-policy.yml, so no machine can merge
#     a change to it in the first place.
# Written down because "the PR supplies its own judge" is rule G5's whole
# subject, and the honest answer here is "yes, and here is why it is survivable"
# rather than pretending the question does not arise.

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  schedule:
    - cron: "*/30 * * * *" # the sweep — events get missed, this does not
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to look at (blank = sweep every open PR)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write # the one comment that says the ceiling was hit
  actions: write # dispatch pr-repair.yml
  checks: read

concurrency:
  # Per PR, so several findings arriving at once queue behind each other instead
  # of racing.
  #
  # `cancel-in-progress: false`, AND THAT IS NOT A PREFERENCE.
  # It was `true`, which is the obvious choice for a cheap idempotent sweep —
  # and it made this workflow BLOCK ITS OWN MERGES. A cancelled run still posts
  # a check run to the PR, and `merge_cage.judge_check_runs` treats `cancelled`
  # as a MISSING ANSWER that blocks ("it never produced a verdict, so this is
  # not a failing test"), on purpose, because a job killed by a timeout must
  # never read as consent. So every superseded doorbell run left a permanent
  # red mark the cage would refuse on. Measured on PR #380: runs 32732201279,
  # 32733238144 and 32733238301 all cancelled, all reported as failing checks,
  # while the runs that actually ran were green.
  #
  # This sweep is cheap, idempotent and guarded three ways, so letting a
  # duplicate run to completion costs seconds. Cancelling it costs a mergeable
  # PR. `cancel-in-progress: true` belongs on workflows whose output nobody
  # gates on — this one's output is a check run, so it is gated on by
  # construction.
  # THE FALLBACK IS A FIXED STRING, NOT `github.run_id`.
  # `run_id` is unique per run, so every scheduled sweep and every blank manual
  # dispatch got its OWN group and none of them queued behind the others. Two
  # sweeps could then both read "no fixer is busy" before either dispatched, and
  # both dispatch — the runaway guard beaten by a race, not by a bug in the
  # guard. A stable key makes the sweeps a queue of one, which is what "one
  # fixer at a time" needs to be true. (CodeRabbit, PR #380.)
  group: finding-watch-${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number || inputs.pr || 'sweep' }}
  cancel-in-progress: false

env:
  MAX_ATTEMPTS: "3"

jobs:
  wake-the-fixer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The Slack action below is a LOCAL composite action, so the job needs the
      # repo on disk. It is checked out at the DEFAULT BRANCH, never the PR's
      # ref: this workflow also runs on `pull_request` events, and the action
      # holds SLACK_BOT_TOKEN, so it must be the trusted copy of the action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: Which PRs am I looking at
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          SUITE_PR: ${{ github.event.check_suite.pull_requests[0].number }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          # A single event names one PR. The sweep and a blank dispatch name all
          # of them. Both paths produce the same thing — a list — so there is
          # one code path below and not two that can drift apart.
          case "$EVENT" in
            schedule) prs=$(gh pr list --state open --limit 50 --json number --jq '.[].number') ;;
            workflow_dispatch)
              if [ -n "${INPUT_PR:-}" ]; then prs="$INPUT_PR"
              else prs=$(gh pr list --state open --limit 50 --json number --jq '.[].number'); fi ;;
            check_suite) prs="${SUITE_PR:-}" ;;
            *) prs="${EVENT_PR:-}" ;;
          esac
          prs=$(echo "$prs" | tr ' ' '\n' | grep -E '^[0-9]+$' || true)
          if [ -z "$prs" ]; then
            echo "no PR in scope for a \`$EVENT\` event — nothing to do" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "prs<<EOF"
            echo "$prs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # THE DEFAULT BRANCH'S COPY OF THE CAGE, NEVER THE PR'S. On a `pull_request`
      # event a bare checkout would be the PR's merge ref, i.e. the PR would
      # supply the code that decides what the fixer may touch. Same rule as
      # pr-repair's "Fetch the repair cage" step and auto-merge's checkouts.
      # `repairable.py` is the ONE matcher for "may the fixer edit this file";
      # reusing it is what stops this doorbell ringing for a file the cage would
      # then refuse (PRs #665/#666/#679: threads on `.github/`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.scope.outputs.prs != ''
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
          # FULL checkout, not sparse: a cone-mode sparse list cannot name a
          # file (`.github/merge-policy.yml` -> "is not a directory", exit 128,
          # run 37062829468) and would also drop `.github/actions/slack`, which
          # the alert steps below need. The default branch is trusted; full is fine.

      - name: Install the cage's one dependency
        if: steps.scope.outputs.prs != ''
        run: python -m pip install --quiet pyyaml

      - name: Count the findings, and wake the fixer where there are any
        id: sweep
        if: steps.scope.outputs.prs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRS: ${{ steps.scope.outputs.prs }}
        run: |
          set -euo pipefail
          owner="${GH_REPO%%/*}"
          name="${GH_REPO##*/}"

          echo "### Finding watch" >> "$GITHUB_STEP_SUMMARY"

          # PRs that crossed INTO "exhausted" during THIS sweep (the label is
          # the once-only marker). The Slack step below reads them; a composite
          # action cannot be called from inside this loop.
          exhausted_file="${RUNNER_TEMP:-/tmp}/finding-watch-exhausted.txt"
          : > "$exhausted_file"

          # One line per PR, always. `note` is called on every exit path below.
          note() { echo "- **#$1** — $2" >> "$GITHUB_STEP_SUMMARY"; }

          # `exit 0` BELOW, NEVER `continue`. Every "skip this PR" inside the
          # subshell is an `exit 0` from the SUBSHELL, which returns to the for
          # loop and moves to the next PR. `continue` refers to a loop that is
          # not in this execution context, and bash says so —
          #   "continue: only meaningful in a `for', `while', or `until' loop"
          # — then `set -e` kills the step. Measured live on run 32732145130,
          # the first execution of the subshell fix: the guards stopped guarding
          # and the job went red. The isolation and the skips have to be written
          # together or one silently breaks the other.
          #
          # ONE PR'S BAD DAY MUST NOT END THE SWEEP. `set -e` is on and every
          # `gh api` below can fail on a rate limit or a transient 502. Without
          # this, PR #3 failing means #4..#30 are never looked at AND never get
          # their summary line -- the honesty rule broken by the same stroke
          # that breaks the sweep, and both invisibly, because the job simply
          # stops. The loop body runs in a subshell that is allowed to fail; the
          # sweep continues and says which PR it lost. (CodeRabbit, PR #380.)
          for pr in $PRS; do
           (
            meta=$(gh pr view "$pr" --json state,isDraft,headRefName,headRepositoryOwner,author,labels 2>/dev/null || echo '')
            if [ -z "$meta" ]; then note "$pr" "could not be read — skipped"; exit 0; fi
            state=$(echo "$meta"     | jq -r .state)
            draft=$(echo "$meta"     | jq -r .isDraft)
            branch=$(echo "$meta"    | jq -r .headRefName)
            headowner=$(echo "$meta" | jq -r .headRepositoryOwner.login)
            author=$(echo "$meta"    | jq -r .author.login)

            [ "$state" = "OPEN" ]        || { note "$pr" "is $state — left alone"; exit 0; }
            [ "$draft" = "false" ]       || { note "$pr" "is a draft — drafts are left alone"; exit 0; }
            # A PR labeled `wip:parked` (scripts/wip_gate.py) opted itself out
            # of the queue on purpose, same as a draft — waking the fixer for
            # it would repair a PR the owner has not even let compete for a
            # merge slot yet.
            echo "$meta" | jq -e '[.labels[].name]|any(.=="wip:parked")' >/dev/null \
              && { note "$pr" "is parked by the WIP limit — left alone"; exit 0; }
            # A fork PR is a stranger's code. pr-repair refuses it anyway (G1);
            # not dispatching means the refusal never has to be the safety net.
            [ "$headowner" = "$owner" ]  || { note "$pr" "comes from a fork ($headowner) — never dispatched"; exit 0; }
            case "$author" in
              # EXACT LOGINS, NOT A PREFIX GLOB. `dependabot*` matches
              # `dependabot-helper`, `dependabot2`, and anything else a stranger
              # can register — an allowlist with a wildcard on the end is an
              # allowlist with a door in it. The three spellings below are the
              # real ones: the webhook payload says `dependabot[bot]`, the REST
              # API says `app/dependabot`, and `gh pr view --json author` returns
              # a bare `dependabot` for some shapes. All three are named because
              # picking one is how chain_check's W12 rule describes a dead wire.
              # (CodeRabbit, PR #380.)
              # DEPENDABOT IS NEVER DISPATCHED (slice 7, 2026-09-11). It was on
              # this allowlist, so a Dependabot PR going red dispatched the
              # fixer like any other — and the fixer died at the path cage
              # every time, because a lockfile is owner-lane and the repair
              # agent may not touch it (eight Opus runs on #531/#532/#533 in
              # one afternoon, all refused). A dependency bump has its own
              # loop: dependabot-auto.yml merges it when fully green and asks
              # Dependabot itself to rebase on conflict. Nothing here can help
              # it, so nothing here should spend the owner's subscription on it.
              dependabot|"dependabot[bot]"|app/dependabot)
                note "$pr" "is a Dependabot PR — dependabot-auto.yml owns it; the fixer is never dispatched"; exit 0 ;;
              Ranjith36963) : ;;
              # `exit 0`, NOT `continue` — see the note above the loop. This one
              # survived the sweep that converted the others because it sits in a
              # `case` arm and did not match the shapes I searched for, and it is
              # the WORST one to have missed: `continue` prints an error and then
              # carries straight on, so a PR from an author who is NOT on the
              # allowlist would have fallen through to `gh workflow run`. A guard
              # that logs its own failure and then does the thing anyway is worse
              # than no guard. (CodeRabbit, PR #380.)
              *) note "$pr" "author \`$author\` is not on the repair allowlist — left alone"; exit 0 ;;
            esac

            # ── THE TWO CHANNELS, READ SEPARATELY ────────────────────────────
            # Unresolved review threads (GraphQL — the ONLY API that can express
            # resolution; the REST comments endpoint has no such field and was
            # wrong in both directions when merge_cage used it).
            # `isOutdated` + `path` + `id` are read so `repairable.py triage` can
            # tell a thread the fixer can act on from one it cannot (outdated:
            # the code it points at already changed; SELF path: the cage refuses
            # it). Unresolved is still the raw set; "fixable" is decided below.
            tdir="$RUNNER_TEMP/fw-$pr"; mkdir -p "$tdir"
            gh api graphql -f query='
              query($owner:String!,$name:String!,$number:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$number){
                    reviewThreads(first:100){ nodes{ id isResolved isOutdated path } }
                  }
                }
              }' -f owner="$owner" -f name="$name" -F number="$pr" \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[]|select(.isResolved==false)]' > "$tdir/threads.json" || {
              note "$pr" "the review-thread query FAILED — not dispatching, because 'I could not look' is not 'nothing to fix'."
              exit 0
            }

            # Failed checks. `failure`, `timed_out`, `cancelled` and `action_required`
            # all mean "this did not pass"; `skipped` and `neutral` deliberately
            # do not — a job that correctly skipped is not a finding, and
            # treating it as one is what made an earlier sweep report 3-6
            # phantom problems on every single PR.
            #
            # FAIL CLOSED, ALL THREE OF THESE. They used to end
            # `2>/dev/null || echo 0`, which turns "the API did not answer" into
            # "there is nothing wrong" — the same substitution security-watch was
            # corrected for two commits ago, pointing the other way: here a failed
            # lookup makes the sweep skip a PR that really does need the fixer,
            # silently. An unanswered question is not an answer.
            # (CodeRabbit, PR #380.)
            sha=$(gh api "repos/$GH_REPO/pulls/$pr" --jq .head.sha) || {
              note "$pr" "could not read the head SHA — skipped this round"
              exit 0
            }
            gh api "repos/$GH_REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[]|{name,status,conclusion}]' > "$tdir/checks.json" || {
              note "$pr" "the check-run query FAILED — not dispatching on a picture I could not see."
              exit 0
            }

            # ── RAW vs FIXABLE (2026-10-02) ──────────────────────────────────
            # RAW is everything that is open: unresolved threads plus checks
            # that are `failure` / `timed_out` / `cancelled` / `action_required`.
            # FIXABLE is the part the fixer can act on, decided by the same
            # `repairable.py` that cages its edits (default-branch copy, see the
            # checkout step). Fails CLOSED: if the classifier cannot run, nothing
            # is dispatched and the PR says why.
            tri=$(python3 scripts/repairable.py --threads-json "$tdir/threads.json" --checks-json "$tdir/checks.json") || {
              note "$pr" "the fixable/unfixable classifier FAILED — not dispatching blind."
              echo "::error::scripts/repairable.py triage failed for PR #$pr"
              exit 0
            }
            raw=$(echo "$tri"     | jq -r .raw)
            fixable=$(echo "$tri" | jq -r .fixable)
            threads=$(echo "$tri" | jq -r .threads.fixable)   # fixable threads
            red=$(echo "$tri"     | jq -r '.checks.fixable|length')   # fixable red checks
            why=$(echo "$tri"     | jq -r .explanation)
            has_label() { echo "$meta" | jq -e --arg L "$1" '[.labels[].name]|any(.==$L)' >/dev/null 2>&1; }
            # Labels are written through the REST labels endpoint, which creates
            # a missing label; `gh pr edit --add-label` errors on one.
            add_label() { gh api -X POST "repos/$GH_REPO/issues/$pr/labels" -f "labels[]=$1" >/dev/null; }
            drop_label() { gh api -X DELETE "repos/$GH_REPO/issues/$pr/labels/${1//:/%3A}" >/dev/null 2>&1 || true; }

            if [ "$raw" -eq 0 ]; then
              # Nothing open any more: the "needs a human" marker is stale. Drop
              # it so a LATER unfixable finding can be announced again.
              if has_label "autofix:needs-human"; then drop_label "autofix:needs-human"; fi
              note "$pr" "clean — 0 unresolved review threads, 0 failed checks. Nothing to fix."
              exit 0
            fi

            # ── NOTHING THE FIXER CAN DO: SAY SO ONCE, DO NOT DISPATCH ───────
            # PRs #665/#666/#679/#703 each burned three "attempts" in ~2 minutes
            # on exactly this: threads on `.github/`, threads on code that had
            # already changed, red checks caused by `main` or a reviewer that
            # never finished. The fixer looked, changed nothing, and that was
            # recorded as a failure. The label is the once-only marker: while it
            # is on, this is silent. The daily digest lists labelled PRs.
            if [ "$fixable" -eq 0 ]; then
              if has_label "autofix:needs-human"; then
                note "$pr" "needs a human (already flagged) — nothing the fixer can act on: $why"
                exit 0
              fi
              # Label FIRST: if it cannot be written, stay quiet rather than
              # repeat the comment every 30 minutes.
              if ! add_label "autofix:needs-human"; then
                note "$pr" "nothing the fixer can act on, but \`autofix:needs-human\` could not be written — not commenting (it would repeat): $why"
                echo "::error::could not write autofix:needs-human on PR #$pr"
                exit 0
              fi
              gh pr comment "$pr" --body "**Finding watch:** nothing here is something the auto-fixer can act on, so it was not started: $why. This one wants a human; it will appear in the morning digest. (The label \`autofix:needs-human\` keeps this comment from repeating; it is removed when the PR is clean.)" || true
              note "$pr" "**needs a human, fixer NOT dispatched** — $why"
              exit 0
            fi

            # ── GUARD 1: never chase the fixer's own commit ──────────────────
            last=$(gh api "repos/$GH_REPO/commits/$sha" --jq '.commit.author.name' 2>/dev/null || echo "")
            if [ "$last" = "pr-repair-loop" ] && [ "$red" -eq 0 ]; then
              note "$pr" "$threads fixable thread(s), but the newest commit is the fixer's own and CI is not red — waiting for the review to catch up rather than dispatching again."
              exit 0
            fi

            # ── GUARD 2: one fixer at a time, full stop ──────────────────────
            # NOT `--branch "$branch"`. A workflow_dispatch run records the ref
            # it was DISPATCHED ON — the default branch — never the PR branch it
            # was asked to repair. So the branch-scoped query returned 0 every
            # single time and this guard could not fire at all: the doorbell
            # would have started a second, third and fourth fixer on the same PR
            # while the first was still running. Caught by CodeRabbit on PR #380
            # before it ever ran, which is the only reason this is not a story
            # about a runaway.
            #
            # `pr-repair.yml` carries `concurrency: group: pr-repair` — ONE run
            # repo-wide, everything else queues behind it. So "is any pr-repair
            # busy?" is exactly the right question, and it is one this API can
            # actually answer.
            # EVERY ACTIVE RUN, NOT TWO NAMED STATUSES, AND FAIL CLOSED.
            # `queued`/`in_progress` are not the whole set — `waiting`,
            # `requested` and `pending` are also runs that have not finished, and
            # `waiting` is exactly the state a GITHUB_TOKEN-triggered run parks
            # in here. Counting "not completed" cannot miss a status GitHub adds
            # later. `--limit 20` could also age an active run off the list, so
            # this reads the API with a full page and no client-side cap. And
            # `|| echo 0` is gone: a failed lookup used to mean "nobody is busy",
            # i.e. the runaway guard failed OPEN — the one direction it must
            # never fail. (CodeRabbit, PR #380.)
            # PER PR, NOT REPO-WIDE (changed 2026-08-27). This used to count
            # every unfinished pr-repair run anywhere and refuse if there was
            # one. Combined with pr-repair's own global concurrency lock it
            # starved the queue: a repair takes 18.7-21.5 min (measured over 10
            # runs, avg 19.8) and this sweep sees it every 30, so one busy
            # repair silently dropped every other PR that round, with nothing
            # retrying them and no ordering to make it fair. Four PRs waited
            # 16-36 hours behind that on 2026-08-25/26.
            #
            # WHY THERE IS NO PER-PR BUSY CHECK HERE, AND WHY THAT IS SAFE.
            #
            # The obvious fix was to filter the same query by this PR's branch.
            # It does not work and it fails OPEN, which is worse than the bug it
            # replaces: pr-repair is started by `workflow_dispatch`, so every one
            # of its runs reports `head_branch: main` regardless of which PR it
            # is repairing — verified across the last 22 runs, all `main`. The
            # runs API does not expose `inputs`, so the PR number a run is
            # working on is not readable from here at all. A branch filter would
            # therefore match nothing, count 0 every time, and wave through a
            # second agent onto a branch that already has one.
            #
            # So the serialisation moved to where it can be exact: pr-repair now
            # declares `concurrency: group: pr-repair-${{ inputs.pr }}` with
            # `cancel-in-progress: false`. GitHub itself queues a second run for
            # the same PR behind the first — that is enforced by the platform,
            # not by a poll that can be stale by the time it is read.
            #
            # REFUTED 2026-10-02 (PRs #665, #666, #679, #703 — every one ended
            # `autofix:exhausted` with three attempt labels within ~2 minutes):
            # "a duplicate dispatch is harmless" was FALSE for the COUNTER. Every
            # review / review_comment / check_suite event triggers a sweep, so
            # three dispatches landed in ~2 minutes; the concurrency group keeps
            # ONE running and ONE pending run, so the third dispatch CANCELLED
            # the queued second (0 jobs) — and the label was written at DISPATCH
            # time, so the cancelled run was counted. At most two real runs, then
            # "exhausted after 3". Worse, the runs that did start were often sent
            # for nothing the fixer could do (threads on `.github/`, outdated
            # threads, `npm audit` red because of main, a reviewer that ran out
            # of turns) and "changed no files" was recorded as a FAILURE.
            #
            # THE TRUTH NOW: a duplicate dispatch IS harmless, because
            #   * the attempt label is written by pr-repair when a run really
            #     STARTS WORK (after its own fresh re-check that fixable work
            #     exists), so a run cancelled in the queue never counts;
            #   * this file only dispatches when `repairable.py triage` finds
            #     FIXABLE work, and says so once on the PR when it does not;
            #   * "the agent found nothing to change" is a comment and a green
            #     run in pr-repair, not a failed attempt.

            # ── GUARD 3: the hard ceiling ────────────────────────────────────
            # Recorded as a label so the count survives this run, the next run,
            # and a workflow edit. A counter that lives in a workflow's memory
            # is a counter that resets every time it matters. THIS FILE ONLY
            # READS IT: `pr-repair.yml` adds `autofix:attempt-N` when a run
            # really starts work, so the count is real attempts, not dispatches.
            attempt=0
            for n in $(seq 1 20); do
              if echo "$meta" | jq -e --arg L "autofix:attempt-$n" '.labels[]|select(.name==$L)' >/dev/null 2>&1; then
                attempt=$n
              fi
            done
            next=$((attempt + 1))
            if [ "$next" -gt "${MAX_ATTEMPTS}" ]; then
              note "$pr" "**stopped at the ceiling** — the fixer has already had $attempt goes and the findings are still there ($threads thread(s), $red red check(s)). This one needs a human."
              if ! gh pr view "$pr" --json labels --jq '.labels[].name' | grep -qx "autofix:exhausted"; then
                # LABEL FIRST, and only a SUCCESSFUL label lets the comment and the
                # Slack alert happen. The label is the once-only marker: if writing
                # it failed, the next sweep would see no label and alert again --
                # forever. A failed write is a loud warning and a silent retry.
                if gh pr edit "$pr" --add-label "autofix:exhausted" 2>/dev/null; then
                  gh pr comment "$pr" --body "**Finding watch:** the auto-fixer has had ${MAX_ATTEMPTS} attempts at this PR and $threads review thread(s) / $red failed check(s) are still open. Stopping rather than looping — this one wants your eyes. (Remove the \`autofix:attempt-*\` labels to give it another go.)" || true
                  echo "$pr" >> "$exhausted_file"
                else
                  echo "::warning::PR #$pr reached the auto-fix ceiling but the autofix:exhausted label could not be written; not alerting (would repeat every sweep). Will retry next sweep."
                fi
              fi
              exit 0
            fi

            # ── RING THE BELL ────────────────────────────────────────────────
            # `workflow_dispatch` is the one event GITHUB_TOKEN can always
            # raise. A label or an issue event raised with this token starts
            # nothing (GitHub's recursion rule — this repo has been bitten by it
            # four separate times), which is exactly why the wake-up is a
            # dispatch and not a label.
            # NO ATTEMPT LABEL IS WRITTEN HERE ANY MORE (2026-10-02). It used to
            # be added right after the dispatch succeeded, which counted a
            # dispatch that pr-repair's concurrency group then CANCELLED in the
            # queue (PRs #665/#666/#679/#703: three labels in ~2 minutes, at
            # most two real runs). `pr-repair.yml` now writes
            # `autofix:attempt-N` at the start of real work, so a run that never
            # starts never counts. The ceiling above still reads the labels.
            #
            # The PR has fixable work again, so a stale "needs a human" marker
            # is dropped: if unfixable findings remain after this attempt, they
            # are announced afresh.
            if has_label "autofix:needs-human"; then drop_label "autofix:needs-human"; fi
            if gh workflow run pr-repair.yml -f pr="$pr"; then
              note "$pr" "**fixer dispatched** (real attempts so far: $attempt/${MAX_ATTEMPTS}; pr-repair records the next one when it starts work) — $threads fixable review thread(s), $red fixable red check(s)."
            else
              note "$pr" "needs the fixer ($threads thread(s), $red red check(s)) but \`workflow dispatch\` FAILED — start \`pr-repair.yml\` by hand for this PR."
              echo "::error::could not dispatch pr-repair.yml for PR #$pr"
            fi
           ) || note "$pr" "the sweep hit an error while looking at this one (see the log) - every other PR was still checked"
          done

          # Hand the newly-exhausted PRs to the Slack step (numbers only — they
          # come from `gh pr list`/event payloads and were matched ^[0-9]+$).
          if [ -s "$exhausted_file" ]; then
            nums=$(sort -un "$exhausted_file" | paste -sd, -)
            count=$(sort -un "$exhausted_file" | wc -l | tr -d ' ')
            links=$(sort -un "$exhausted_file" | while read -r n; do echo "https://github.com/$GH_REPO/pull/$n"; done | paste -sd' ' -)
            if [ "$count" = "1" ]; then
              slack_title="PR #$nums: auto-fix gave up after ${MAX_ATTEMPTS} tries — needs you"
            else
              slack_title="PRs #${nums//,/, #}: auto-fix gave up after ${MAX_ATTEMPTS} tries — needs you"
            fi
            {
              echo "exhausted=yes"
              echo "slack_title=$slack_title"
              echo "links=$links"
            } >> "$GITHUB_OUTPUT"
          fi

      # The fixer hit its attempt ceiling: a human has to look. Fires ONLY on the
      # transition into exhausted — the sweep above adds the `autofix:exhausted`
      # label the first time and never lists the PR again, so this is once per
      # PR, not once per 30-minute sweep.
      - name: Slack — the auto-fixer gave up
        if: always() && steps.sweep.outputs.exhausted == 'yes'
        uses: ./.github/actions/slack
        with:
          channel: needs-your-decision
          severity: warn
          title: ${{ steps.sweep.outputs.slack_title }}
          body: |
            What happened: the auto-fixer tried ${{ env.MAX_ATTEMPTS }} times and the review comments or failed checks are still there.
            What to do: read the PR and fix it yourself, or close it. To give the fixer another go, remove the autofix:attempt labels.
            Link: ${{ steps.sweep.outputs.links }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # Rule B (scripts/check_alert_paths.py): the alert above keys off an output
      # the sweep only writes if it reaches its last lines. If the sweep dies
      # half way, say THAT — to the muted log, because this runs every 30 minutes.
      - name: Slack — the finding sweep itself broke
        if: always() && steps.sweep.outcome == 'failure'
        uses: ./.github/actions/slack
        with:
          channel: log-github-ci
          severity: warn
          title: "Finding watch: the sweep itself failed"
          body: |
            What happened: the 30-minute sweep that wakes the PR fixer stopped with an error, so a PR that gave up may not have been announced.
            What to do: open the run and read the red step. Nothing else needed if the next sweep is green.
            Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
