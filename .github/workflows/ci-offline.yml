name: CI — offline suite (automated Loop 2 + full backend)

# Runs the offline test suite (rule #4 — no network) on every push/PR AND on a
# daily schedule. This is the AUTOMATED form of "Loop 2": tests/test_e2e_lifecycle.py
# drives the full register→CV→search→jobs→pipeline→channels→logout journey with
# deterministic mocks and asserts every log stream filled — so the whole lifecycle
# is re-verified automatically, not only when a human runs /verify-job360.
#
# To enable: just turn on GitHub Actions for the repo (Settings → Actions). No
# secrets needed — tests inject SESSION_SECRET / channel key themselves.

# Unfiltered `push` + `pull_request` double-fires: a push to a branch with an open
# PR runs the same commit twice. Filtering push to main gives branches exactly one
# run (via the PR) and main exactly one run (via the push).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

# A newer push supersedes the run it replaces; don't pay for the stale one.
# run_id keeps each scheduled/dispatched run in its own group so a push to main
# can never cancel the nightly suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

# Least-privilege token (CodeQL actions/missing-workflow-permissions):
# these jobs only check out code and run tests/uploads — no repo writes.
permissions:
  contents: read

jobs:

  # ─── Scope: which steps does THIS diff need? ───────────────────────────────
  # Harness simplification slice 3 (owner decision 2026-09-08). Measured on the
  # last green run of main: the backend job spends 347s of 414s in pytest, and
  # ci-offline.yml runs the same suite again. A one-component frontend PR waited
  # seven minutes for tests it cannot affect.
  #
  # scripts/ci_scope.py answers `docs` / `frontend` / `full` from the changed
  # files, most restrictive wins, unknown is full, empty is full, and anything
  # that is not a pull_request (push to main, schedule, dispatch) is full
  # without looking -- main is production.
  #
  # JOBS BELOW ARE NEVER SKIPPED, ONLY THEIR STEPS. The ruleset on main and
  # scripts/merge_cage.py require checks BY NAME; a skipped job never reports
  # and blocks the merge, a job whose steps were skipped reports success.
  scope:
    name: Scope (which checks this diff needs)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.decide.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the diff needs the base commit
      # The classifier proves it can still go red BEFORE it is allowed to
      # decide anything. A broken classifier fails this job, which fails every
      # job that needs it, which is a red PR -- never a silently fast one.
      - name: The scope classifier can still fail
        run: python scripts/ci_scope.py --drill
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          scope=$(python scripts/ci_scope.py --event "$EVENT" --base "$BASE_SHA" --head HEAD --print-scope --summary)
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
  offline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [scope]
    # The backend is Postgres-backed now (pg shim); tests need a DB + Redis.
    # Mirrors ci.yml's service setup — without it, tests hit the dev-default
    # :5433 and fail with "connection refused".
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: job360
          POSTGRES_PASSWORD: job360dev
          POSTGRES_DB: job360
        options: >-
          --health-cmd "pg_isready -U job360 -d job360"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://job360:job360dev@localhost:5432/job360
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      CHANNEL_ENCRYPTION_KEY: ci-test-channel-key-not-used-in-prod
    steps:
      - uses: actions/checkout@v7
        if: needs.scope.outputs.scope == 'full'
      - uses: actions/setup-python@v7
        if: needs.scope.outputs.scope == 'full'
        with:
          python-version: "3.12"
      - name: Install backend (with dev extras)
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run offline suite (full backend + automated Loop 2 E2E)
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        run: python -m pytest -q -p no:randomly

  frontend-e2e:
    # The browser-side of Loop 2: runs the committed Playwright UI specs
    # (frontend/tests/e2e/*) in a clean environment. The specs are self-contained
    # (they set a fake session cookie + mock the API via page.route), so no backend
    # is needed — Playwright's webServer starts `npm run dev` itself.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [scope]
    steps:
      - uses: actions/checkout@v7
        if: needs.scope.outputs.scope != 'docs'
      - uses: actions/setup-node@v7
        if: needs.scope.outputs.scope != 'docs'
        with:
          node-version: "22"
      - name: Install frontend deps
        if: needs.scope.outputs.scope != 'docs'
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        if: needs.scope.outputs.scope != 'docs'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright UI specs
        if: needs.scope.outputs.scope != 'docs'
        working-directory: frontend
        # GATING (no continue-on-error): a real regression in the 24 passing specs
        # now fails CI. The 4 pre-existing failures (dashboard-sort x2, landing-cta
        # sign-in redirect, tailor-cv dialog) are quarantined with `test.fixme` +
        # FIXME notes — they need a stable Playwright env to debug the live DOM (the
        # middleware fails OPEN when the backend is unreachable, so those aren't an
        # auth-guard problem). Real browser coverage of prod lives in synthetic-live.yml.
        run: npx playwright test
      - name: Upload Playwright report (on failure)
        if: failure() && needs.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  loop2-e2e-spotlight:
    # A fast, focused run of just the automated Loop 2 lifecycle test, so a
    # lifecycle/log-fill regression is obvious in the Actions summary without
    # scanning the whole suite.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [scope]
    # Postgres-backed backend needs a DB + Redis (see offline-suite note above).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: job360
          POSTGRES_PASSWORD: job360dev
          POSTGRES_DB: job360
        options: >-
          --health-cmd "pg_isready -U job360 -d job360"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://job360:job360dev@localhost:5432/job360
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      CHANNEL_ENCRYPTION_KEY: ci-test-channel-key-not-used-in-prod
    steps:
      - uses: actions/checkout@v7
        if: needs.scope.outputs.scope == 'full'
      - uses: actions/setup-python@v7
        if: needs.scope.outputs.scope == 'full'
        with:
          python-version: "3.12"
      - name: Install backend (with dev extras)
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Automated Loop 2 (E2E lifecycle + log-fill assertions)
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        run: python -m pytest tests/test_e2e_lifecycle.py -v -p no:randomly

  # ── Make this loop LOUD ───────────────────────────────────────────────────
  # Measured 2026-07-26: of 9 workflows, only doc-sync could ever reach a human —
  # it alone had issue plumbing. live-e2e then failed 8 consecutive nights
  # unnoticed over a 6-line config gap. A watcher nobody reads is worse than no
  # watcher, so every scheduled loop now produces an OBJECT with a lifecycle:
  # fail -> open/comment one deduped issue; pass -> auto-close it.
  # Deliberately silent on pull_request: a red PR is already visible in the PR,
  # and an issue per red PR would be noise (noise is how STATUS-DAILY.md died).
  notify:
    name: Report failure as an issue
    needs: [offline-suite, frontend-e2e, loop2-e2e-spotlight]
    if: >-
      always() && (github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: write # to wake the triage loop (gh workflow run triage.yml)
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Loop RED: ci-offline is failing"
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            {
              echo "\`ci-offline.yml\` failed on **${{ github.event_name }}** (\`${{ github.ref_name }}\`)."
              echo
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "- Commit: \`${{ github.sha }}\`"
            } > notify-body.md
            if [ -z "$num" ]; then
              # LABEL + HAND OFF. Until 2026-08-03 this line was the end of the road:
              # the issue was created with GITHUB_TOKEN, which raises NO `issues:
              # opened` event (GitHub blocks that recursion), carried no `harness`
              # label, and dispatched nothing — so no loop ever diagnosed it and no
              # email was sent. The alarm rang into an empty room. Proven live:
              # issue #190 (security RED) opened and auto-closed with zero
              # diagnosis; #185 sat unread for days. Seven loops shared this bug.
              new=$(gh issue create --title "$title" --body-file notify-body.md --label harness)
              n="${new##*/}"
              if gh workflow run triage.yml -f issue="$n"; then
                echo "raised #$n and woke triage" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::issue #$n raised but triage could not be woken - diagnose by hand"
              fi
            else
              gh issue comment "$num" --body-file notify-body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" \
              --comment "Green again in run ${{ github.run_id }}. (auto-close)"
          fi
