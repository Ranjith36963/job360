name: CI — offline suite (automated Loop 2 + full backend)

# Runs the offline test suite (rule #4 — no network) on every push/PR AND on a
# daily schedule. This is the AUTOMATED form of "Loop 2": tests/test_e2e_lifecycle.py
# drives register -> login -> verify -> CV upload -> bring a job -> application
# detail/list -> fit -> receipt -> logout, with deterministic mocks, and asserts
# every log stream filled. It is IN-PROCESS (FastAPI TestClient against a test
# Postgres schema), not a browser: the UI is covered by frontend-e2e below. The
# old search / pipeline / channels journey was deleted in slice 5 (#483).
#
# To enable: just turn on GitHub Actions for the repo (Settings → Actions). No
# secrets needed — tests inject SESSION_SECRET themselves.

# Unfiltered `push` + `pull_request` double-fires: a push to a branch with an open
# PR runs the same commit twice. Filtering push to main gives branches exactly one
# run (via the PR) and main exactly one run (via the push).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

# A newer push supersedes the run it replaces; don't pay for the stale one.
# run_id keeps each scheduled/dispatched run in its own group so a push to main
# can never cancel the nightly suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

# Least-privilege token (CodeQL actions/missing-workflow-permissions):
# these jobs only check out code and run tests/uploads — no repo writes.
permissions:
  contents: read

jobs:

  # ─── Scope: which steps does THIS diff need? ───────────────────────────────
  # Harness simplification slice 3 (owner decision 2026-09-08). Measured on the
  # last green run of main: the backend job spends 347s of 414s in pytest, and
  # ci-offline.yml runs the same suite again. A one-component frontend PR waited
  # seven minutes for tests it cannot affect.
  #
  # scripts/ci_scope.py answers `docs` / `frontend` / `full` from the changed
  # files, most restrictive wins, unknown is full, empty is full, and anything
  # that is not a pull_request (push to main, schedule, dispatch) is full
  # unless it PROVES `tested` -- main is production.
  #
  # `tested` (CI audit 2026-10-19): a push to main re-ran ~27 min of pytest on
  # a tree its PR had just passed. Now the push skips the heavy steps ONLY when
  # ci_scope.py proves: the PR that produced this merge commit has the same
  # tree, every required check on its head is green, and a successful run of
  # THIS workflow uploaded `ci-tested-tree-<tree>` (only a `full` decision
  # uploads it, named after the tree that run checked out). The 06:00 schedule
  # skips only when a FULL push run passed this same sha in the last 24h.
  # Anything else -- tree differs, a red/missing check, an API error, a
  # dispatch -- is `full`. See the docstring of scripts/ci_scope.py.
  #
  # JOBS BELOW ARE NEVER SKIPPED, ONLY THEIR STEPS. The ruleset on main and
  # scripts/merge_cage.py require checks BY NAME; a skipped job never reports
  # and blocks the merge, a job whose steps were skipped reports success.
  scope:
    name: Scope (which checks this diff needs)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Read-only lookups for the `tested` proof. Job-level, so no other job
    # gains anything.
    permissions:
      contents: read
      actions: read        # this workflow's earlier runs and their marker artifact
      checks: read         # the required checks on the PR head
      pull-requests: read  # which PR produced the pushed merge commit
    outputs:
      scope: ${{ steps.decide.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the diff needs the base commit
      # The classifier proves it can still go red BEFORE it is allowed to
      # decide anything. A broken classifier fails this job, which fails every
      # job that needs it, which is a red PR -- never a silently fast one.
      - name: The scope classifier can still fail
        run: python scripts/ci_scope.py --drill
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scope=$(python scripts/ci_scope.py --event "$EVENT" --base "$BASE_SHA" --head HEAD --workflow ci-offline.yml --print-scope --summary)
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      # THE PROOF A LATER `tested` READS. Only a `full` decision writes it, and
      # its name is the tree this run checked out (on a PR: the merge ref).
      - name: Record the tree this full run tests
        id: tree
        if: steps.decide.outputs.scope == 'full'
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\nsha=%s\nevent=%s\nrun=%s\n' "$tree" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" > tested-tree.txt
      - name: Upload the full-scope marker
        if: steps.decide.outputs.scope == 'full'
        # A lost marker only makes a later main push run `full`. It must never fail
        # `scope`: a red scope SKIPS the required jobs, and the ruleset passes skipped.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 7
          overwrite: true
  # ─── The backend suite, in two shards, joined by `offline-suite` ──────────
  # SHARDED 2026-10-26: one job ran the whole suite in ~13-16 min (median), most
  # of it pytest. Two matrix jobs each run half the test FILES on their own
  # runner and their own Postgres, so the wall time is one setup plus half the
  # tests. The split is scripts/ci_shards.py: every test file pytest would
  # consider, assigned by collected-test count (largest first, to the lighter
  # shard, ties by name), proved disjoint and complete before a test runs, and
  # proved again by `offline-suite` below across both shards' manifests and
  # their merged junit report (every collected test id must be in it).
  #
  # These jobs are NOT the required check (they are named `offline-suite
  # (shard k/2)`); `offline-suite` is, and it is red unless both shards
  # succeeded. Same steps-skip rule as before: on a scope that is not `full`
  # every step skips and the job reports success.
  offline-suite-shard:
    name: offline-suite (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Measured parallel wall time of the UNSHARDED job (pytest-xdist, below),
    # 2026-10-25 audit of 84 runs: median ~16 min, max ~25 min. A shard runs
    # half the tests, so 30 is a generous ceiling. (The 2026-10-19 stopgap of
    # 45 covered the old serial suite, which hit 24-30+ min.)
    timeout-minutes: 30
    needs: [scope]
    strategy:
      # Both shards always finish: the skip ratchet and the "every collected
      # test is in the report" proof need BOTH reports, and a red shard must
      # not hide the other shard's failures by cancelling it.
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The backend is Postgres-backed now (pg shim); tests need a Postgres DB (no Redis: the rate-limit
    # tests use a fake client).
    # These are the ONE backend jobs that run pytest (ci.yml Backend is ruff +
    # mypy only) — without these, tests hit the dev-default :5433 and fail.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: job360
          POSTGRES_PASSWORD: job360dev
          POSTGRES_DB: job360
        options: >-
          --health-cmd "pg_isready -U job360 -d job360"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://job360:job360dev@localhost:5432/job360
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      SHARD: ${{ matrix.shard }}
      SHARDS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.scope == 'full'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: needs.scope.outputs.scope == 'full'
        with:
          python-version: "3.12"
      # FROM THE HASHED LOCKS (2026-10-20): the runtime pins the prod image installs
      # (backend/Dockerfile) plus the dev tools, then Playwright for the browser-agent tests
      # (tests/test_browser_*.py, the code that fills and submits real job forms: `@needs_chromium`,
      # skipped on every CI run until now). Every file is sha256-checked, then the app goes in with
      # --no-deps so nothing outside the locks can arrive. `pip check` fails on pins that do not
      # satisfy each other.
      - name: Install backend (with dev + browser)
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock.txt
          python -m pip install --require-hashes -r requirements-browser.lock.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m pip show playwright | grep -E '^Version:'
      # The Chromium build that the installed Python playwright expects, plus
      # its system libraries. Not cached: the download is the small part; the
      # apt step (--with-deps) is most of the time and an actions/cache entry
      # would not cover it. Both shards install it: browser-agent test files
      # can land in either.
      - name: Install Chromium for the browser-agent tests
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        # Usually ~20 s. On #1258 (2026-10-26) the runner's apt mirror stalled
        # and this step took 14 min, so the job hit its 30-min timeout mid-suite
        # and was CANCELLED, not judged. Cap each attempt at 5 min and try once
        # more: a stalled mirror fails fast and a retry usually lands on a
        # working one. Two failed attempts are a real failure (red).
        run: |
          for attempt in 1 2; do
            if timeout 300 python -m playwright install --with-deps chromium; then exit 0; fi
            echo "::warning title=chromium::install attempt $attempt failed or took over 5 min"
          done
          echo "::error title=chromium::Chromium install failed twice"
          exit 1
      # Fail in seconds, not after the suite: the tests' own helper must now
      # see Chromium. If it ever does not, the suite would skip ~66 tests and
      # the skip ratchet in `offline-suite` goes red too ("Playwright + Chromium
      # not installed" has a baseline of 0), so this only makes it fast and plain.
      - name: The browser-agent tests can run (Chromium is visible to them)
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        run: |
          python - <<'PY'
          import sys
          from tests.test_browser_agent import _chromium_available
          if not _chromium_available():
              print("::error title=chromium::Playwright + Chromium not visible to "
                    "tests/test_browser_agent.py::_chromium_available; every "
                    "@needs_chromium test would skip")
              sys.exit(1)
          print("Chromium visible: @needs_chromium tests will run")
          PY
      # The template dump must come from a pg_dump the SERVER can load. The
      # runner image's own client drifts (ubuntu-latest moves to Ubuntu 26 from
      # 2026-10-19, with a newer Postgres client than this pg16 service), so
      # `pg_dump` here is the service container's own, the server's exact version.
      - name: Use the Postgres service's own pg_dump
        if: needs.scope.outputs.scope == 'full'
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/pgbin"
          printf '#!/bin/sh\nexec docker exec -i %s pg_dump "$@"\n' "$PG_CONTAINER" > "$RUNNER_TEMP/pgbin/pg_dump"
          chmod +x "$RUNNER_TEMP/pgbin/pg_dump"
          echo "$RUNNER_TEMP/pgbin" >> "$GITHUB_PATH"
      # THIS SHARD'S FILES. The collection is the whole suite's, unfiltered;
      # the split refuses (red) unless every test file lands in exactly one
      # shard and none is empty (an empty list would make pytest run all).
      - name: Pick this shard's test files (every file in exactly one shard)
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        run: |
          if ! python -m pytest --collect-only -q -p no:randomly > /tmp/collected.txt 2>&1; then
            tail -60 /tmp/collected.txt
            echo "::error title=shards::pytest --collect-only failed; no shard can be picked"
            exit 1
          fi
          python ../scripts/ci_shards.py split --collected /tmp/collected.txt \
            --shards "$SHARDS" --shard "$SHARD" \
            --files-out /tmp/shard-files.txt --manifest-out /tmp/shard-manifest.json
      # THIS SHARD, UNFILTERED within its files. `--junitxml` only adds a report
      # file; it selects and deselects nothing.
      # In parallel: pytest-xdist (a dev extra) runs one worker per vCPU
      # (`-n auto`, 4 on ubuntu-latest); the controller still writes ONE junit
      # report and the same `FAILED tests/...` lines. Every test owns its Postgres
      # schema, so workers never share tables. Each worker migrates ONE template
      # schema and copies it per test with pg_dump (tests/conftest.py
      # `_template_sql`; identity proved by tests/test_schema_template.py), so the
      # step prints the pg_dump it found.
      - name: Run offline suite (this shard of the full backend + automated Loop 2 E2E)
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        run: |
          set -o pipefail
          pg_dump --version
          mapfile -t files < /tmp/shard-files.txt
          python -m pytest -q -p no:randomly -n auto --junitxml=/tmp/junit.xml "${files[@]}" | tee /tmp/pytest.out
      - name: Failed tests in job summary (offline suite, this shard)
        if: failure() && needs.scope.outputs.scope == 'full'
        run: |
          {
            echo "### Failed tests (offline suite, shard $SHARD/$SHARDS)"
            echo '```'
            if [ ! -f /tmp/pytest.out ]; then
              echo 'pytest did not run (an earlier step failed)'
            elif grep -qE '^(FAILED|ERROR) ' /tmp/pytest.out; then
              grep -E '^(FAILED|ERROR) ' /tmp/pytest.out | head -50
              grep -E '[0-9]+ (failed|passed|error)' /tmp/pytest.out | tail -1
            else
              tail -30 /tmp/pytest.out
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Also log + annotate: $GITHUB_STEP_SUMMARY is not exposed by the
          # check-run API; annotations are (GET /check-runs/{id}/annotations).
          if [ -f /tmp/pytest.out ]; then
            if grep -qE '^(FAILED|ERROR) ' /tmp/pytest.out; then
              grep -E '^(FAILED|ERROR) ' /tmp/pytest.out | head -50 | while IFS= read -r line; do
                echo "$line"
                echo "::error title=pytest::${line//%/%25}"
              done
            else
              tail -30 /tmp/pytest.out
              echo "::error title=pytest::pytest failed without FAILED lines; see log tail"
            fi
          else
            echo "::error title=pytest::pytest did not run (an earlier step failed)"
          fi
      # What `offline-suite` joins: this shard's junit, its pytest output and
      # its manifest (files, universe, collection). Pass or fail. A lost upload
      # is red here, and its absence is red there.
      - name: Hand this shard's report to offline-suite
        if: always() && needs.scope.outputs.scope == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: offline-suite-shard-${{ matrix.shard }}
          path: |
            /tmp/junit.xml
            /tmp/pytest.out
            /tmp/shard-manifest.json
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

  # THE REQUIRED CHECK. Named exactly `offline-suite` (the ruleset on main and
  # scripts/merge_cage.py TAG_CHECKS require it by name). Runs NO test: it is
  # red unless `scope` and BOTH shards succeeded, and on a `full` scope it also
  # proves the shards covered the whole suite exactly once, runs the skip
  # ratchet over the merged report, and gives loop2-e2e-spotlight the lifecycle
  # verdict.
  #
  # `always()`, not `!cancelled()`: a cancelled run must leave THIS check red
  # (a shard result of `cancelled` is not `success`), never skipped -- a skipped
  # required check reads as passed to the ruleset.
  offline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [scope, offline-suite-shard]
    if: always()
    # loop2-e2e-spotlight reads the lifecycle file's result from THIS run
    # instead of running tests/test_e2e_lifecycle.py a second time.
    outputs:
      lifecycle: ${{ steps.lifecycle.outputs.lifecycle }}
      lifecycle_counts: ${{ steps.lifecycle.outputs.counts }}
      lifecycle_failed: ${{ steps.lifecycle.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.scope == 'full'
      # The join runs only stdlib Python (ci_shards.py, test_integrity.py and the
      # lifecycle verdict), but on the same interpreter the shards used.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: needs.scope.outputs.scope == 'full'
        with:
          python-version: "3.12"
      - name: Download both shards' reports
        if: needs.scope.outputs.scope == 'full'
        continue-on-error: true # a missing report is red in the next step
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: offline-suite-shard-*
          path: ${{ runner.temp }}/shards
      - name: Merge the shards' junit reports
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/shards/*/junit.xml)
          echo "shard reports: ${#reports[@]} of 2"
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error title=shards::no shard uploaded a junit report"
            exit 1
          fi
          python scripts/ci_shards.py merge-junit /tmp/junit.xml "${reports[@]}"
      # THE SPLIT, PROVED ACROSS JOBS: both shards collected the same suite, saw
      # the same files, their file lists are disjoint and cover every file, and
      # every collected test id is in the merged report.
      - name: Every test ran in exactly one shard
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        run: |
          shopt -s nullglob
          python scripts/ci_shards.py verify --junit /tmp/junit.xml "$RUNNER_TEMP"/shards/*/shard-manifest.json
      # SKIP RATCHET (2026-10-20). A skipped test is a test that did not run, and
      # the count only ever grew without anyone deciding it should. This fails
      # when the report's skips exceed SKIP_BASELINE in scripts/test_integrity.py,
      # in total or for any one reason, and prints each reason that is new or
      # grew. "Playwright + Chromium not installed" has no allowance: Chromium is
      # installed in both shards, so one such skip is red. Raising the baseline
      # is an edit to that file, which the `test-integrity` check (ci.yml) flags.
      # It reads the MERGED report: both shards' skips, counted together.
      # `!cancelled()`: it still reports after a red suite; no report is red.
      - name: Skipped tests do not grow (skip ratchet)
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        run: python scripts/test_integrity.py --skips /tmp/junit.xml
      # Per-file verdict for tests/test_e2e_lifecycle.py, read from the merged
      # report (the file ran in exactly one shard). `absent` (no report, or no
      # lifecycle test in it) is NOT a pass: loop2-e2e-spotlight goes red on
      # anything but `passed`.
      - name: Lifecycle verdict for loop2-e2e-spotlight
        id: lifecycle
        if: always() && needs.scope.outputs.scope == 'full'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import xml.etree.ElementTree as ET
          mod = "tests.test_e2e_lifecycle"
          cases = []
          if os.path.exists("/tmp/junit.xml"):
              try:
                  cases = [c for c in ET.parse("/tmp/junit.xml").getroot().iter("testcase")
                           if c.get("classname", "") == mod
                           or c.get("classname", "").startswith(mod + ".")]
              except ET.ParseError:
                  cases = []
          bad = [c.get("name", "?") for c in cases
                 if c.find("failure") is not None or c.find("error") is not None]
          skipped = [c for c in cases if c.find("skipped") is not None]
          ran = len(cases) - len(skipped)
          verdict = "absent" if ran == 0 else ("failed" if bad else "passed")
          print(f"lifecycle={verdict}")
          print(f"counts={ran - len(bad)} passed, {len(bad)} failed, {len(skipped)} skipped")
          print(f"failed={', '.join(bad)[:900]}")
          PY
      # The shards' FAILED/ERROR lines, again, on THIS check run: it is the
      # required one, so it is where a reader of the annotations looks.
      - name: Failed tests in job summary (offline suite, both shards)
        if: always() && needs.scope.outputs.scope == 'full' && needs.offline-suite-shard.result != 'success'
        run: |
          shopt -s nullglob
          outs=("$RUNNER_TEMP"/shards/*/pytest.out)
          {
            echo "### Failed tests (offline suite, both shards)"
            echo '```'
            if [ "${#outs[@]}" -eq 0 ]; then
              echo 'no shard pytest output (an earlier step failed in each shard)'
            else
              for f in "${outs[@]}"; do
                echo "--- $(basename "$(dirname "$f")")"
                grep -E '^(FAILED|ERROR) ' "$f" | head -50 || true
                grep -E '[0-9]+ (failed|passed|error)' "$f" | tail -1 || true
              done
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for f in "${outs[@]}"; do
            grep -E '^(FAILED|ERROR) ' "$f" | head -50 | while IFS= read -r line; do
              echo "$line"
              echo "::error title=pytest::${line//%/%25}"
            done || true
          done
      # THE VERDICT. Last, and `always()`, so every step above still reports.
      # Red unless scope and both shards succeeded: failure, cancelled and
      # skipped are all red here.
      - name: Both shards succeeded
        if: always()
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SHARD_RESULT: ${{ needs.offline-suite-shard.result }}
        run: |
          echo "scope: $SCOPE_RESULT; shards: $SHARD_RESULT"
          if [ "$SCOPE_RESULT" != "success" ] || [ "$SHARD_RESULT" != "success" ]; then
            echo "::error title=offline-suite::scope=$SCOPE_RESULT, shards=$SHARD_RESULT -- offline-suite is green only when both shards succeeded"
            exit 1
          fi

  frontend-e2e:
    # The browser-side of Loop 2: runs the committed Playwright UI specs
    # (frontend/tests/e2e/*) in a clean environment. The specs are self-contained
    # (they set a fake session cookie + mock the API via page.route), so no backend
    # is needed — Playwright's webServer builds and starts the app itself.
    #
    # THE ONE PLAYWRIGHT RUN PER PR. verify-live.yml `verify / frontend` ran the
    # same `npx playwright test` again until 2026-10-19; it now defers to this
    # job whenever this job runs the specs (scope `full` / `frontend`), and the
    # evidence it used to keep (report + traces, 14 days) is uploaded HERE.
    # Steps run on an explicit list of scopes: `docs` and `tested` skip them.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [scope]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend'
        with:
          node-version: "22"
      - name: Install frontend deps
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend'
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright UI specs
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend'
        working-directory: frontend
        # GATING (no continue-on-error): a real regression in any of the 18 specs
        # in tests/e2e/ now fails CI — none are quarantined with `test.fixme` any
        # more. The API is mocked with page.route, so this checks UI wiring, not
        # a real backend. Real browser coverage of prod lives in synthetic-live.yml.
        # Output is tee'd to /tmp/playwright.out for the annotation step below;
        # pipefail keeps Playwright's exit code. The config's reporter is only
        # "html" (prints no failed-test lines), so `list` is added on the command
        # line; `html` stays, so the uploaded evidence is unchanged.
        run: |
          set -o pipefail
          npx playwright test --reporter=list,html | tee /tmp/playwright.out
      - name: Failed tests as annotations (Playwright)
        if: failure() && (needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend')
        run: |
          # $GITHUB_STEP_SUMMARY is not exposed by the check-run API; annotations
          # are (GET /check-runs/{id}/annotations).
          if [ -f /tmp/playwright.out ]; then
            if grep -qE '✘' /tmp/playwright.out; then
              { grep -E '✘' /tmp/playwright.out | head -50; grep -E '[0-9]+ (failed|passed)' /tmp/playwright.out | tail -1; } | while IFS= read -r line; do
                echo "$line"
                echo "::error title=playwright::${line//%/%25}"
              done
            else
              tail -30 /tmp/playwright.out
              echo "::error title=playwright::playwright failed without failed-test lines; see log tail"
            fi
          else
            echo "::error title=playwright::playwright did not run (an earlier step failed)"
          fi
      # Moved here from verify-live.yml with the run itself: a green covers
      # every spec that RAN, and this says out loud if any is quarantined.
      - name: State the coverage bound
        if: always() && (needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend')
        working-directory: frontend
        run: |
          fixmes=$(grep -rlc "test.fixme" tests/e2e/ 2>/dev/null | wc -l || echo "?")
          {
            echo "### frontend-e2e — coverage bound"
            echo ""
            echo "Spec files containing a quarantined (\`test.fixme\`) case: **$fixmes**"
            echo ""
            echo "A green run covers every spec that RAN. Any quarantined spec is"
            echo "NOT covered by it — do not read this check (or \`verify / frontend\`,"
            echo "which defers to it) as 'the frontend works' if the count is non-zero."
          } >> "$GITHUB_STEP_SUMMARY"
      # The evidence `verify / frontend` used to keep: report + traces/screens,
      # pass or fail, 14 days. (Was: report on failure only, 7 days.)
      - name: Keep the evidence (Playwright report + test results)
        if: always() && (needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'frontend')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-evidence-${{ github.event.pull_request.number || github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  loop2-e2e-spotlight:
    # Reports the lifecycle file's verdict from offline-suite, as its own
    # REQUIRED check, so a lifecycle/log-fill regression is obvious in the
    # Actions summary without scanning the whole suite. THIS JOB RUNS NO TEST.
    #
    # offline-suite's shards already run tests/test_e2e_lifecycle.py inside the
    # full suite (in exactly one shard, never deselected); this job reads the
    # per-file verdict offline-suite takes from the merged junit report. Green
    # ONLY on `passed`; `failed`, `absent` (no report / no lifecycle case ran),
    # or an offline-suite that never got that far is red. Until 2026-10-19 it
    # booted its own Postgres + Redis and re-ran the file (~1 runner-min per PR).
    #
    # `!cancelled()`, not `always()`: it must report even when offline-suite
    # FAILED (another test red, the lifecycle may still be green) — but a run
    # superseded by a newer push is cancelled and says nothing. A failed
    # `scope` job skips this, exactly as before.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [scope, offline-suite]
    if: ${{ !cancelled() && needs.scope.result == 'success' }}
    steps:
      - name: Report the lifecycle verdict (read from offline-suite; runs no test)
        if: needs.scope.outputs.scope == 'full'
        env:
          SUITE_RESULT: ${{ needs.offline-suite.result }}
          LIFECYCLE: ${{ needs.offline-suite.outputs.lifecycle }}
          COUNTS: ${{ needs.offline-suite.outputs.lifecycle_counts }}
          FAILED: ${{ needs.offline-suite.outputs.lifecycle_failed }}
        run: |
          {
            echo "### Lifecycle verdict — tests/test_e2e_lifecycle.py"
            echo ""
            echo "Read from \`offline-suite\` (same run, same tree; the file ran once, in one shard of the full suite)."
            echo ""
            echo "- verdict: \`${LIFECYCLE:-absent}\` (${COUNTS:-no report})"
            echo "- offline-suite job result: \`$SUITE_RESULT\`"
            if [ -n "$FAILED" ]; then echo "- failed: $FAILED"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          case "$LIFECYCLE" in
            passed)
              echo "lifecycle passed: $COUNTS"
              ;;
            failed)
              echo "::error title=pytest::test_e2e_lifecycle.py failed in offline-suite: $FAILED"
              exit 1
              ;;
            *)
              echo "::error title=pytest::no lifecycle verdict from offline-suite (job result: $SUITE_RESULT) -- it did not get as far as the report"
              exit 1
              ;;
          esac

  # Failures on main / on the schedule are reported as an issue by loop-red.yml
  # (one workflow_run watcher, so PRs no longer show a 'skipping' row for it).

  # WAKE THE MERGE CAGE (2026-10-19). GitHub does not fire `check_suite` for
  # Actions' own suites, so the arm in auto-merge.yml never heard that this
  # workflow finished, and a green PR sat waiting for a hand merge. This job
  # tells it. A `workflow_dispatch` is the one event GITHUB_TOKEN may start, and
  # the arm never waits on this job's own check run (merge_cage.WAKE_JOB).
  # ONE wake per push, here: `offline-suite` is the required check that finishes
  # last (measured on #908, 2026-10-19). A wake in every workflow queued six cage
  # runs per push onto a runner queue that already held 140. The 20-minute sweep
  # and the CodeRabbit status event cover a check that finishes later.
  wake-cage:
    name: Wake the merge cage
    needs: [scope, offline-suite, frontend-e2e, loop2-e2e-spotlight]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A fork PR's token cannot dispatch, and that must not read as red CI. A
    # same-repository dispatch that fails DOES go red: nobody else would see it.
    continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    permissions:
      actions: write
    steps:
      - name: Ask the arm to judge this PR again
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh workflow run auto-merge.yml --ref main -f pr="$PR"
