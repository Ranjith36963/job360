name: CI — offline suite (automated Loop 2 + full backend)

# NOTE: the "offline" name is historical (pre-dates the SQLite→Postgres
# migration) and is kept so workflow history/badges stay attached. "Offline"
# still means no EXTERNAL network (rule #4 — all HTTP mocked); the suite now
# needs a local Postgres service container, same as ci.yml.
#
# Runs the offline test suite on a daily schedule (per-push/PR coverage moved
# to ci.yml, which runs the same pytest suite — no point running it twice).
# This is the AUTOMATED form of "Loop 2": tests/test_e2e_lifecycle.py
# drives the full register→CV→search→jobs→pipeline→channels→logout journey with
# deterministic mocks and asserts every log stream filled — so the whole lifecycle
# is re-verified automatically, not only when a human runs /verify-job360.
# It also runs the Playwright UI specs, which ci.yml does NOT run.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: job360
          POSTGRES_PASSWORD: job360dev
          POSTGRES_DB: job360
        options: >-
          --health-cmd "pg_isready -U job360 -d job360"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # Exported so tests CAN use Postgres once the migration lands.
      # Existing tests use SQLite via conftest.py fixtures and are unaffected
      # by this env var being present.
      DATABASE_URL: postgresql://job360:job360dev@localhost:5432/job360
      REDIS_URL: redis://localhost:6379
      # Minimal secrets for auth tests (injected by conftest.py too, but set
      # here so any integration smoke-tests that read .env also have them).
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      CHANNEL_ENCRYPTION_KEY: ci-test-channel-key-not-used-in-prod

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (with dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run offline suite (full backend + automated Loop 2 E2E)
        working-directory: backend
        run: python -m pytest -q -p no:randomly

  frontend-e2e:
    # The browser-side of Loop 2: runs the committed Playwright UI specs
    # (frontend/tests/e2e/*) in a clean environment. The specs are self-contained
    # (they set a fake session cookie + mock the API via page.route), so no backend
    # is needed — Playwright's webServer starts `npm run dev` itself.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright UI specs
        working-directory: frontend
        run: npx playwright test

  loop2-e2e-spotlight:
    # A fast, focused run of just the automated Loop 2 lifecycle test, so a
    # lifecycle/log-fill regression is obvious in the Actions summary without
    # scanning the whole suite.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: job360
          POSTGRES_PASSWORD: job360dev
          POSTGRES_DB: job360
        options: >-
          --health-cmd "pg_isready -U job360 -d job360"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://job360:job360dev@localhost:5432/job360
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      CHANNEL_ENCRYPTION_KEY: ci-test-channel-key-not-used-in-prod

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (with dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Automated Loop 2 (E2E lifecycle + log-fill assertions)
        working-directory: backend
        run: python -m pytest tests/test_e2e_lifecycle.py -v -p no:randomly
