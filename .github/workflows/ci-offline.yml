name: CI — offline suite (automated Loop 2 + full backend)

# Runs the offline test suite (rule #4 — no network) on every push/PR AND on a
# daily schedule. This is the AUTOMATED form of "Loop 2": tests/test_e2e_lifecycle.py
# drives the full register→CV→search→jobs→pipeline→channels→logout journey with
# deterministic mocks and asserts every log stream filled — so the whole lifecycle
# is re-verified automatically, not only when a human runs /verify-job360.
#
# To enable: just turn on GitHub Actions for the repo (Settings → Actions). No
# secrets needed — tests inject SESSION_SECRET / channel key themselves.

# Unfiltered `push` + `pull_request` double-fires: a push to a branch with an open
# PR runs the same commit twice. Filtering push to main gives branches exactly one
# run (via the PR) and main exactly one run (via the push).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

# A newer push supersedes the run it replaces; don't pay for the stale one.
# run_id keeps each scheduled/dispatched run in its own group so a push to main
# can never cancel the nightly suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

# Least-privilege token (CodeQL actions/missing-workflow-permissions):
# these jobs only check out code and run tests/uploads — no repo writes.
permissions:
  contents: read

jobs:

  # ─── Scope: which steps does THIS diff need? ───────────────────────────────
  # Harness simplification slice 3 (owner decision 2026-09-08). Measured on the
  # last green run of main: the backend job spends 347s of 414s in pytest, and
  # ci-offline.yml runs the same suite again. A one-component frontend PR waited
  # seven minutes for tests it cannot affect.
  #
  # scripts/ci_scope.py answers `docs` / `frontend` / `full` from the changed
  # files, most restrictive wins, unknown is full, empty is full, and anything
  # that is not a pull_request (push to main, schedule, dispatch) is full
  # without looking -- main is production.
  #
  # JOBS BELOW ARE NEVER SKIPPED, ONLY THEIR STEPS. The ruleset on main and
  # scripts/merge_cage.py require checks BY NAME; a skipped job never reports
  # and blocks the merge, a job whose steps were skipped reports success.
  scope:
    name: Scope (which checks this diff needs)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.decide.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the diff needs the base commit
      # The classifier proves it can still go red BEFORE it is allowed to
      # decide anything. A broken classifier fails this job, which fails every
      # job that needs it, which is a red PR -- never a silently fast one.
      - name: The scope classifier can still fail
        run: python scripts/ci_scope.py --drill
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          scope=$(python scripts/ci_scope.py --event "$EVENT" --base "$BASE_SHA" --head HEAD --print-scope --summary)
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
  offline-suite:
    runs-on: ubuntu-latest
    # 45, not 30: the serial suite reached 24-30+ min by 2026-10-19 and runs were
    # cut off mid-pytest (#919, #926). Stopgap until the suite runs in parallel.
    timeout-minutes: 45
    needs: [scope]
    # The backend is Postgres-backed now (pg shim); tests need a DB + Redis.
    # Mirrors ci.yml's service setup — without it, tests hit the dev-default
    # :5433 and fail with "connection refused".
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: job360
          POSTGRES_PASSWORD: job360dev
          POSTGRES_DB: job360
        options: >-
          --health-cmd "pg_isready -U job360 -d job360"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://job360:job360dev@localhost:5432/job360
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      CHANNEL_ENCRYPTION_KEY: ci-test-channel-key-not-used-in-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.scope == 'full'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: needs.scope.outputs.scope == 'full'
        with:
          python-version: "3.12"
      - name: Install backend (with dev extras)
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run offline suite (full backend + automated Loop 2 E2E)
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest -q -p no:randomly | tee /tmp/pytest.out
      - name: Failed tests in job summary (offline suite)
        if: failure() && needs.scope.outputs.scope == 'full'
        run: |
          {
            echo "### Failed tests (offline suite)"
            echo '```'
            if [ ! -f /tmp/pytest.out ]; then
              echo 'pytest did not run (an earlier step failed)'
            elif grep -qE '^(FAILED|ERROR) ' /tmp/pytest.out; then
              grep -E '^(FAILED|ERROR) ' /tmp/pytest.out | head -50
              grep -E '[0-9]+ (failed|passed|error)' /tmp/pytest.out | tail -1
            else
              tail -30 /tmp/pytest.out
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Also log + annotate: $GITHUB_STEP_SUMMARY is not exposed by the
          # check-run API; annotations are (GET /check-runs/{id}/annotations).
          if [ -f /tmp/pytest.out ]; then
            if grep -qE '^(FAILED|ERROR) ' /tmp/pytest.out; then
              grep -E '^(FAILED|ERROR) ' /tmp/pytest.out | head -50 | while IFS= read -r line; do
                echo "$line"
                echo "::error title=pytest::${line//%/%25}"
              done
            else
              tail -30 /tmp/pytest.out
              echo "::error title=pytest::pytest failed without FAILED lines; see log tail"
            fi
          else
            echo "::error title=pytest::pytest did not run (an earlier step failed)"
          fi

  frontend-e2e:
    # The browser-side of Loop 2: runs the committed Playwright UI specs
    # (frontend/tests/e2e/*) in a clean environment. The specs are self-contained
    # (they set a fake session cookie + mock the API via page.route), so no backend
    # is needed — Playwright's webServer starts `npm run dev` itself.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [scope]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.scope != 'docs'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.scope.outputs.scope != 'docs'
        with:
          node-version: "22"
      - name: Install frontend deps
        if: needs.scope.outputs.scope != 'docs'
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        if: needs.scope.outputs.scope != 'docs'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright UI specs
        if: needs.scope.outputs.scope != 'docs'
        working-directory: frontend
        # GATING (no continue-on-error): a real regression in any of the 14 specs
        # in tests/e2e/ now fails CI — none are quarantined with `test.fixme` any
        # more. Real browser coverage of prod lives in synthetic-live.yml.
        run: npx playwright test
      - name: Upload Playwright report (on failure)
        if: failure() && needs.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  loop2-e2e-spotlight:
    # A fast, focused run of just the automated Loop 2 lifecycle test, so a
    # lifecycle/log-fill regression is obvious in the Actions summary without
    # scanning the whole suite.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [scope]
    # Postgres-backed backend needs a DB + Redis (see offline-suite note above).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: job360
          POSTGRES_PASSWORD: job360dev
          POSTGRES_DB: job360
        options: >-
          --health-cmd "pg_isready -U job360 -d job360"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://job360:job360dev@localhost:5432/job360
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-test-secret-not-used-in-prod
      CHANNEL_ENCRYPTION_KEY: ci-test-channel-key-not-used-in-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.scope == 'full'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: needs.scope.outputs.scope == 'full'
        with:
          python-version: "3.12"
      - name: Install backend (with dev extras)
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Automated Loop 2 (E2E lifecycle + log-fill assertions)
        if: needs.scope.outputs.scope == 'full'
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest tests/test_e2e_lifecycle.py -v -p no:randomly | tee /tmp/pytest.out
      - name: Failed tests in job summary (e2e lifecycle)
        if: failure() && needs.scope.outputs.scope == 'full'
        run: |
          {
            echo "### Failed tests (e2e lifecycle)"
            echo '```'
            if [ ! -f /tmp/pytest.out ]; then
              echo 'pytest did not run (an earlier step failed)'
            elif grep -qE '^(FAILED|ERROR) ' /tmp/pytest.out; then
              grep -E '^(FAILED|ERROR) ' /tmp/pytest.out | head -50
              grep -E '[0-9]+ (failed|passed|error)' /tmp/pytest.out | tail -1
            else
              tail -30 /tmp/pytest.out
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Also log + annotate: $GITHUB_STEP_SUMMARY is not exposed by the
          # check-run API; annotations are (GET /check-runs/{id}/annotations).
          if [ -f /tmp/pytest.out ]; then
            if grep -qE '^(FAILED|ERROR) ' /tmp/pytest.out; then
              grep -E '^(FAILED|ERROR) ' /tmp/pytest.out | head -50 | while IFS= read -r line; do
                echo "$line"
                echo "::error title=pytest::${line//%/%25}"
              done
            else
              tail -30 /tmp/pytest.out
              echo "::error title=pytest::pytest failed without FAILED lines; see log tail"
            fi
          else
            echo "::error title=pytest::pytest did not run (an earlier step failed)"
          fi

  # Failures on main / on the schedule are reported as an issue by loop-red.yml
  # (one workflow_run watcher, so PRs no longer show a 'skipping' row for it).

  # WAKE THE MERGE CAGE (2026-10-19). GitHub does not fire `check_suite` for
  # Actions' own suites, so the arm in auto-merge.yml never heard that this
  # workflow finished, and a green PR sat waiting for a hand merge. This job
  # tells it. A `workflow_dispatch` is the one event GITHUB_TOKEN may start, and
  # the arm never waits on this job's own check run (merge_cage.WAKE_JOB).
  # ONE wake per push, here: `offline-suite` is the required check that finishes
  # last (measured on #908, 2026-10-19). A wake in every workflow queued six cage
  # runs per push onto a runner queue that already held 140. The 20-minute sweep
  # and the CodeRabbit status event cover a check that finishes later.
  wake-cage:
    name: Wake the merge cage
    needs: [scope, offline-suite, frontend-e2e, loop2-e2e-spotlight]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A fork PR's token cannot dispatch, and that must not read as red CI. A
    # same-repository dispatch that fails DOES go red: nobody else would see it.
    continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    permissions:
      actions: write
    steps:
      - name: Ask the arm to judge this PR again
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh workflow run auto-merge.yml --ref main -f pr="$PR"
