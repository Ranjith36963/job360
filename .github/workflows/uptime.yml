name: Uptime

# Free uptime monitor — no third-party account. Pings the live backend's
# readiness probe (checks DB+Redis) on a schedule. If it's not 200, the job FAILS,
# and GitHub emails the repo owner (default notification on scheduled-workflow
# failure). Scheduled workflows only run on the default branch (main).
on:
  schedule:
    - cron: "*/10 * * * *" # every ~10 minutes
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Least-privilege token: this workflow only curls a public URL, it never reads
# repo contents or writes anything (CodeQL actions/missing-workflow-permissions).
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend /api/readyz
        run: |
          URL="https://backend-production-80e8e.up.railway.app/api/readyz"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$URL")
          echo "GET $URL -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Backend readiness check failed (HTTP $code)"
            exit 1
          fi
      - name: Ping frontend
        run: |
          URL="https://frontend-production-c608f.up.railway.app/"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$URL")
          echo "GET $URL -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Frontend check failed (HTTP $code)"
            exit 1
          fi

  # ── Make this loop LOUD ───────────────────────────────────────────────────
  # A watcher nobody reads is worse than no watcher: measured 2026-07-26, every
  # artifact here without a notifier died (MISSIONS.md 39d, STATUS-DAILY.md 5w,
  # TELEMETRY.jsonl 6w) and live-e2e failed 8 nights unseen. A finding must be an
  # OBJECT with a lifecycle: fail -> one deduped issue; pass -> auto-close.
  notify:
    name: Report failure as an issue
    needs: [ping]
    # Also fires on a manual dispatch, so the ALARM PATH itself can be
    # drilled. Previously this was schedule-only: the one way to force a
    # red on demand skipped the very step you would be drilling, so the
    # notify layer could not be exercised until a real incident — the
    # worst possible moment to discover it broken. Two loops in this repo
    # were dead on arrival and only a deliberate drill revealed it.
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # needed to check out the repo for ./.github/actions/slack
      issues: write
      actions: write # to wake the triage loop (gh workflow run triage.yml)
    steps:
      # A local composite action is just files in the repo — without a checkout
      # `uses: ./.github/actions/slack` cannot resolve and the step errors.
      - uses: actions/checkout@v7

      - name: Open, update or close the tracking issue
        id: raise
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Loop RED: uptime probe is failing"
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            {
              echo "\`uptime.yml\` failed on its schedule."
              echo
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "- Commit: \`${{ github.sha }}\`"
            } > notify-body.md
            # Fires every 10 min: comment-per-failure would be spam. Open ONE
            # issue per outage and stay silent until it recovers.
            if [ -z "$num" ]; then
              # LABEL + HAND OFF. Until 2026-08-03 this line was the end of the road:
              # the issue was created with GITHUB_TOKEN, which raises NO `issues:
              # opened` event (GitHub blocks that recursion), carried no `harness`
              # label, and dispatched nothing — so no loop ever diagnosed it and no
              # email was sent. The alarm rang into an empty room. Proven live:
              # issue #190 (security RED) opened and auto-closed with zero
              # diagnosis; #185 sat unread for days. Seven loops shared this bug.
              new=$(gh issue create --title "$title" --body-file notify-body.md --label harness)
              n="${new##*/}"
              echo "issue=$n" >> "$GITHUB_OUTPUT"
              # Slack follows the SAME dedupe doctrine as the issue: announce the
              # START of an outage, not every 10-minute re-confirmation of it. A
              # channel that repeats itself 144 times a day is a channel he mutes,
              # and a muted production-incidents channel is worse than none.
              echo "announce=down" >> "$GITHUB_OUTPUT"
              if gh workflow run triage.yml -f issue="$n"; then
                echo "raised #$n and woke triage" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::issue #$n raised but triage could not be woken - diagnose by hand"
              fi
            else
              echo "outage issue #$num already open — staying quiet" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" \
              --comment "Green again in run ${{ github.run_id }}. (auto-close)"
            echo "issue=$num" >> "$GITHUB_OUTPUT"
            echo "announce=recovered" >> "$GITHUB_OUTPUT"
          fi

      # ── SLACK: the harness finally has a voice ────────────────────────────
      # production-incidents is the STRICTEST channel in the routing table and
      # this is one of the few things that earns it: /api/readyz or the
      # frontend is not returning 200, so a real user loading job360.uk right
      # now sees a broken site. Nothing weaker than that belongs here.
      - name: Slack — the site is DOWN (real users affected)
        if: steps.raise.outputs.announce == 'down'
        uses: ./.github/actions/slack
        with:
          channel: production-incidents
          severity: critical
          title: "job360 is DOWN — the uptime probe is failing"
          body: |
            The backend readiness probe (/api/readyz, which checks DB + Redis) or
            the frontend did not return 200. Users hitting job360.uk see this.

            Issue: ${{ github.server_url }}/${{ github.repository }}/issues/${{ steps.raise.outputs.issue }}
            Run:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      # Recovery is NOT an incident — it is news. It goes to the muted log
      # channel so production-incidents only ever contains things still broken.
      # FALLBACK LAST MILE. Every branch above keys off an output that the step
      # only writes if it SUCCEEDS — so a failure inside the issue step (a gh
      # 403, a rate limit) would skip all of them and the outage would go
      # unannounced. That is the "alarm rang into an empty room" bug this repo
      # has now hit four separate times, and it is always the LAST call in the
      # job that hides it. So: if the alarm path itself broke, say THAT.
      - name: Slack — the alarm path itself broke
        if: always() && steps.raise.outcome == 'failure'
        uses: ./.github/actions/slack
        with:
          channel: needs-your-decision
          severity: warn
          title: "uptime: the ALARM step failed — an outage may be unreported"
          body: |
            The uptime job could not open/close its tracking issue, so the normal
            notification did not run. Check the probe result by hand — this
            message means the messenger broke, not that the site is fine.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Slack — recovered
        if: steps.raise.outputs.announce == 'recovered'
        uses: ./.github/actions/slack
        with:
          channel: log-github-ci
          severity: info
          title: "uptime: back to green"
          body: |
            The uptime probe passes again and outage issue #${{ steps.raise.outputs.issue }} was auto-closed.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
