name: Checker scorecard (is our judge any good?)

# HOLE #2. The blind checker labels PRs approve/reject/uncertain. Nobody had
# ever measured whether those labels mean anything — and an unmeasured judge
# is an opinion wearing a badge.
#
# This runs the measurement on a schedule and COMMITS the result, so it cannot
# rot the way docs/maintenance/TELEMETRY.jsonl did: that file was hand-written
# by agents and died the moment nobody remembered to append. A cron cannot
# forget. (Our own law: an artifact with no notifier dies.)
#
# NO MODEL ANYWHERE. Every number is a count from `gh`. That is the same reason
# dependabot-auto is allowed to merge on its own: a decision made by counting
# cannot be talked round.
#
# It publishes coverage, verdict mix, and AGREEMENT with the human merge
# decision — and refuses to publish a "catch rate", because measuring catch
# rate honestly needs bugs we planted on purpose with known answers. Reporting
# one without that would be the exact failure the Promise skill exists to stop.

on:
  schedule:
    - cron: "0 10 * * 1" # Mondays 10:00 UTC — weekly, after the daily sweeps
  workflow_dispatch: {} # drill entrance — every loop must be fireable on demand

permissions:
  contents: write # commit the scorecard
  pull-requests: read
  issues: read

concurrency:
  group: checker-scorecard
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Shelf X-ray — both sides of the match, one picture. The matching model
      # is a product (user shelf x job shelf per dimension); a dimension can
      # only fire when BOTH sides hold data. Weekly, committed, so an empty
      # shelf is SEEN — not rediscovered weeks later. Born 2026-08-07 after a
      # day of blindness incidents: scoring dims were built job-side while
      # their user-side partners were empty for every user. Report-only by
      # design (exit code ignored): coverage is a trend, not an alarm — the
      # data-invariants loop owns alarms. Identities are masked (u1/u2/...)
      # because this lands in a PUBLIC repo.
      - name: Shelf X-ray (user side x job side)
        if: ${{ !cancelled() }}
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -uo pipefail
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::warning::PROD_DATABASE_URL not set - shelf X-ray skipped."
            exit 0
          fi
          python -m pip install --quiet "psycopg[binary]>=3.2"
          {
            echo ""
            echo "## Shelf X-ray ($(date -u +%F))"
            echo '```'
            DATABASE_URL="$PROD_DATABASE_URL" python backend/scripts/shelf_xray.py 2>&1
            echo '```'
          } >> docs/maintenance/CHECKER-SCORECARD.md

      - name: Measure the checker
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p docs/maintenance
          python scripts/checker_scorecard.py --days 30 > docs/maintenance/CHECKER-SCORECARD.md
          python scripts/checker_scorecard.py --days 30 --json > /tmp/score.json
          # Append one line to the telemetry log so the TREND survives, not just
          # the latest snapshot. Trend is what tells you if the judge is drifting.
          python - <<'PY' >> docs/maintenance/TELEMETRY.jsonl
          import json, os, subprocess
          d = json.load(open("/tmp/score.json"))
          d["kind"] = "checker_scorecard"
          d["run_id"] = os.environ.get("GITHUB_RUN_ID", "")
          d["sha"] = subprocess.run(["git","rev-parse","--short","HEAD"],
                                    capture_output=True, text=True).stdout.strip()
          print(json.dumps(d))
          PY
          cat docs/maintenance/CHECKER-SCORECARD.md >> "$GITHUB_STEP_SUMMARY"

      # The ruleset judge. `main-production-gate` names 11 required checks and
      # enforces nothing; the question that matters is not "is it on" (one
      # boolean, passes forever once flipped) but "would every required context
      # actually be REPORTED, by the app the rule pins, on the commits it will
      # judge". This re-reads GitHub and REWRITES the recorded snapshot that the
      # per-PR gate reads offline.
      #
      # That makes the refresh itself an absence detector: if this weekly job
      # stops, the snapshot ages out and `ruleset_gate.py --check` in ci.yml goes
      # RED on staleness. A stopped loop cannot stay silent.
      - name: Would the ruleset wedge the repo?
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            echo ""
            echo "## Ruleset gate ($(date -u +%F))"
            echo '```'
            python scripts/ruleset_gate.py --live 2>&1
            echo '```'
          } >> docs/maintenance/CHECKER-SCORECARD.md

      - name: Commit the scorecard
        run: |
          set -euo pipefail
          git config user.name "checker-scorecard"
          git config user.email "actions@github.com"
          git add docs/maintenance/CHECKER-SCORECARD.md docs/maintenance/TELEMETRY.jsonl
          git add .github/rulesets/main-gate-snapshot.json
          if git diff --cached --quiet; then
            echo "no change in the scorecard" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'chore(harness): weekly blind-checker scorecard\n\nMeasured, not asserted: coverage, verdict mix, and agreement with the human\nmerge decision. Deliberately does NOT publish a catch rate - that needs\nplanted bugs with known answers, and a made-up number is worse than none.\n' > /tmp/sc-msg.txt
          git commit -F /tmp/sc-msg.txt
          git push origin HEAD:${{ github.ref_name }}

      # Deliberately AFTER the commit, and deliberately able to fail. The step
      # above appends the report inside a `{ ... } >> file` block whose exit
      # status is the final `echo`, so a wedge finding there is swallowed — the
      # report would be written and the job would stay green, which is this
      # repo's signature failure. This step re-reads the freshly written snapshot
      # (offline, no network) and turns the wedge into a RED build.
      #
      # Scope is `all` here, unlike the per-PR gate: this run is FOR the owner,
      # and the live PR queue is exactly what he can act on.
      - name: A wedge finding must turn this job RED
        if: ${{ !cancelled() }}
        run: python scripts/ruleset_gate.py --check --scope all
