name: CodeQL

# CodeQL — GitHub's static security scanner. Reads YOUR source (not just deps)
# for real vulnerability patterns: injection, auth bypass, unsafe deserialization,
# path traversal, etc. Complements the CI's bandit (python-only, lighter) and
# gitleaks (secrets-only) with cross-language dataflow analysis.
#
# Runs on push to main, on every PR, and weekly (catches new query-pack rules
# even when code is quiet). Findings appear under Security → Code scanning alerts.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 5 * * 1" # 05:00 UTC Monday
  # Every loop must be fireable on demand — repo doctrine. Without this,
  # codeql could not be drilled at all.
  workflow_dispatch: {}

# A newer push to a PR supersedes the analysis of the old head; don't pay for
# the stale one. PULL REQUESTS ONLY: every other event gets its own group (the
# run id) and cancel-in-progress is false, so a push to main, the weekly
# schedule or a dispatch is never cancelled or queued behind anything.
#
# Deliberately NOT given a `tested` skip on push to main (CI audit 2026-10-19):
# code scanning's default-branch alerts, and the base a PR analysis is
# compared against, come only from analyses uploaded FOR main. Skipping them
# would leave the Security tab and every later PR diff reading a stale main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write # required so CodeQL can upload alerts

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # python = backend, javascript-typescript = frontend
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          language: ${{ matrix.language }}
          # security-extended, NOT security-and-quality: the quality half
          # duplicates ruff (which already governs style/dead-code and documents
          # deliberate suppressions like S110 empty-except). Running both meant
          # 97 "note" alerts re-flagging patterns ruff sanctions — noise that
          # trains you to ignore the tool. One tool per job.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  # Failures on main / on the schedule are reported as an issue by loop-red.yml
  # (one workflow_run watcher, so PRs no longer show a 'skipping' row for it).
