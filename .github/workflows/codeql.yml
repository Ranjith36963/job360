name: CodeQL

# CodeQL — GitHub's static security scanner. Reads YOUR source (not just deps)
# for real vulnerability patterns: injection, auth bypass, unsafe deserialization,
# path traversal, etc. Complements the CI's bandit (python-only, lighter) and
# gitleaks (secrets-only) with cross-language dataflow analysis.
#
# Runs on push to main, on every PR, and weekly (catches new query-pack rules
# even when code is quiet). Findings appear under Security → Code scanning alerts.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 5 * * 1" # 05:00 UTC Monday
  # Every loop must be fireable on demand — repo doctrine. Without this,
  # codeql could not be drilled at all.
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write # required so CodeQL can upload alerts

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # python = backend, javascript-typescript = frontend
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          language: ${{ matrix.language }}
          # security-extended, NOT security-and-quality: the quality half
          # duplicates ruff (which already governs style/dead-code and documents
          # deliberate suppressions like S110 empty-except). Running both meant
          # 97 "note" alerts re-flagging patterns ruff sanctions — noise that
          # trains you to ignore the tool. One tool per job.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  # Failures on main / on the schedule are reported as an issue by loop-red.yml
  # (one workflow_run watcher, so PRs no longer show a 'skipping' row for it).

  # WAKE THE MERGE CAGE (2026-10-19). GitHub does not fire `check_suite` for
  # Actions' own suites, so the arm in auto-merge.yml never heard that this
  # workflow finished, and a green PR sat waiting for a hand merge. This job
  # tells it. A `workflow_dispatch` is the one event GITHUB_TOKEN may start, and
  # the arm never waits on this job's own check run (merge_cage.WAKE_JOB).
  wake-cage:
    name: Wake the merge cage
    needs: [analyze]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true # a fork PR's token cannot dispatch; that must not read as red CI
    permissions:
      actions: write
    steps:
      - name: Ask the arm to judge this PR again
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh workflow run auto-merge.yml --ref main -f pr="$PR"
