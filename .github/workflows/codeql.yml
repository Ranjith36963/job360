name: CodeQL

# CodeQL — GitHub's static security scanner. Reads YOUR source (not just deps)
# for real vulnerability patterns: injection, auth bypass, unsafe deserialization,
# path traversal, etc. Complements the CI's bandit (python-only, lighter) and
# gitleaks (secrets-only) with cross-language dataflow analysis.
#
# Runs on push to main, on every PR, and weekly (catches new query-pack rules
# even when code is quiet). Findings appear under Security → Code scanning alerts.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 5 * * 1" # 05:00 UTC Monday
  # Every loop must be fireable on demand — repo doctrine. Without this,
  # codeql could not be drilled at all.
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write # required so CodeQL can upload alerts

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # python = backend, javascript-typescript = frontend
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          language: ${{ matrix.language }}
          # security-extended, NOT security-and-quality: the quality half
          # duplicates ruff (which already governs style/dead-code and documents
          # deliberate suppressions like S110 empty-except). Running both meant
          # 97 "note" alerts re-flagging patterns ruff sanctions — noise that
          # trains you to ignore the tool. One tool per job.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.4

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:${{ matrix.language }}"

  # ── Make this loop LOUD ───────────────────────────────────────────────────
  # Measured 2026-07-26: of 9 workflows, only doc-sync could ever reach a human —
  # it alone had issue plumbing. live-e2e then failed 8 consecutive nights
  # unnoticed over a 6-line config gap. A watcher nobody reads is worse than no
  # watcher, so every scheduled loop now produces an OBJECT with a lifecycle:
  # fail -> open/comment one deduped issue; pass -> auto-close it.
  # Deliberately silent on pull_request: a red PR is already visible in the PR,
  # and an issue per red PR would be noise (noise is how STATUS-DAILY.md died).
  notify:
    name: Report failure as an issue
    needs: [analyze]
    if: >-
      always() && (github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: write # to wake the triage loop (gh workflow run triage.yml)
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Loop RED: codeql is failing"
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            {
              echo "\`codeql.yml\` failed on **${{ github.event_name }}** (\`${{ github.ref_name }}\`)."
              echo
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "- Commit: \`${{ github.sha }}\`"
            } > notify-body.md
            if [ -z "$num" ]; then
              # LABEL + HAND OFF. Until 2026-08-03 this line was the end of the road:
              # the issue was created with GITHUB_TOKEN, which raises NO `issues:
              # opened` event (GitHub blocks that recursion), carried no `harness`
              # label, and dispatched nothing — so no loop ever diagnosed it and no
              # email was sent. The alarm rang into an empty room. Proven live:
              # issue #190 (security RED) opened and auto-closed with zero
              # diagnosis; #185 sat unread for days. Seven loops shared this bug.
              new=$(gh issue create --title "$title" --body-file notify-body.md --label harness)
              n="${new##*/}"
              if gh workflow run triage.yml -f issue="$n"; then
                echo "raised #$n and woke triage" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::issue #$n raised but triage could not be woken - diagnose by hand"
              fi
            else
              gh issue comment "$num" --body-file notify-body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" \
              --comment "Green again in run ${{ github.run_id }}. (auto-close)"
          fi
