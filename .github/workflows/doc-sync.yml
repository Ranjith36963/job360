name: doc-sync

# Loop 3 — code↔docs drift check.
# Reads hard facts from the code and compares them to the claims in the docs.
#
# PR-TIME GATE ONLY (owner decision, 2026-09-09): docs are for future Claude
# sessions, so drift is fixed in the SAME PR that caused it, not by a nightly
# bot. This job BLOCKS a PR whose docs disagree with its code — no schedule,
# no auto-fix bot, no monthly hygiene scan. Those existed as a previous
# design (daily cron + a Claude-driven `docs/sync-auto` PR + a monthly
# `doc_clutter_check.py` scan) and were deleted here: the auto-fixer needed a
# standing `CLAUDE_CODE_OAUTH_TOKEN` and a self-merge path that kept breaking,
# and a monthly report nobody read is a report that dies quietly. Fixing
# drift where it was introduced needs neither.
#
# `workflow_dispatch` stays for an on-demand manual run (e.g. after editing
# this checker itself).

on:
  workflow_dispatch: {}
  pull_request: {}
  # Main is judged on its own (2026-10-22): a PR is red only for drift it adds
  # (see the base checkout below), so drift already on main is reported here,
  # on the push, instead of on every open PR.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: doc-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # THE PR'S BASE COMMIT, outside the workspace (a copy inside it would be
      # read as part of this tree). Owner decision 2026-10-22: a PR goes red
      # only for drift its OWN change adds; on 2026-10-21 drift on main turned
      # 28 PRs red at once. If this fails, the drift step below judges every
      # finding as this PR's, exactly as before (fail closed).
      - name: Check out the PR base (to tell this PR's drift from main's)
        id: base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" FETCH_HEAD

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # BLOCKING, and deliberately separate from the drift report below. The
      # size budget is a hard ceiling with one deterministic answer, on a file
      # auto-loaded into every session, so an over-budget merge taxes every
      # future turn.
      # It was claimed as "CI enforces this" in CLAUDE.md while the step below
      # swallowed exit 1 (`[ "$code" -le 1 ]`). This step makes the claim true.
      # Verified by deliberately breaking it: +30 words -> exit 1.
      - name: CLAUDE.md size budget (blocking)
        run: python scripts/doc_sync_check.py --budget-only

      # BLOCKING. Fable 5 found this hole 2026-08-25: the mutation test — the
      # guard OF the guards — was in no workflow at all. It ran only when a
      # human remembered, which means the 27 guards could silently degrade to
      # always-green as the code moved beneath them, and the drift report would
      # keep saying "OK" while watching an empty room. That is the exact failure
      # this repo already wrote a law about ("every guard must declare its
      # drill; an undeclared guard in a workflow is a red build") — violated by
      # the newest guard system in the repo.
      #
      # On PRs too, not just the schedule: a PR that breaks a guard's anchor is
      # the moment to know, not four weeks later.
      - name: Every guard can still go RED (blocking)
        run: python scripts/doc_sync_mutation_test.py

      - name: Run doc drift check
        env:
          BASE_OUTCOME: ${{ steps.base.outcome }}
          BASE_DIR: ${{ runner.temp }}/base
        run: |
          [ "$BASE_OUTCOME" != failure ] || echo "::warning::could not check out the PR base; every finding counts as this PR's"
          [ "$BASE_OUTCOME" = success ] || BASE_DIR=""
          set +e
          python scripts/doc_sync_check.py ${BASE_DIR:+--baseline "$BASE_DIR"} > drift.md 2>&1
          code=$?
          set -e
          cat drift.md
          grep -v '^::' drift.md >> "$GITHUB_STEP_SUMMARY" || true
          # BLOCKING: exit 1 = real drift, exit 2 = the checker itself
          # crashed — either way the PR must not merge with docs that
          # disagree with the code they describe. Fix the doc in this PR.
          [ "$code" -eq 0 ] || exit "$code"

