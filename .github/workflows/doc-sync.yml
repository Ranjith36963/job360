name: doc-sync

# Loop 3 — code↔docs drift check (report-only).
# Reads hard facts from the code and compares them to the claims in the docs.
# On drift (scheduled runs) it opens/updates ONE GitHub issue — it NEVER edits
# files. Read-only by design: see docs/harness/maintenance/loop1_safe_reenable.md.
#
# Also runs on every PR as a NON-BLOCKING report (step summary only) so a
# stale-branch clobber is visible at review time, not 24h later.
#
# Scheduled-run realities (not bugs, just facts):
# - cron only fires on the DEFAULT branch — this does nothing until merged;
# - cron timing is best-effort (the 06:30 slot may slip);
# - GitHub auto-disables schedules after ~60 days without repo activity —
#   if the repo goes quiet, re-enable under Actions or run workflow_dispatch.

on:
  schedule:
    # TWO GEARS, two clocks — they fail differently, so they must not share a
    # cadence. TRUTH ("do the docs match the code?") is a binary bug that appears
    # whenever code changes, so it runs daily. HYGIENE ("is what the agent reads
    # usable?") is a slow trend; a daily clutter alarm would repeat the same
    # numbers every morning and become the thing nobody opens — which is exactly
    # how STATUS-DAILY.md died. Monthly.
    - cron: "30 6 * * *" # 06:30 UTC daily   — TRUTH gear (drift)
    - cron: "0 7 1 * *" # 07:00 UTC, 1st of the month — HYGIENE gear (clutter)
  workflow_dispatch: {}
  pull_request: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: doc-sync
  cancel-in-progress: false

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      drift: ${{ steps.check.outputs.drift }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # BLOCKING, and deliberately separate from the drift report below.
      # The drift report is non-blocking on purpose: it is a daily signal the
      # fixer loop repairs. The size budget is not that kind of thing -- it is a
      # hard ceiling with one deterministic answer, on a file auto-loaded into
      # every session, so an over-budget merge taxes every future turn.
      # It was claimed as "CI enforces this" in CLAUDE.md while the step below
      # swallowed exit 1 (`[ "$code" -le 1 ]`). This step makes the claim true.
      # Verified by deliberately breaking it: +30 words -> exit 1.
      - name: CLAUDE.md size budget (blocking)
        run: python scripts/doc_sync_check.py --budget-only

      # BLOCKING, and the only step here that makes drift IMPOSSIBLE rather
      # than merely visible. Every other check in this workflow reports a doc
      # that has already gone wrong; this one fails when a generated block no
      # longer matches the code that produces it, so the wrong text cannot
      # reach main at all. Also fails if a marker was deleted -- that is a
      # block quietly going back to being hand-written.
      - name: Generated doc blocks are current (blocking)
        run: python scripts/gen_doc_blocks.py

      # BLOCKING. Fable 5 found this hole 2026-08-25: the mutation test — the
      # guard OF the guards — was in no workflow at all. It ran only when a
      # human remembered, which means the 27 guards could silently degrade to
      # always-green as the code moved beneath them, and the drift report would
      # keep saying "OK" while watching an empty room. That is the exact failure
      # this repo already wrote a law about ("every guard must declare its
      # drill; an undeclared guard in a workflow is a red build") — violated by
      # the newest guard system in the repo.
      #
      # On PRs too, not just the schedule: a PR that breaks a guard's anchor is
      # the moment to know, not four weeks later.
      - name: Every guard can still go RED (blocking)
        run: python scripts/doc_sync_mutation_test.py

      - name: Run doc drift check
        id: check
        run: |
          set +e
          python scripts/doc_sync_check.py > drift.md 2>&1
          code=$?
          set -e
          cat drift.md
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
          echo "drift=$code" >> "$GITHUB_OUTPUT"
          # exit 2 = the checker itself crashed — fail the workflow loudly
          [ "$code" -le 1 ] || exit "$code"

      # PR runs stop here: the report is in the step summary, non-blocking.

      - name: Find existing drift issue (exact title)
        id: issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Doc drift detected (Loop 3 doc-sync)"
          # Exact-match on title in jq — `gh --search` tokenizes and can hit
          # unrelated issues; `.[0].number` on [] yields the string "null".
          num=$(gh issue list --state open --json number,title \
                 -q ".[] | select(.title == \"$title\") | .number" | head -1)
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Open or update drift issue (only when the report changed)
        if: github.event_name != 'pull_request' && steps.check.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num="${{ steps.issue.outputs.num }}"
          title="${{ steps.issue.outputs.title }}"
          if [ -z "$num" ] || [ "$num" = "null" ]; then
            gh issue create --title "$title" --body-file drift.md
            exit 0
          fi
          # No daily spam: comment only if the report differs from the last
          # posted body (issue body or newest comment, whichever is later).
          gh issue view "$num" --json body,comments \
            -q 'if (.comments | length) > 0 then .comments[-1].body else .body end' \
            > last_posted.md || true
          if ! diff -q <(tr -d '\r' < drift.md) <(tr -d '\r' < last_posted.md) >/dev/null 2>&1; then
            gh issue comment "$num" --body-file drift.md
          else
            echo "drift unchanged since last post — not commenting"
          fi

      - name: Close drift issue when resolved
        if: github.event_name != 'pull_request' && steps.check.outputs.drift == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num="${{ steps.issue.outputs.num }}"
          if [ -n "$num" ] && [ "$num" != "null" ]; then
            gh issue close "$num" --comment "Drift resolved — docs match code again. (Loop 3 auto-close)"
          fi

  # ────────────────────────────────────────────────────────────────────
  # Auto-fixer (deterministic-ship design, learned from runs 29584302854 +
  # 29587661254): Claude ONLY EDITS files in the workspace — it has no git,
  # no gh, no push (Bash restricted to python). Everything mechanical is
  # plain workflow bash afterwards: assert the diff is 100% *.md, branch,
  # commit, push, PR, merge. The docs-only guarantee is enforced by dumb
  # code, never by the LLM's promise. Claude's full transcript is uploaded
  # as an artifact so any failure is diagnosable.
  # Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret (one-time setup:
  # run `claude setup-token` locally, then
  # `gh secret set CLAUDE_CODE_OAUTH_TOKEN`). Skips politely if absent.
  # ────────────────────────────────────────────────────────────────────
  auto-fix:
    needs: drift-check
    if: >
      github.event_name != 'pull_request' &&
      needs.drift-check.outputs.drift == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check fixer token present
        id: token
        run: echo "have=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.token.outputs.have == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        if: steps.token.outputs.have == 'true'
        with:
          python-version: "3.12"

      # Run the checker HERE and hand the agent a FILE. drift.md from the
      # drift-check job lives on a different runner, so it is not available —
      # and this is what lets the agent hold zero Bash (see the security note
      # on claude_args below).
      - name: Capture the drift report for the agent to read
        if: steps.token.outputs.have == 'true'
        run: |
          set +e
          python scripts/doc_sync_check.py > drift.md 2>&1
          set -e
          echo "--- captured $(wc -l < drift.md) lines of drift ---"

      - name: Claude edits the docs (edit-only — no git, no gh)
        if: steps.token.outputs.have == 'true'
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are the automated Tier-2 doc fixer (Loop 3). Fix the files in
            the current workspace ONLY — do NOT run git, do NOT push, do NOT
            open PRs; a later workflow step ships your edits.
            - You have NO shell (deliberate — see the security note below the
              prompt). Read `drift.md` in the repo root: the workflow just ran
              the checker and captured its report there. Fix EVERY drift row it
              lists (numbers, stale phrases) in the LIVING docs.
            - Add/update the `<!-- doc: LIVING | last-verified: YYYY-MM-DD by /sync -->`
              stamp (today's date, UTC) on every LIVING doc you actually edited.
              Do NOT re-stamp a doc you did not change — a fresh date on an
              unread file is a claim nobody made. ("all six LIVING docs" stood
              here until 2026-08-25, when the real count was 45.)
            - SCOPE: only a doc stamped `<!-- doc: LIVING -->` can drift. A
              PLAN, LOG, REFERENCE or FROZEN doc is a record of a moment, so a
              stale number in one is CORRECT for its date — leave it alone.
              Before this rule existed, thirteen nightly cycles re-litigated
              dated records and the finding count could never reach zero.
            - If a doc claims something the code does not do, add the gap to
              docs/harness/maintenance/PARKED.md — and leave that source doc untouched.
            - Edit ONLY *.md files. Never touch code, configs, or workflows.
            - Work through every row in drift.md. The workflow re-runs the
              checker immediately after you finish and reports what remains, so
              fix what markdown can fix and leave the rest.
          # SECURITY — NO Bash. `Bash(python:*)` was arbitrary code execution in
          # a job holding a write-scoped GITHUB_TOKEN and a personal
          # CLAUDE_CODE_OAUTH_TOKEN, on a PUBLIC repo. One
          # `python -c "...os.environ..."` exfiltrates both. The checker now runs
          # in a deterministic step above and the agent reads its output as a
          # file, so nothing dangerous is reachable from the model.
          claude_args: --allowedTools Edit,Write,Read,Glob,Grep --max-turns 40

      - name: Upload Claude transcript (always — for diagnosis)
        if: always() && steps.token.outputs.have == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: claude-fixer-transcript-${{ github.run_id }}
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore

      - name: Ship the edits (deterministic — docs-only enforced by bash)
        if: steps.token.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # drift.md is the AGENT'S INPUT, not a doc edit. It is untracked and
          # un-ignored, so `git add -A` committed it into every PR (verified on
          # #247/#261/#276/#288/#295 — all five list drift.md as a changed file).
          # Worse, it made the no-edits guard below UNREACHABLE: git status was
          # never empty, so a fixer that edited nothing would still have shipped a
          # PR containing only its own scratch file. Delete it before we look.
          rm -f drift.md
          changed=$(git status --porcelain | awk '{print $2}')
          # Fail LOUD if the fixer made no edits — drift exists, so silence = broken fixer.
          [ -n "$changed" ] || { echo "::error::fixer made NO edits despite drift — check the transcript artifact"; exit 1; }
          # Docs-only cage: any non-markdown change kills the ship. Dumb code, not LLM promises.
          nonmd=$(echo "$changed" | grep -vc '\.md$' || true)
          [ "$nonmd" -eq 0 ] || { echo "::error::fixer touched $nonmd non-markdown file(s) — refusing to ship: $(echo "$changed" | grep -v '\.md$' | tr '\n' ' ')"; exit 1; }
          # ── CONSTITUTION CAGE ──────────────────────────────────────────────
          # "Markdown only" is NOT a sufficient cage, because the files that
          # CAGE EVERY OTHER LOOP ARE MARKDOWN.
          #
          # CLAUDE.md holds the 31 Hard Rules, and repair.yml + pr-repair.yml
          # feed exactly that text to their blind checker as INVARIANTS. Every
          # `.claude/**` file is agent instruction. So under the old rule this
          # loop's model could edit the constraints that every other loop's
          # model is judged against — and then SQUASH-MERGE IT TO main, which
          # is production, with no human in the path. That was the only route
          # by which model-authored text reached prod unreviewed, and it
          # inverts repair.yml's own stated principle: an agent must not
          # rewrite the rules that constrain it.
          #
          # These files may still be EDITED by the fixer (drift in them is real
          # and worth fixing) — they simply cannot be SELF-MERGED. Marking the
          # PR destructive routes it down the existing human-review path below,
          # which already exists for deletions. Same door, same guarantee.
          constitution=$(echo "$changed" | grep -E '^(CLAUDE\.md|[^/]+/CLAUDE\.md|\.claude/)' || true)
          if [ -n "$constitution" ]; then
            echo "::warning::fixer edited constitution file(s) — PR will be left OPEN for human review: $(echo "$constitution" | tr '\n' ' ')"
            destructive_constitution="$constitution"
          fi
          # ── ONE branch, ONE PR ─────────────────────────────────────────────
          # The branch used to be "docs/sync-auto-${{ github.run_id }}" — a NEW
          # head every run, so `gh pr create` opened a NEW PR every run and
          # nothing ever closed the last one. Measured 2026-08-11: five of the
          # repo's fourteen open PRs (#247, #261, #276, #288, #295) were this
          # loop talking to itself, with byte-identical file lists — because the
          # fixer touches CLAUDE.md every run, CLAUDE.md is a constitution file,
          # and constitution PRs are (correctly) left open for a human. So the
          # "left open for review" path is not the rare case here, it is EVERY
          # run, and a per-run branch turned that into a queue of duplicates.
          # A stable branch means run N+1 REPLACES run N's proposal instead of
          # stacking another one beside it, and the single open PR always shows
          # today's report instead of last week's.
          branch="docs/sync-auto"
          git config user.name "loop3-doc-sync[bot]"
          git config user.email "loop3@users.noreply.github.com"
          # -B, not -b: rebuild the branch from the CURRENT main every run, so the
          # PR is always "today's fixes vs main", never a stack of stale commits.
          git checkout -B "$branch"
          git add -A
          # ── Knowledge-safety cage ──────────────────────────────────────────
          # The docs-only check above proves only MARKDOWN changed. It does NOT
          # prove KNOWLEDGE survived: `git status --porcelain` prints
          # "D  docs/x.md" for a DELETION, and `awk '{print $2}'` yields
          # "docs/x.md" — which ends in .md, so nonmd=0 and it shipped.
          # Verified on a clean tree 2026-07-26: deleting a decision doc gave
          # nonmd=0, i.e. the old code would have squash-merged the deletion of
          # a recorded decision (scraping stance, MFA won't-build, audit
          # history) straight to main with NO human review.
          # Rule: an LLM may EDIT docs freely; it may never DESTROY one
          # unreviewed. Deletes/renames still get a PR — they just don't
          # auto-merge. Structural (dumb git plumbing), not an LLM promise.
          destructive=$(git diff --cached --diff-filter=DR --name-only)
          # Constitution edits take the SAME human-review door as deletions:
          # both are changes a model must not merge into production by itself.
          if [ -n "${destructive_constitution:-}" ]; then
            destructive=$(printf '%s\n%s' "$destructive" "$destructive_constitution" | sed '/^$/d')
          fi
          git commit -m "docs: auto-sync (Loop 3) — drift fixed by CI fixer run ${{ github.run_id }}"
          # Force-push is acceptable HERE and only here: the branch is bot-owned
          # and is thrown away and rebuilt from main on every run, so there is no
          # human work to lose. --force-with-lease still refuses if the remote tip
          # is not what we read a moment ago. The lease needs an explicit expected
          # sha, because a bare --force-with-lease compares against a
          # remote-tracking ref this fresh clone may not have.
          remote_sha=$(git ls-remote --heads origin "$branch" | awk '{print $1}')
          # THE LEASE ALONE PROTECTS NOTHING. We read remote_sha seconds before the
          # push, so a human commit already on the branch simply BECOMES the expected
          # value and is force-pushed away. The lease only covers a sub-second race.
          # This PR stays open for human review across daily runs, so a reviewer's
          # "commit suggestion" from the GitHub UI is exactly the thing at risk.
          # Real guard: refuse when the remote tip is neither ours nor an ancestor.
          if [ -n "$remote_sha" ] && ! git merge-base --is-ancestor "$remote_sha" HEAD 2>/dev/null; then
            git fetch --quiet --depth=1 origin "$remote_sha" 2>/dev/null || true
            last_author=$(git log -1 --format=%ae "$remote_sha" 2>/dev/null || echo unknown)
            if [ "$last_author" != "loop3@users.noreply.github.com" ]; then
              echo "::error::$branch tip $remote_sha was authored by '$last_author' (not the bot) and is not in our history — refusing to force-push over human work."
              exit 1
            fi
          fi
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          python scripts/doc_sync_check.py > after.md 2>&1 || true
          # Every run rewrites title AND body, so a long-lived PR can never show a
          # week-old report — the header below names the run that produced it.
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          { echo "_Rebuilt from scratch by Loop 3 doc-sync [run ${{ github.run_id }}]($run_url) at $(date -u '+%Y-%m-%d %H:%M UTC'). This PR is the loop's SINGLE standing PR: the branch is force-pushed and this body is rewritten every run, so what you see is always the latest report._"
            echo
          } > pr-body.md
          if [ -n "$destructive" ]; then
            { echo "> **HUMAN REVIEW REQUIRED — this PR deletes/renames docs or edits an agent-instruction file, so it was NOT auto-merged.**"
              echo ">"
              echo "> Files removed/renamed:"
              echo '> ```'
              echo "$destructive" | sed 's/^/> /'
              echo '> ```'
              echo
              cat after.md
            } >> pr-body.md
          else
            cat after.md >> pr-body.md
          fi
          # Create ONLY when this head has no open PR; otherwise update the one
          # that already exists. This is the actual anti-duplicate gate — a stable
          # branch alone would still make `gh pr create` fail (or, worse, an old
          # closed PR reopen) rather than refresh the live one.
          title="docs: auto-sync (Loop 3) — $(date -u '+%Y-%m-%d')"
          pr=$(gh pr list --state open --head "$branch" --base main \
                 --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" --title "$title" --body-file pr-body.md
            pr=$(gh pr list --state open --head "$branch" --base main \
                   --json number --jq '.[0].number // empty')
          else
            echo "reusing open PR #$pr — refreshing title + body instead of opening a duplicate"
            gh pr edit "$pr" --title "$title" --body-file pr-body.md
          fi
          if [ -n "$destructive" ]; then
            echo "::warning::fixer deleted/renamed doc(s) or edited an agent-instruction file — PR left OPEN for human review: $(echo "$destructive" | tr '\n' ' ')"
            echo "docs PR #${pr:-?} updated but NOT merged (deletes/renames need a human): $(echo "$destructive" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
          else
            # GITHUB_TOKEN-created PRs trigger no CI, so --auto would wait forever.
            # The docs-only + no-destruction asserts above ARE the gate.
            # --admin is REQUIRED once main has a ruleset. `gh pr merge` refuses
            # CLIENT-SIDE on mergeStateStatus=BLOCKED and never calls the API, so
            # the bypass_actors entry never gets a chance to apply (cli/cli#13388).
            # Without this flag the daily doc-sync self-merge dies the moment the
            # ruleset goes active, and the standing PR silently piles up forever.
            # DOES NOT SELF-MERGE ANY MORE, and that is the point.
            #
            # GitHub REFUSED an Integration bypass on this ruleset ("Actor GitHub
            # Actions integration must be part of the ruleset source or owner
            # organization" — personal repos cannot grant one), and --admin needs
            # repo-admin rights that GITHUB_TOKEN does not have. So there is no
            # mechanism left by which this could merge itself past required checks.
            #
            # Losing it is an improvement. This PR is LLM-EDITED prose, and it is
            # opened with GITHUB_TOKEN, which means GitHub Actions never runs on it
            # (the recursion rule). It was therefore merging model-written changes
            # into production with ZERO checks, daily — one of the findings of the
            # 2026-08-11 harness audit. The standing PR now waits for a human, which
            # is all it ever should have done.
            # Was two lines that contradicted each other: a broken line-continuation
            # (a literal \n reached echo, printing a stray "n") followed by a
            # leftover "shipped and merged" from the self-merging era. The run
            # summary therefore claimed the PR had merged when it had not — the
            # loop's own log lying about the loop. One honest line now.
            echo "docs PR ${pr:-$branch} is ready for review — NOT auto-merged." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Close the drift issue NOW, in this run. Previously the issue was
          # only closed by the NEXT scheduled run's drift==0 branch, so a
          # fully-fixed issue sat open ~22h looking unresolved (observed:
          # issue #79 fixed by PR #80 two minutes later, still open next day).
          # Re-verify against the merged result before closing — if the fixer
          # only fixed *some* rows, the issue must stay open.
          git fetch origin main --quiet
          git checkout --quiet origin/main -- . 2>/dev/null || true
          if python scripts/doc_sync_check.py > verify.md 2>&1; then
            title="Doc drift detected (Loop 3 doc-sync)"
            num=$(gh issue list --state open --json number,title \
                   -q ".[] | select(.title == \"$title\") | .number" | head -1)
            if [ -n "$num" ]; then
              gh issue close "$num" --comment "Auto-fixed and verified clean by run ${{ github.run_id }}. $(head -1 verify.md)"
              echo "closed drift issue #$num" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "drift REMAINS after the fix — leaving the issue open" >> "$GITHUB_STEP_SUMMARY"
            cat verify.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Note when fixer is not configured
        if: steps.token.outputs.have != 'true'
        run: echo "CLAUDE_CODE_OAUTH_TOKEN secret not set — drift issue filed, auto-fix skipped." >> "$GITHUB_STEP_SUMMARY"

  # ── HYGIENE gear (CURATE) — monthly ────────────────────────────────────────
  # doc_sync_check.py asks "do the docs match the code?" (TRUTH).
  # doc_clutter_check.py asks "is what the agent READS usable?" (HYGIENE).
  # Different failure: a doc can be perfectly true and still be a 1,578-line file
  # nothing links to — worse than missing, because an agent reads it, trusts it,
  # and answers confidently from a corner of it (measured here: findings M2/M10
  # sat recorded as "open" months after the code fixed them).
  #
  # It is a RATCHET, not a target: it fires only when the estate gets WORSE than
  # the committed budget, never on the (large, slow-closing) gap to ideal. A
  # check that repeats the same complaint every run is a nag, and a nag gets
  # ignored — the way STATUS-DAILY.md died.
  #
  # Report-only, by design. Deleting docs is a judgement call about KNOWLEDGE,
  # and an auto-fixer here would also ping-pong with the truth gear (which flags
  # a moved/removed doc as drift and would put it straight back).
  clutter-check:
    name: Doc clutter (CURATE gear)
    # Monthly cron only, or on demand. github.event.schedule carries the cron
    # that actually fired, so the two gears share a workflow without colliding.
    if: github.event.schedule == '0 7 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # staleness needs real commit dates, not a shallow clone

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Measure the doc estate
        id: clutter
        run: |
          set +e
          python scripts/doc_clutter_check.py > clutter.md 2>&1
          code=$?
          set -e
          cat clutter.md
          cat clutter.md >> "$GITHUB_STEP_SUMMARY"
          echo "regressed=$code" >> "$GITHUB_OUTPUT"
          # exit 2 = the checker itself broke — fail LOUD, never silently green
          [ "$code" -le 1 ] || exit "$code"

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Doc estate regressed (Loop 3, CURATE gear)"
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "${{ steps.clutter.outputs.regressed }}" = "1" ]; then
            if [ -z "$num" ]; then
              gh issue create --title "$title" --body-file clutter.md
            else
              gh issue comment "$num" --body-file clutter.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" \
              --comment "Back within budget in run ${{ github.run_id }}. (CURATE auto-close)"
          fi
