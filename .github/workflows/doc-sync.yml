name: doc-sync

# Loop 3 — code↔docs drift check.
# Reads hard facts from the code and compares them to the claims in the docs.
#
# PR-TIME GATE ONLY (owner decision, 2026-09-09): docs are for future Claude
# sessions, so drift is fixed in the SAME PR that caused it, not by a nightly
# bot. This job BLOCKS a PR whose docs disagree with its code — no schedule,
# no auto-fix bot, no monthly hygiene scan. Those existed as a previous
# design (daily cron + a Claude-driven `docs/sync-auto` PR + a monthly
# `doc_clutter_check.py` scan) and were deleted here: the auto-fixer needed a
# standing `CLAUDE_CODE_OAUTH_TOKEN` and a self-merge path that kept breaking,
# and a monthly report nobody read is a report that dies quietly. Fixing
# drift where it was introduced needs neither.
#
# `workflow_dispatch` stays for an on-demand manual run (e.g. after editing
# this checker itself).

on:
  workflow_dispatch: {}
  pull_request: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: doc-sync
  cancel-in-progress: false

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      drift: ${{ steps.check.outputs.drift }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # BLOCKING, and deliberately separate from the drift report below. The
      # size budget is a hard ceiling with one deterministic answer, on a file
      # auto-loaded into every session, so an over-budget merge taxes every
      # future turn.
      # It was claimed as "CI enforces this" in CLAUDE.md while the step below
      # swallowed exit 1 (`[ "$code" -le 1 ]`). This step makes the claim true.
      # Verified by deliberately breaking it: +30 words -> exit 1.
      - name: CLAUDE.md size budget (blocking)
        run: python scripts/doc_sync_check.py --budget-only

      # BLOCKING, and the only step here that makes drift IMPOSSIBLE rather
      # than merely visible. Every other check in this workflow reports a doc
      # that has already gone wrong; this one fails when a generated block no
      # longer matches the code that produces it, so the wrong text cannot
      # reach main at all. Also fails if a marker was deleted -- that is a
      # block quietly going back to being hand-written.
      - name: Generated doc blocks are current (blocking)
        run: python scripts/gen_doc_blocks.py

      # BLOCKING. Fable 5 found this hole 2026-08-25: the mutation test — the
      # guard OF the guards — was in no workflow at all. It ran only when a
      # human remembered, which means the 27 guards could silently degrade to
      # always-green as the code moved beneath them, and the drift report would
      # keep saying "OK" while watching an empty room. That is the exact failure
      # this repo already wrote a law about ("every guard must declare its
      # drill; an undeclared guard in a workflow is a red build") — violated by
      # the newest guard system in the repo.
      #
      # On PRs too, not just the schedule: a PR that breaks a guard's anchor is
      # the moment to know, not four weeks later.
      - name: Every guard can still go RED (blocking)
        run: python scripts/doc_sync_mutation_test.py

      - name: Run doc drift check
        id: check
        run: |
          set +e
          python scripts/doc_sync_check.py > drift.md 2>&1
          code=$?
          set -e
          cat drift.md
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
          echo "drift=$code" >> "$GITHUB_OUTPUT"
          # BLOCKING: exit 1 = real drift, exit 2 = the checker itself
          # crashed — either way the PR must not merge with docs that
          # disagree with the code they describe. Fix the doc in this PR.
          [ "$code" -eq 0 ] || exit "$code"

      # Only a manual (workflow_dispatch) run reaches here — a PR run either
      # passed (drift == 0, nothing to file) or already failed the job above.

      - name: Find existing drift issue (exact title)
        id: issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Doc drift detected (Loop 3 doc-sync)"
          # Exact-match on title in jq — `gh --search` tokenizes and can hit
          # unrelated issues; `.[0].number` on [] yields the string "null".
          num=$(gh issue list --state open --json number,title \
                 -q ".[] | select(.title == \"$title\") | .number" | head -1)
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Open or update drift issue (only when the report changed)
        if: github.event_name != 'pull_request' && steps.check.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num="${{ steps.issue.outputs.num }}"
          title="${{ steps.issue.outputs.title }}"
          if [ -z "$num" ] || [ "$num" = "null" ]; then
            gh issue create --title "$title" --body-file drift.md
            exit 0
          fi
          # No daily spam: comment only if the report differs from the last
          # posted body (issue body or newest comment, whichever is later).
          gh issue view "$num" --json body,comments \
            -q 'if (.comments | length) > 0 then .comments[-1].body else .body end' \
            > last_posted.md || true
          if ! diff -q <(tr -d '\r' < drift.md) <(tr -d '\r' < last_posted.md) >/dev/null 2>&1; then
            gh issue comment "$num" --body-file drift.md
          else
            echo "drift unchanged since last post — not commenting"
          fi

      - name: Close drift issue when resolved
        if: github.event_name != 'pull_request' && steps.check.outputs.drift == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num="${{ steps.issue.outputs.num }}"
          if [ -n "$num" ] && [ "$num" != "null" ]; then
            gh issue close "$num" --comment "Drift resolved — docs match code again. (Loop 3 auto-close)"
          fi

