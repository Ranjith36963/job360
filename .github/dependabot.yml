# Dependency + vulnerability alerts (docs/fable/05 C10).
# Without this, nothing tells us a dependency has a published CVE — the audit
# flagged it as the cheapest security win available.
#
# Weekly + grouped so this surfaces real signal, not a PR drip. Security
# updates still arrive IMMEDIATELY regardless of schedule/groups/ignores —
# GitHub raises those out-of-band from GHSA advisories.
#
# Flood control (2026-07-17): the first run opened 9 PRs because Dependabot
# never groups MAJOR bumps by default — each major spawns its own PR. Fix:
#   - a `*-major` group per ecosystem → all majors land as ONE PR, not N.
#   - `ignore` rules for majors that are BLOCKED upstream (they'd reopen every
#     week and always fail CI). These are DEV-TOOLING only (not shipped runtime),
#     so ignoring them carries no security downside. Take them deliberately by
#     deleting the ignore line when the toolchain catches up.
#
# Cooldown (2026-10-20): a version is not proposed until it has been public for
# 7 days (14 for a major), so a hijacked release that is caught and yanked
# within a week never reaches a PR. Security updates ignore cooldown.
version: 2
updates:
  # Backend — Python deps declared in backend/pyproject.toml, installed from the
  # hashed locks backend/requirements*.lock.txt (2026-10-20). Dependabot reads
  # only `requirements*.txt` / `*.in` files (dependabot-core
  # python/shared_file_fetcher.rb), hence the `.lock.txt` names. With no `.in`
  # file it edits each pin in place and rewrites that pin's hashes in every
  # lock that names it; scripts/check_py_lock.py and the hashed install in CI
  # turn a bump the other pins cannot satisfy red, and the fix is
  # `python3.12 scripts/lock_deps.py` on the PR branch.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      pip-major:
        update-types:
          - "major"
    # The aiohttp `>=3.14` ignore is GONE (2026-10-20): pyproject requires
    # >=3.14.1 since the test-only shim in backend/tests/conftest.py, so the
    # ignore had come to mean "never bump the aiohttp the locks ship".
    commit-message:
      prefix: "chore(deps)"

  # Frontend — npm deps in frontend/package.json
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
    ignore:
      # TypeScript 7 (Go-native compiler) — openapi-typescript, eslint-config-next,
      # msw all still peer-require ^5. Un-ignore when the toolchain ships ^7. (PR #61)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint 10 — eslint-config-next@16 pulls eslint-plugin-jsx-a11y which caps
      # at eslint 9. Un-ignore when Vercel's config supports eslint 10. (PR #64)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # The vitest test-runner family is EXACT-PEER-PINNED: @vitest/coverage-v8
      # hard-peers vitest at the exact version, and coverage-v8 ships no 3.x
      # patch (its only next release is 4.x, which needs vitest 4). So ANY solo
      # bump — even a vitest 3.2.4→3.2.7 patch — breaks `npm ci` with ERESOLVE
      # (PRs #62/#67/#68). Freeze the whole family at its current 3.x; to move,
      # co-bump vitest + @vitest/coverage-v8 to 4.x by hand and re-run tests.
      - dependency-name: "vitest"
      - dependency-name: "@vitest/coverage-v8"
      # jsdom 26→29 major — dev test-DOM env; take deliberately. (PR #68)
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # CI workflow actions (pinned action versions go stale + carry their own CVEs).
  # Actions rarely break — group everything into one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
