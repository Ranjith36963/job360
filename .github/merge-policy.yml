# ═══════════════════════════════════════════════════════════════════════════
# THE MERGE POLICY — the one file the owner turns.
#
# Everything else in this harness reads this file. `scripts/merge_cage.py` is
# 1,900 lines of machinery; this is the dial. If you want the machine to merge
# more, you widen a list HERE — you never edit the Python.
#
# THE IDEA IN ONE LINE
#   Not every change is the same kind of risk, so not every change gets the
#   same gate. Three lanes, by who gets hurt if it is wrong.
#
#   HARNESS  — Ranjith code. Your weapon. If it breaks, YOU are inconvenienced.
#              No user ever sees it. Fast lane.
#   PRODUCT  — Job360. If it breaks, a real person on job360.uk is hurt.
#              Slow lane: it must be WATCHED alive before it is trusted.
#   OWNER    — the things a machine must never decide. It stops and waits.
#
# THE RULE THAT MAKES IT SAFE
#   Speed comes from being able to UNDO, not from being sure. The product lane
#   is fast because `deploymentRollback` puts users back in seconds. The harness
#   lane is fast because nothing live is at stake. The owner lane has neither,
#   so it has a human.
# ═══════════════════════════════════════════════════════════════════════════

version: 1

# ── The four tags ──────────────────────────────────────────────────────────
# A lane lists which of these must be GREEN before anything merges. Each one is
# produced by a real job — none of them is an opinion, and none of them is text
# a model wrote. If a required tag is MISSING, that is not a pass; the cage
# waits. Silence is never consent.
#
#   ci        every required check on the PR is green         (GitHub check runs)
#   review    CodeRabbit left no unresolved blocking thread   (GitHub review API)
#   security  gitleaks + pip-audit + npm audit + CodeQL green (security.yml)
#   verify    THE APP WAS ACTUALLY RUN AND WATCHED            (verify-live.yml)
#   drill     every guard in the harness was proven able to fail
#             (scripts/drill_registry.py — a guard that cannot go red is decoration)
#   ratchets  no quality number went backwards (see RATCHETS below)
#
# `verify` is the one that fixes the old cage's blind spot. The old cage judged
# a change by its FILENAME, which cannot tell a logging fix from a deleted
# `Depends(require_user)`. `verify` does not guess: it starts the app, drives a
# real browser, calls the real routes, and reports what happened.

lanes:

  # ─────────────────────────────────────────────────────────────────────────
  # HARNESS — "Ranjith code". The weapon you are building for yourself.
  #
  # Nothing under these paths runs on job360.uk. The blast radius is your own
  # workflow. Historically this was DENIED outright on the theory that "an agent
  # editing its own guards is how a cage is escaped" — true, but the answer to
  # that is the `drill` tag, not a blanket refusal. A guard that has been
  # watched go red cannot be quietly neutered without the drill going red too.
  # ─────────────────────────────────────────────────────────────────────────
  harness:
    description: "Your tooling. Breaks you, never a user."
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - ".claude/**"
      - "docs/**"
      - "*.md"
      - "backend/scripts/**"
      # Repo plumbing. Measured over the last 60 merges, these three alone
      # pushed PRs into the owner lane purely because nobody had ever named
      # them. Ignore-files and linter config cannot reach a user.
      - ".gitignore"
      - ".gitattributes"
      - "*.dockerignore"
      - ".coderabbit.yaml"
      - "pyrightconfig.json"
      - ".vscode/**"
    requires: [ci, review, drill]
    auto_merge: true
    watch: false            # nothing live to watch
    rollback: git-revert    # a normal revert commit is enough

  # ─────────────────────────────────────────────────────────────────────────
  # PRODUCT — Job360 itself. Real people, real jobs, real inboxes.
  #
  # This lane may merge automatically, but it is never TRUSTED at merge time.
  # It is trusted 15 minutes later, by a watcher, or it is taken back.
  # ─────────────────────────────────────────────────────────────────────────
  product:
    description: "What a user on job360.uk sees and touches."
    paths:
      - "backend/src/**"
      - "frontend/src/**"
      - "backend/tests/**"
      - "frontend/tests/**"
      # The generated API contract. It moved in 12 of the last 60 merges and was
      # unclassified in every one of them, which alone sent those PRs to the
      # owner lane. It is PRODUCT, not plumbing: `check:types-drift` failing here
      # means the frontend and backend disagree about a real route.
      - "frontend/openapi.json"
      # DATA IS PRODUCT. The gazetteer decides which jobs enter the catalogue
      # (rule #30) and the job-signal term files feed scoring. A change here is
      # a change to what a user is shown, even though no code moved -- which is
      # exactly the kind of edit a "only code is risky" instinct waves through.
      - "backend/data/**"
    requires: [ci, review, security, verify, ratchets]
    auto_merge: true
    watch_minutes: 15       # how long the post-merge watcher stares at prod
    rollback: railway       # `deploymentRollback` — seconds, no rebuild

  # ─────────────────────────────────────────────────────────────────────────
  # OWNER — no machine decides these. Ever.
  #
  # DENY BEATS ALLOW. A PR touching one owner-lane file is an owner-lane PR,
  # no matter what else is in it. This is not a risk score; it is a door.
  #
  # Two kinds live here, and the second is the load-bearing one:
  #   1. Irreversible against live data, or holds secrets.
  #   2. THE CAGE ITSELF. A machine may not widen the rule that decides what a
  #      machine may merge. That is the only recursion that actually matters.
  # ─────────────────────────────────────────────────────────────────────────
  owner:
    description: "Irreversible, secret, or the cage itself. Always by hand."
    paths:
      # irreversible against live data
      - "backend/migrations/**"
      - "backend/src/models.py"          # normalized_key -> dedup -> lost rows
      # secrets and infrastructure
      - "*.env*"
      - "railway.json"
      - "*docker-compose*"
      - "*Dockerfile*"
      - "backend/src/core/settings.py"   # flags change prod behaviour globally
      # dependency manifests run postinstall scripts on the build host;
      # dependabot-auto.yml already owns the safe subset of this decision
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "requirements*.txt"
      # ── the cage may not edit the cage ──────────────────────────────────
      - ".github/merge-policy.yml"       # this file
      - "scripts/merge_cage.py"
      - "scripts/drill_registry.py"
      - ".github/workflows/auto-merge.yml"
      - ".github/workflows/verify-live.yml"
      - ".github/workflows/post-merge-watch.yml"
      # ── the owner's own words ───────────────────────────────────────────
      - "CLAUDE.md"
      - "docs/product_design_rules.md"   # the canonical text of rules #29-31
      - "docs/plans/batch-2-decisions.md"

# ── Size ceiling ───────────────────────────────────────────────────────────
# Not a quality judgement — a REVIEWABILITY one. Past this, no reviewer (human
# or machine) is actually reading it, they are skimming. Big changes are fine;
# they just go to a human.
size:
  max_files: 40
  max_lines: 1500

# ── Ratchets ───────────────────────────────────────────────────────────────
# A ratchet is a number that may HOLD or IMPROVE and may never get worse.
# It is the only gate that can see SLOW DECAY — the failure mode where no
# single PR looks bad and six months later the numbers are gone.
#
# Measured by the same script CI runs. Never re-implemented here: an inline
# reimplementation once counted comment lines and reported 4 against a true 0.
ratchets:
  - name: mypy errors
    direction: down
  - name: ruff findings
    direction: down
  - name: open security alerts
    direction: down

# ── The live watch ─────────────────────────────────────────────────────────
# What "prod is bad" MEANS, as numbers, decided before the outage rather than
# during it. Any one of these trips the rollback.
watch:
  readyz_url: "https://backend-production-80e8e.up.railway.app/api/readyz"
  frontend_url: "https://frontend-production-c608f.up.railway.app/"
  poll_seconds: 60
  trip_when:
    readyz_non_200: 2          # two consecutive failed readiness probes
    frontend_non_200: 2
    sentry_new_issues: 1       # any NEW unresolved issue first seen after merge
    sentry_error_rate_multiple: 3.0   # 3x the pre-merge hourly error rate

# ── The undo ───────────────────────────────────────────────────────────────
# Verified 2026-08-17 against docs.railway.com: `deploymentRollback(id)` is in
# Railway's PUBLIC GraphQL API and reachable from CI via `railway api`. It
# restores the previous deployment's IMAGE AND ITS VARIABLES with no rebuild,
# which is why it is seconds and not minutes.
#
# Constraint the docs are explicit about: it only works where the target
# deployment reports `canRollback: true`. The watcher CHECKS that flag before
# it merges anything into this lane — an undo you have not confirmed you
# possess is not an undo.
rollback:
  provider: railway
  services: [backend, frontend]
  confirm_capability_before_merge: true
  on_rollback:
    reopen_pr: true
    open_issue: true
    notify_slack: true
