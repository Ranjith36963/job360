# Production compose file.
# For local dev (Redis + Postgres only) use docker-compose.dev.yml instead.
#
# There is no `worker` service: the ARQ worker was deleted with the sourcing
# era (slice 5, #483) — nothing runs in the background. Redis stays because
# the auth rate limiter can share its windows across replicas through it
# (RATE_LIMIT_REDIS).
#
# Usage:
#   cp .env.example .env          # fill in secrets
#   docker compose -f docker-compose.prod.yml up -d
#
# Required env vars (set in .env or your deploy platform):
#   POSTGRES_PASSWORD, SESSION_SECRET, CHANNEL_ENCRYPTION_KEY
# POSTGRES_PASSWORD has NO default on purpose (M10) — compose refuses to start
# without it rather than fall back to a committed password.
# Optional LLM keys: GEMINI_API_KEY, GROQ_API_KEY, CEREBRAS_API_KEY, etc.
# See .env.example for the full list.

services:

  # ─── Infrastructure ─────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: job360
      # M10 — never commit a production password. `:?` makes compose FAIL LOUDLY
      # if POSTGRES_PASSWORD is unset, rather than silently starting Postgres
      # with an empty/!default password. Set it in the deploy environment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: job360
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job360 -d job360"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ─── Application ────────────────────────────────────────────────────────

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://job360:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/job360
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      # LLM provider keys (all optional — CV parsing and the tailor degrade
      # to the next provider when one is empty)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # The frontend proxies /api/* to the backend via next.config.ts rewrites.
      # Inside the compose network the backend is reachable by service name.
      BACKEND_ORIGIN: http://backend:8000
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
